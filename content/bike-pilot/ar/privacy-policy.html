    <template id="doc-content" data-doc-title="سياسة الخصوصية">
      <p><em>آخر تحديث: 2026-08-11</em></p>

      <p>
        توضح سياسة الخصوصية هذه كيفية تعامل BikePilot ("التطبيق"، "نحن") مع المعلومات عند استخدامك للتطبيق. تم تطوير BikePilot ونشره من قبل Sebastian Gasch ("المطوّر").
      </p>

      <h2>ملخص</h2>

      <p>
        صُمّم BikePilot ليعمل بالكامل على جهازك. نحن لا نشغّل خادمًا خلفيًا، ولا نجمع أي بيانات تحليلية، ولا نبيع بياناتك الشخصية أو نشاركها مع أي طرف ثالث. كما أن التطبيق لا يتعقّبك عبر التطبيقات أو مواقع الويب المملوكة لشركات أخرى.
      </p>

      <h2>المعلومات التي يصل إليها التطبيق</h2>

      <p>
        لتقديم وظائفه الأساسية ككمبيوتر دراجات، يطلب BikePilot الوصول إلى إمكانات الجهاز التالية. ولا يُطلب هذا الوصول إلا عند الحاجة إليه وفقط بعد الحصول على إذنك من خلال نوافذ أذونات iOS القياسية.
      </p>

      <table>
        <thead>
          <tr>
            <th>البيانات / الإذن</th>
            <th>الغرض</th>
            <th>مكان التخزين</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>الموقع (GPS)</strong> ("أثناء الاستخدام")</td>
            <td>قياس السرعة والمسافة والارتفاع والانحدار، وتسجيل مسارك على الخريطة أثناء الرحلة.</td>
            <td>على جهازك فقط، كجزء من سجل رحلاتك المحلي.</td>
          </tr>
          <tr>
            <td><strong>الحركة واللياقة (مقياس الضغط الجوي)</strong></td>
            <td>تقدير تغيّرات الارتفاع ودرجة الانحدار أثناء قيادتك.</td>
            <td>على جهازك فقط؛ ولا يتم تخزينها كبيانات مستشعر خام بعد انتهاء الجلسة الحالية.</td>
          </tr>
          <tr>
            <td><strong>Bluetooth</strong></td>
            <td>الاتصال بمستشعرات Bluetooth Low Energy (BLE) الخاصة بك — مثل مستشعر معدل نبض القلب، ومستشعر السرعة والدوران، ومستشعر الحرارة — لعرض بيانات الرحلة المباشرة.</td>
            <td>تتم معالجة قراءات المستشعرات على جهازك لحظيًا وتُخزَّن محليًا كجزء من بيانات رحلتك؛ ولا يقوم BikePilot بإرسال بيانات المستشعرات إلى أي جهة.</td>
          </tr>
          <tr>
            <td><strong>الملفات (الوصول إلى مجلدي المستندات/التنزيلات)</strong></td>
            <td>تمكينك من استيراد ملفات <code>.gpx</code> التي تختارها بنفسك، وتصدير رحلاتك المسجّلة كملفات <code>.gpx</code> (مثلًا للمشاركة أو النسخ الاحتياطي).</td>
            <td>تتم قراءة الملفات التي تختار استيرادها على جهازك؛ أما الملفات المصدّرة فتُكتب إلى الموقع الذي تحدده (مثل تطبيق "الملفات" أو AirDrop أو Mail) باستخدام ورقة المشاركة القياسية في iOS.</td>
          </tr>
        </tbody>
      </table>

      <h2>البيانات التي لا نجمعها</h2>

      <ul>
        <li>نحن لا نستخدم أي حِزم SDK للتحليلات أو الإعلانات أو تقارير الأعطال.</li>
        <li>نحن لا نشغّل خوادمنا الخاصة، ولا يرسل التطبيق رحلاتك أو سجل موقعك أو قراءات المستشعرات أو أي بيانات شخصية أخرى إلينا أو إلى أي طرف ثالث.</li>
        <li>نحن لا نستخدم تقنيات التتبع (وفقًا لتعريف إطار App Tracking Transparency من Apple) ولا نطلب إذن التتبع.</li>
        <li>نحن لا نجمع معلومات الحساب ولا نخزنها، لأن BikePilot لا يتطلب إنشاء حساب أو تسجيل الدخول.</li>
      </ul>

      <h2>تخزين البيانات والاحتفاظ بها</h2>

      <p>
        تُخزَّن جميع بيانات الرحلات (مسارات GPS، وقراءات السرعة/الدوران/معدل نبض القلب/الحرارة، والإعدادات، والرحلات المسجّلة) محليًا على جهازك باستخدام آليات التخزين القياسية على أجهزة Apple (<code>UserDefaults</code> والتخزين المحلي للتطبيق). ولا تتم مزامنة هذه البيانات إلى iCloud أو أي خدمة سحابية أخرى من خلال التطبيق نفسه، إلا إذا كان النسخ الاحتياطي على جهازك عبر iCloud يتضمن البيانات المحلية الخاصة بالتطبيق ضمن نسخة احتياطية على مستوى النظام؛ وهذا أمر تتحكم فيه إعدادات iOS على جهازك، وليس BikePilot.
      </p>

      <p>
        يمكنك حذف جميع بيانات الرحلات المخزنة محليًا في أي وقت، إما بحذف الرحلات المسجّلة من داخل التطبيق، أو بحذف التطبيق من جهازك، مما يؤدي إلى إزالة جميع بياناته المحلية وفقًا لسلوك حذف تطبيقات iOS القياسي.
      </p>

      <h2>استيراد/تصدير GPX</h2>

      <p>
        يتيح لك BikePilot استيراد ملفات <code>.gpx</code> التي تختارها وتصدير رحلاتك المسجّلة كملفات <code>.gpx</code> باستخدام ورقة المشاركة في iOS. وأي استخدام تقوم به للملف بعد تصديره (مثل مشاركته مع خدمة تابعة لجهة خارجية) هو قرارك وحدك ويخضع لممارسات الخصوصية الخاصة بتلك الجهة، وليس لهذه السياسة.
      </p>

      <h2>الاشتراكات (BikePilot PRO)</h2>

      <p>
        يقدّم BikePilot اشتراكًا اختياريًا متجددًا تلقائيًا ("BikePilot PRO") يفتح ميزات إضافية. تتم عمليات شراء الاشتراك وتجديده واستعادته بالكامل عبر StoreKit وحساب Apple ID / App Store الخاص بك. نحن لا نتلقى معلومات الدفع الخاصة بك ولا نخزنها — إذ تتم معالجة بيانات الشراء والفوترة والاحتفاظ بها من قبل Apple وفقًا لـ <a href="https://www.apple.com/legal/privacy/">سياسة خصوصية Apple</a>.
      </p>

      <h2>خصوصية الأطفال</h2>

      <p>
        BikePilot غير موجّه إلى الأطفال ولا يجمع عن علم أي بيانات شخصية منهم. وبما أن التطبيق لا يجمع أصلًا أي بيانات شخصية ولا يرسلها إلينا، فلا يحتفظ المطوّر بأي بيانات تخص أي مستخدم، بمن فيهم الأطفال.
      </p>

      <h2>حقوقك</h2>

      <p>
        نظرًا لأن جميع البيانات الشخصية الناتجة عن استخدام BikePilot (مثل سجل الموقع وبيانات الرحلات وقراءات المستشعرات) تبقى على جهازك ولا تُنقل إلينا مطلقًا، فأنت تحتفظ بالتحكم الكامل فيها في جميع الأوقات: يمكنك عرضها أو تصديرها أو حذفها مباشرة داخل التطبيق أو عبر إزالة التطبيق. ولأننا لا نحتفظ بأي من بياناتك الشخصية على أنظمتنا، فلا توجد عملية منفصلة لتقديم طلب وصول إلى تلك البيانات أو تصحيحها أو حذفها لدينا.
      </p>

      <p>
        إذا كانت لديك أسئلة حول هذه السياسة أو حول كيفية تعامل التطبيق مع أذونات الجهاز، فيمكنك التواصل معنا باستخدام التفاصيل الواردة أدناه.
      </p>

      <h2>التغييرات على هذه السياسة</h2>

      <p>
        قد نحدّث سياسة الخصوصية هذه من وقت لآخر، على سبيل المثال لتعكس ميزات جديدة في التطبيق. ويشير تاريخ "آخر تحديث" أعلى هذا المستند إلى آخر مرة تم فيها تعديلها. ويُعد استمرارك في استخدام التطبيق بعد أي تغيير قبولًا منك للسياسة المحدّثة.
      </p>
