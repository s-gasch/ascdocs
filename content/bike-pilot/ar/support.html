    <template id="doc-content" data-doc-title="الدعم">
      <p><em>آخر تحديث: 2026-08-11</em></p>

      <p>
        هل تحتاج إلى مساعدة بشأن BikePilot؟ تتضمن هذه الصفحة الأسئلة الشائعة وخطوات استكشاف المشكلات وإصلاحها، إضافةً إلى كيفية التواصل معنا للحصول على دعم إضافي.
      </p>

      <h2>التواصل</h2>

      <p>
        إذا لم تجد إجابة عن سؤالك أدناه، فأرسل إلينا رسالة بريد إلكتروني وسنرد عليك في أقرب وقت ممكن:
      </p>

      <p>
        <strong>البريد الإلكتروني:</strong> <a href="mailto:sebastian.gasch@outlook.com">sebastian.gasch@outlook.com</a>
      </p>

      <p>
        يرجى تضمين المعلومات التالية عند الإبلاغ عن مشكلة حتى نتمكن من مساعدتك بشكل أسرع:
      </p>

      <ul>
        <li>إصدار التطبيق (الإعدادات → حول داخل التطبيق)</li>
        <li>إصدار iOS لديك وطراز الجهاز</li>
        <li>خطوات إعادة ظهور المشكلة</li>
        <li>لقطات شاشة أو تسجيلات للشاشة، إن وُجدت</li>
      </ul>

      <h2>الأسئلة الشائعة</h2>

      <h3>GPS وتتبع الموقع</h3>

      <p><strong>تبدو بيانات السرعة/المسافة/المسار غير دقيقة.</strong></p>

      <p>
        تعتمد دقة GPS على جهازك، والطقس، والبيئة المحيطة بك (مثل المباني المرتفعة والأنفاق وكثافة الأشجار وغيرها، إذ قد تؤثر جميعها في جودة الإشارة). تأكد من أن إذن الموقع مضبوط على "أثناء استخدام التطبيق" أو "دائمًا" ضمن الإعدادات → الخصوصية والأمن → خدمات الموقع → BikePilot، وأن "خدمات الموقع" مفعّلة على مستوى النظام.
      </p>

      <p><strong>توقف التطبيق عن تتبع رحلتي عندما قفلت الهاتف / انتقلت إلى تطبيق آخر.</strong></p>

      <p>
        يستخدم BikePilot تحديثات الموقع في الخلفية لمواصلة التسجيل أثناء قفل الجهاز أو أثناء استخدامك لتطبيق آخر. تأكد من منح إذن الموقع، ومن أن "نمط الطاقة المنخفضة" لا يقيّد نشاط الخلفية بشكل مفرط، لأن ذلك قد يؤثر في تكرار تحديثات GPS على بعض الأجهزة.
      </p>

      <h3>مستشعرات Bluetooth</h3>

      <p><strong>مستشعر معدل نبض القلب / السرعة والدوران / الحرارة لا يتصل.</strong></p>

      <ol>
        <li>تأكد من أن المستشعر قيد التشغيل وأنه ضمن النطاق (عادةً من متر إلى مترين أثناء الاقتران).</li>
        <li>تأكد من أن Bluetooth مفعّل في إعدادات iOS وأن BikePilot لديه إذن Bluetooth (الإعدادات → الخصوصية والأمن → Bluetooth → BikePilot).</li>
        <li>بعض المستشعرات لا يمكنها الاتصال إلا بتطبيق واحد في الوقت نفسه — افصل المستشعر عن أي تطبيق آخر (مثل تطبيق آخر للدراجات أو اللياقة) قبل توصيله في BikePilot.</li>
        <li>جرّب إعادة تشغيل المستشعر (أزل البطارية ثم أعد تركيبها، إذا كان ذلك ينطبق) ثم أعد إجراء البحث من إعدادات المستشعر داخل التطبيق.</li>
      </ol>

      <p><strong>ينقطع اتصال المستشعر باستمرار أثناء الرحلة.</strong></p>

      <p>
        يحدث هذا عادةً بسبب انخفاض بطارية المستشعر، أو زيادة المسافة عن الجهاز، أو التداخل في Bluetooth. وغالبًا ما يؤدي استبدال بطارية المستشعر والحفاظ على الهاتف ضمن النطاق إلى حل المشكلة.
      </p>

      <h3>الارتفاع والانحدار</h3>

      <p><strong>تبدو قراءات الارتفاع/الانحدار غير دقيقة.</strong></p>

      <p>
        يستخدم BikePilot مقياس الضغط الجوي في جهازك إلى جانب GPS لتقدير الارتفاع ودرجة الانحدار. وقد تنحرف القراءات البارومترية قليلًا بمرور الوقت أو تتأثر بتغيرات الطقس السريعة؛ وهذه محدودية في العتاد وليست خللًا في التطبيق.
      </p>

      <h3>استيراد/تصدير GPX</h3>

      <p><strong>كيف أصدّر رحلة؟</strong></p>

      <p>
        افتح الرحلة من سجل رحلاتك، ثم استخدم خيار المشاركة/التصدير لحفظها كملف <code>.gpx</code>، وبعد ذلك يمكنك حفظها في تطبيق "الملفات" أو إرسالها عبر AirDrop إلى جهاز آخر أو مشاركتها عبر البريد الإلكتروني أو أي تطبيق آخر.
      </p>

      <p><strong>كيف أستورد مسار GPX (مثلًا لأغراض التنقل)؟</strong></p>

      <p>
        استخدم خيار الاستيراد داخل التطبيق، ثم اختر ملف <code>.gpx</code> من تطبيق "الملفات" (الوصول إلى مجلدي المستندات/التنزيلات مطلوب — وستظهر لك مطالبة بذلك في المرة الأولى).
      </p>

      <h3>اشتراك BikePilot PRO</h3>

      <p><strong>كيف أشترك في BikePilot PRO أو ألغي الاشتراك؟</strong></p>

      <p>
        تُدار الاشتراكات بالكامل من خلال Apple ID الخاص بك. للاشتراك، استخدم مطالبة الترقية داخل التطبيق. ولعرض اشتراكك أو تغييره أو إلغائه، انتقل إلى الإعدادات → [اسمك] → الاشتراكات، أو إلى تطبيق App Store → أيقونة ملفك الشخصي → الاشتراكات.
      </p>

      <p><strong>اشتركت، لكن ميزات PRO لم تُفعّل.</strong></p>

      <p>
        جرّب استخدام خيار "Restore Purchases" في شاشة الإعدادات/الترقية داخل التطبيق. وإذا استمرت المشكلة بعد إعادة تشغيل التطبيق، فتواصل معنا مع ذكر البريد الإلكتروني المرتبط بحساب Apple ID الخاص بك (ولا تشارك كلمة مرور Apple ID) وتاريخ الشراء التقريبي حتى نتمكن من المساعدة في التحقق من المشكلة.
      </p>

      <p><strong>تم تحصيلي رسومًا لكنني لم أكن أنوي التجديد / أريد استردادًا.</strong></p>

      <p>
        تتم إدارة عمليات الاسترداد والفوترة مباشرةً من قبل Apple، وليس من قبل المطوّر. يمكنك طلب استرداد عبر <a href="https://reportaproblem.apple.com">reportaproblem.apple.com</a> أو من خلال الإعدادات → [اسمك] → الاشتراكات على جهازك.
      </p>

      <h3>الخصوصية</h3>

      <p>
        يخزّن BikePilot جميع بيانات رحلاتك محليًا على جهازك ولا يشغّل خادمًا خلفيًا. راجع <a href="privacy-policy.html">سياسة الخصوصية</a> للاطلاع على التفاصيل الكاملة حول البيانات التي يصل إليها التطبيق وكيفية استخدامها.
      </p>

      <h3>استكشاف الأخطاء وإصلاحها بشكل عام</h3>

      <ul>
        <li>تأكد من أنك تستخدم أحدث إصدار من BikePilot من App Store.</li>
        <li>تؤدي إعادة تشغيل التطبيق أو الجهاز إلى حل كثير من المشكلات المؤقتة (مثل مشكلات اتصال المستشعرات أو تأخر تثبيت إشارة GPS).</li>
        <li>إذا تعطل التطبيق أو تصرف بشكل غير متوقع، فيرجى مراسلتنا عبر البريد الإلكتروني مع وصف لما حدث، بالإضافة إلى طراز جهازك وإصدار iOS لديك، حتى نتمكن من التحقق من المشكلة.</li>
      </ul>

      <h2>طلبات الميزات والملاحظات</h2>

      <p>
        يسعدنا أن نسمع أفكارك حول الميزات الجديدة أو التحسينات. أرسل اقتراحاتك إلى <a href="mailto:sebastian.gasch@outlook.com">sebastian.gasch@outlook.com</a> — فنحن نقرأ كل رسالة.
      </p>
