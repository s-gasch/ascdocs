    <template id="doc-content" data-doc-title="شروط الاستخدام">
      <p><em>آخر تحديث: 2026-08-11</em></p>

      <p>
        تنظّم شروط الاستخدام هذه ("الشروط") استخدامك لتطبيق BikePilot للأجهزة المحمولة ("التطبيق")، الذي طوّره ونشره Sebastian Gasch ("المطوّر"، "نحن"). ومن خلال تنزيل التطبيق أو تثبيته أو استخدامه، فإنك توافق على الالتزام بهذه الشروط وبـ <a href="https://www.apple.com/legal/internet-services/itunes/dev/stdeula/">اتفاقية ترخيص المستخدم النهائي للتطبيقات المرخّصة (EULA)</a> الخاصة بـ Apple، والتي تنطبق بالإضافة إلى هذه الشروط. وإذا كنت لا توافق، فالرجاء عدم استخدام التطبيق.
      </p>

      <h2>1. الترخيص</h2>

      <p>
        رهناً بالتزامك بهذه الشروط، يمنحك المطوّر ترخيصًا محدودًا وغير حصري وغير قابل للنقل وقابلًا للإلغاء لاستخدام التطبيق على الأجهزة التي تحمل علامة Apple التجارية والتي تملكها أو تتحكم بها، وذلك فقط لأغراضك الشخصية وغير التجارية، ووفقًا لقواعد الاستخدام الخاصة بـ App Store واتفاقية EULA القياسية المشار إليها أعلاه من Apple.
      </p>

      <h2>2. وصف التطبيق</h2>

      <p>
        BikePilot هو تطبيق كمبيوتر دراجات يستخدم GPS ومقياس الضغط الجوي في جهازك، بالإضافة إلى مستشعرات Bluetooth Low Energy (BLE) الاختيارية (معدل نبض القلب، السرعة والدوران، الحرارة)، لعرض بيانات الرحلة وتسجيلها مثل السرعة والمسافة والارتفاع والانحدار والمسار على الخريطة. وبعض الميزات لا تتوفر إلا من خلال اشتراك اختياري متجدد تلقائيًا ("BikePilot PRO")، كما هو موضح أدناه.
      </p>

      <h2>3. ليس جهاز أمان أو جهازًا طبيًا</h2>

      <p>
        يُقدَّم BikePilot لأغراض معلوماتية وترفيهية فقط. وهو <strong>ليس</strong> جهازًا طبيًا، كما أنه <strong>ليس</strong> معدًا لتشخيص أي مرض أو حالة صحية أو علاجها أو الشفاء منها أو الوقاية منها، ولا ليحل محل الحكم المهني الطبي أو الملاحي أو المتعلق بالسلامة. وقد تكون قراءات GPS والقياسات البارومترية وقراءات مستشعرات Bluetooth (بما في ذلك معدل نبض القلب) غير دقيقة أو متأخرة أو غير متاحة بسبب قيود العتاد أو الظروف البيئية أو الأحوال الجوية أو مشكلات الاتصال.
      </p>

      <p>
        <strong>أنت وحدك المسؤول عن سلامتك أثناء ركوب الدراجة.</strong> احرص دائمًا على أن يكون تركيزك الأساسي على الطريق وحركة المرور وما يحيط بك. ولا تعتمد على التطبيق بوصفه المصدر الوحيد للملاحة أو لمراقبة المؤشرات الفسيولوجية، واستشر طبيبًا مؤهلًا قبل ممارسة نشاط بدني شاق، خاصةً إذا كانت لديك أي حالة صحية سابقة.
      </p>

      <h2>4. المحتوى والبيانات الخاصة بك</h2>

      <p>
        تُخزَّن تسجيلات الرحلات ومسارات GPS وبيانات المستشعرات التي تنشئها باستخدام التطبيق محليًا على جهازك، كما هو موضح في <a href="privacy-policy.html">سياسة الخصوصية</a>. وتقع على عاتقك مسؤولية الاحتفاظ بنسخك الاحتياطية الخاصة (على سبيل المثال، عبر تصدير الرحلات كملفات <code>.gpx</code>) — ولا يتحمل المطوّر المسؤولية عن أي فقدان لبيانات الرحلات ينتج عن فقدان الجهاز أو تلفه أو حذف التطبيق أو تغييرات نظام التشغيل.
      </p>

      <p>
        إذا قمت باستيراد ملفات <code>.gpx</code> إلى التطبيق، فإنك تقر بأن لديك الحق في استخدام تلك البيانات، وأن هذا الاستخدام لا ينتهك حقوق أي طرف ثالث.
      </p>

      <h2>5. الاشتراكات (BikePilot PRO)</h2>

      <ul>
        <li>يقدّم BikePilot اشتراكًا اختياريًا متجددًا تلقائيًا يفتح ميزات إضافية ("BikePilot PRO")، وهو متاح بخطتين شهرية أو سنوية.</li>
        <li>تُحمَّل الدفعة على حساب Apple ID الخاص بك عند تأكيد الشراء.</li>
        <li>تتجدد الاشتراكات تلقائيًا للمدة نفسها وبالسعر الساري حينها، ما لم يتم إيقاف التجديد التلقائي قبل 24 ساعة على الأقل من نهاية الفترة الحالية.</li>
        <li>سيُحمَّل حساب Apple ID الخاص بك رسوم التجديد خلال 24 ساعة السابقة لنهاية الفترة الحالية.</li>
        <li>يمكنك إدارة اشتراكك وإيقاف التجديد التلقائي في أي وقت من إعدادات حساب Apple ID الخاص بك، وفقًا لقواعد Apple؛ ولا يملك المطوّر إمكانية إلغاء اشتراكك أو تعديله مباشرة.</li>
        <li>يُصادَر أي جزء غير مستخدم من فترة تجربة مجانية، إن وُجدت، عند شرائك اشتراكًا، حيثما ينطبق ذلك.</li>
        <li>تتم جميع المدفوعات وعمليات الاسترداد ونزاعات الفوترة من خلال Apple وفقًا لـ <a href="https://www.apple.com/legal/internet-services/itunes/">شروط وأحكام Apple Media Services</a>. ولا يعالج المطوّر المدفوعات مباشرة ولا يمكنه إصدار عمليات استرداد.</li>
      </ul>

      <h2>6. الاستخدام المقبول</h2>

      <p>
        أنت توافق على عدم:
      </p>

      <ul>
        <li>استخدام التطبيق لأي غرض غير قانوني أو بأي طريقة تنتهك أي قانون أو لائحة سارية؛</li>
        <li>محاولة إجراء هندسة عكسية للتطبيق أو فك ترجمته أو استخراج شيفرته المصدرية، إلا بالقدر الذي يحظر فيه القانون الساري هذا القيد؛</li>
        <li>التدخل في تشغيل التطبيق أو تعطيله أو محاولة الحصول على وصول غير مصرّح به إلى أي أنظمة ذات صلة بالتطبيق.</li>
      </ul>

      <h2>7. الملكية الفكرية</h2>

      <p>
        التطبيق، بما في ذلك تصميمه وشيفرته ورسوماته وعلاماته التجارية، مملوك للمطوّر ومحمي بموجب قوانين الملكية الفكرية السارية. ولا تمنحك هذه الشروط أي حقوق في العلامات التجارية أو الشعارات أو الأصول العلامية الخاصة بالمطوّر، بخلاف ما يلزم لاستخدام التطبيق على النحو المقصود.
      </p>

      <h2>8. إخلاء المسؤولية عن الضمانات</h2>

      <p>
        يُقدَّم التطبيق "كما هو" و"بحسب التوفر"، من دون أي ضمانات من أي نوع، سواء كانت صريحة أو ضمنية، بما في ذلك على سبيل المثال لا الحصر الضمانات الضمنية الخاصة بقابلية التسويق أو الملاءمة لغرض معين أو عدم الانتهاك. ولا يضمن المطوّر أن يعمل التطبيق دون انقطاع أو أخطاء، أو أن تكون قراءات المستشعرات (بما في ذلك بيانات GPS أو البيانات البارومترية أو بيانات Bluetooth) دقيقة أو متاحة في جميع الأوقات.
      </p>

      <h2>9. تحديد المسؤولية</h2>

      <p>
        إلى أقصى حد يسمح به القانون الساري، لا يتحمل المطوّر أي مسؤولية عن أي أضرار غير مباشرة أو عرضية أو خاصة أو تبعية أو تأديبية، أو عن أي فقدان للبيانات أو الإيرادات أو الأرباح، ينشأ عن أو يرتبط باستخدامك للتطبيق (أو عدم قدرتك على استخدامه)، بما في ذلك أي إصابة أو حادث يقع أثناء ركوب الدراجة. ولا يحد أي شيء في هذه الشروط من أي مسؤولية لا يمكن استبعادها أو تقييدها بموجب القانون الساري.
      </p>

      <h2>10. خدمات الجهات الخارجية</h2>

      <p>
        يتوفر التطبيق للتنزيل حصريًا من خلال App Store الخاص بـ Apple، ويعتمد على أُطر Apple (Core Location وCore Motion وCore Bluetooth وStoreKit). كما يخضع استخدامك لهذه الخدمات الأساسية التابعة للمنصة لشروط Apple وسياساتها الخاصة أيضًا.
      </p>

      <h2>11. الإنهاء</h2>

      <p>
        يمكنك التوقف عن استخدام التطبيق في أي وقت عبر حذفه من جهازك. ويحتفظ المطوّر بالحق في إيقاف التطبيق أو تعديله، كليًا أو جزئيًا، في أي وقت، وذلك مع مراعاة سياسات App Store الخاصة بـ Apple والقانون الساري.
      </p>

      <h2>12. التغييرات على هذه الشروط</h2>

      <p>
        قد نحدّث هذه الشروط من وقت لآخر، على سبيل المثال لتعكس ميزات جديدة في التطبيق أو متطلبات قانونية. ويشير تاريخ "آخر تحديث" أعلاه إلى آخر مرة تم فيها تعديل هذه الشروط. ويُعد استمرارك في استخدام التطبيق بعد أي تغيير قبولًا منك للشروط المحدّثة.
      </p>

      <h2>13. القانون الحاكم</h2>

      <p>
        تخضع هذه الشروط للقوانين السارية في بلد إقامة المطوّر، من دون اعتبار لمبادئ تنازع القوانين، إلا إذا كانت قوانين حماية المستهلك الإلزامية في بلد إقامتك تنص على خلاف ذلك.
      </p>
