    <template id="doc-content" data-doc-title="Zásady ochrany osobních údajů">
      <p><em>Poslední aktualizace: 2026-08-11</em></p>

      <p>
        Tyto Zásady ochrany osobních údajů popisují, jak BikePilot ("Aplikace", "my", "nás") nakládá s informacemi při používání aplikace. BikePilot vyvíjí a publikuje Sebastian Gasch ("Vývojář").
      </p>

      <h2>Shrnutí</h2>

      <p>
        BikePilot je navržen tak, aby fungoval zcela na vašem zařízení. Neprovozujeme backendový server, neshromažďujeme analytická data a vaše osobní údaje neprodáváme ani nesdílíme s třetími stranami. Aplikace vás nesleduje napříč aplikacemi ani webovými stránkami jiných společností.
      </p>

      <h2>K jakým údajům Aplikace přistupuje</h2>

      <p>
        Aby mohl BikePilot poskytovat své hlavní funkce cyklistického počítače, žádá o přístup k následujícím možnostem zařízení. Přístup je vyžadován pouze tehdy, když je potřeba, a jen s vaším souhlasem uděleným prostřednictvím standardních dialogů oprávnění v iOS.
      </p>

      <table>
        <thead>
          <tr>
            <th>Údaj / oprávnění</th>
            <th>Účel</th>
            <th>Kde se ukládá</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>Poloha (GPS)</strong> ("Při používání aplikace")</td>
            <td>Měření rychlosti, vzdálenosti, nadmořské výšky a sklonu a zaznamenávání vaší trasy na mapě během jízdy.</td>
            <td>Pouze ve vašem zařízení jako součást místní historie jízd.</td>
          </tr>
          <tr>
            <td><strong>Pohyb a kondice (barometr)</strong></td>
            <td>Odhad změn nadmořské výšky a sklonu během jízdy.</td>
            <td>Pouze ve vašem zařízení; neukládá se jako surová data ze snímačů mimo aktuální relaci.</td>
          </tr>
          <tr>
            <td><strong>Bluetooth</strong></td>
            <td>Připojení k vašim vlastním snímačům Bluetooth Low Energy (BLE) — hrudní pás / snímač tepové frekvence, snímač rychlosti a kadence, snímač teploty — pro zobrazení živých údajů o jízdě.</td>
            <td>Údaje ze snímačů se ve vašem zařízení zpracovávají v reálném čase a ukládají se lokálně jako součást dat o jízdě; BikePilot data ze snímačů nikam nepřenáší.</td>
          </tr>

            <td>Soubor, který zvolíte k importu, je čten ve vašem zařízení; exportované soubory se zapisují do umístění, které vyberete (např. aplikace Soubory, AirDrop, Mail), pomocí standardního listu sdílení v iOS.</td>
          </tr>

      <h2>Jaké údaje neshromažďujeme</h2>

      <ul>
        <li>Nepoužíváme žádná SDK pro analytiku, reklamu ani hlášení pádů.</li>
        <li>Neprovozujeme vlastní servery a Aplikace neodesílá vaše jízdy, historii polohy, údaje ze snímačů ani žádné jiné osobní údaje nám ani žádné třetí straně.</li>
        <li>Nepoužíváme sledovací technologie (ve smyslu frameworku App Tracking Transparency od Apple) a nežádáme o oprávnění ke sledování.</li>
        <li>Neshromažďujeme ani neuchováváme údaje o účtu, protože BikePilot nevyžaduje vytvoření účtu ani přihlášení.</li>
      </ul>

      <h2>Ukládání a uchovávání údajů</h2>

      <p>
        Veškerá data o jízdách (GPS trasy, údaje o rychlosti/kadenci/tepové frekvenci/teplotě, nastavení a zaznamenané jízdy) se ukládají lokálně ve vašem zařízení pomocí standardních mechanismů Apple pro lokální ukládání dat v zařízení (<code>UserDefaults</code> a lokální úložiště aplikace). Tato data Aplikace sama nesynchronizuje do iCloud ani do jiné cloudové služby, ledaže by místní data Aplikace byla zahrnuta do zálohy zařízení v iCloud na úrovni systému; to však řídí nastavení iOS ve vašem zařízení, nikoli BikePilot.
      </p>

      <p>
        Veškerá lokálně uložená data o jízdách můžete kdykoli smazat odstraněním zaznamenaných jízd přímo v Aplikaci nebo smazáním Aplikace ze zařízení; tím se odstraní všechna její místní data v souladu se standardním chováním iOS při smazání aplikace.
      </p>

      <h2>Import/export GPX</h2>

      <p>
        BikePilot vám umožňuje importovat vybrané soubory <code>.gpx</code> a exportovat zaznamenané jízdy jako soubory <code>.gpx</code> pomocí listu sdílení v iOS. To, co s exportovaným souborem uděláte dále (např. jeho sdílení se službou třetí strany), je vaše rozhodnutí a řídí se zásadami ochrany osobních údajů dané třetí strany, nikoli těmito Zásadami.
      </p>

      <h2>Předplatné (BikePilot PRO)</h2>

      <p>
        BikePilot nabízí volitelné automaticky obnovované předplatné ("BikePilot PRO"), které odemyká další funkce. Nákupy předplatného, obnovení a obnova nákupů jsou plně zajišťovány přes StoreKit a váš účet Apple ID / App Store. Vaše platební údaje neobdržíme ani neuchováváme — údaje o nákupu a vyúčtování zpracovává a uchovává Apple v souladu se <a href="https://www.apple.com/legal/privacy/">Zásadami ochrany osobních údajů Apple</a>.
      </p>

      <h2>Ochrana soukromí dětí</h2>

      <p>
        BikePilot není určen dětem a vědomě neshromažďuje osobní údaje dětí. Protože Aplikace osobní údaje uživatelů vůbec neshromažďuje ani nám je nepřenáší, Vývojář neuchovává žádné údaje o žádném uživateli, včetně dětí.
      </p>

      <h2>Vaše práva</h2>

      <p>
        Protože veškeré osobní údaje vzniklé používáním BikePilot (historie polohy, data o jízdách, údaje ze snímačů) zůstávají ve vašem zařízení a nikdy se nám nepřenášejí, máte nad nimi po celou dobu plnou kontrolu: můžete je přímo v Aplikaci zobrazit, exportovat nebo smazat, případně Aplikaci odstranit. Jelikož ve svých systémech neuchováváme žádné vaše osobní údaje, neexistuje pro tato data žádný samostatný proces žádostí o přístup, opravu nebo výmaz, který by bylo nutné nám podávat.
      </p>

      <p>
        Máte-li dotazy k těmto Zásadám nebo k tomu, jak Aplikace pracuje s oprávněními zařízení, můžete nás kontaktovat prostřednictvím níže uvedených údajů.
      </p>

      <h2>Změny těchto zásad</h2>

      <p>
        Tyto Zásady ochrany osobních údajů můžeme čas od času aktualizovat, například aby odrážely nové funkce Aplikace. Datum „Poslední aktualizace“ v horní části tohoto dokumentu uvádí, kdy byly tyto Zásady naposledy revidovány. Pokračováním v používání Aplikace po provedení změny vyjadřujete souhlas s aktualizovaným zněním Zásad.
      </p>
