      <p>

      </p>

      <h2>Kontakt</h2>

      <p>
        Pokud níže nenajdete odpověď na svůj dotaz, napište nám e-mail a ozveme se co nejdříve:
      </p>

      <p>

      <h2>Časté dotazy</h2>

      <h3>GPS a sledování polohy</h3>

      <p><strong>Zdá se mi, že rychlost / vzdálenost / trasa nejsou přesné.</strong></p>

      <p>
        Přesnost GPS závisí na vašem zařízení, počasí a okolním prostředí (vysoké budovy, tunely, hustý stromový porost apod. mohou signál zhoršit). Zkontrolujte, že má BikePilot v iOS povolen přístup k poloze „Při používání aplikace“ nebo „Vždy“ v Nastavení → Soukromí a zabezpečení → Polohové služby → BikePilot a že jsou Polohové služby zapnuté pro celý systém.
      </p>

      <p><strong>Aplikace přestala zaznamenávat jízdu, když jsem zamkl(a) telefon / přepnul(a) do jiné aplikace.</strong></p>

      <p>
        BikePilot používá aktualizace polohy na pozadí, aby mohl pokračovat v záznamu i při zamčeném zařízení nebo během používání jiné aplikace. Ujistěte se, že je oprávnění k poloze uděleno a že Režim nízké spotřeby příliš neomezuje aktivitu na pozadí, což může u některých zařízení ovlivnit frekvenci aktualizací GPS.
      </p>

      <h3>Bluetooth snímače</h3>

      <p><strong>Snímač tepové frekvence / rychlosti a kadence / teploty se nechce připojit.</strong></p>

      <ol>
        <li>Ujistěte se, že je snímač zapnutý a v dosahu (při párování obvykle 1–2 metry).</li>
        <li>Ověřte, že je Bluetooth v iOS zapnuté a že má BikePilot oprávnění Bluetooth (Nastavení → Soukromí a zabezpečení → Bluetooth → BikePilot).</li>
        <li>Některé snímače se umí připojit vždy jen k jedné aplikaci — před připojením v BikePilot je odpojte od jakékoli jiné aplikace (např. jiné cyklistické nebo fitness aplikace).</li>
        <li>Zkuste snímač restartovat (je-li to relevantní, vyjměte a znovu vložte baterii) a v nastavení snímačů v Aplikaci spusťte nové vyhledání.</li>
      </ol>

      <p><strong>Snímač se mi během jízdy stále odpojuje.</strong></p>

      <p>
        Příčinou bývá nejčastěji slabá baterie snímače, větší vzdálenost od zařízení nebo rušení Bluetooth. Výměna baterie a držení telefonu v dosahu obvykle problém vyřeší.
      </p>

      <h3>Nadmořská výška a sklon</h3>

      <p><strong>Údaje o nadmořské výšce / sklonu vypadají nepřesně.</strong></p>

      <p>
        BikePilot používá k odhadu nadmořské výšky a sklonu barometr vašeho zařízení spolu s GPS. Barometrické hodnoty se mohou v čase mírně rozcházet nebo je mohou ovlivnit rychlé změny počasí; jde o omezení hardwaru, nikoli o chybu Aplikace.
      </p>

      <h3>Import/export GPX</h3>

      <p><strong>Jak exportuji jízdu?</strong></p>

      <p>
        Otevřete jízdu v historii jízd a použijte volbu sdílení/exportu pro uložení do souboru <code>.gpx</code>, který pak můžete uložit do aplikace Soubory, poslat přes AirDrop do jiného zařízení nebo sdílet e-mailem či přes jinou aplikaci.
      </p>

      <p><strong>Jak importuji GPX trasu (např. pro navigaci)?</strong></p>

      <p>
        V Aplikaci použijte volbu importu a vyberte soubor <code>.gpx</code> z aplikace Soubory (je vyžadován přístup ke složce Dokumenty/Stahování — při prvním použití budete vyzváni k jeho povolení).
      </p>

      <h3>Předplatné BikePilot PRO</h3>

      <p><strong>Jak si předplatím / zruším BikePilot PRO?</strong></p>

      <p>
        Předplatná jsou spravována výhradně přes vaše Apple ID. Pro předplatné použijte výzvu k upgradu přímo v Aplikaci. Chcete-li své předplatné zobrazit, změnit nebo zrušit, přejděte do Nastavení → [vaše jméno] → Předplatná nebo do aplikace App Store → ikona vašeho profilu → Předplatná.
      </p>

      <p><strong>Předplatné jsem aktivoval(a), ale funkce PRO nejsou odemčené.</strong></p>

      <p>
        Zkuste v nastavení Aplikace nebo na obrazovce upgradu použít volbu "Restore Purchases". Pokud problém přetrvá i po restartu Aplikace, kontaktujte nás se svým e-mailem k Apple ID (nikdy nesdílejte heslo k Apple ID) a přibližným datem nákupu, abychom mohli situaci prověřit.
      </p>

      <p><strong>Byla mi stržena platba, ale obnovení jsem nechtěl(a) / chci vrácení peněz.</strong></p>

      <p>
        Vrácení peněz a vyúčtování řeší přímo Apple, nikoli Vývojář. O vrácení peněz můžete požádat na <a href="https://reportaproblem.apple.com">reportaproblem.apple.com</a> nebo přes Nastavení → [vaše jméno] → Předplatná ve vašem zařízení.
      </p>

      <h3>Soukromí</h3>

      <p>
        BikePilot ukládá všechna data o vašich jízdách lokálně ve vašem zařízení a neprovozuje žádný backendový server. Podrobnosti o tom, k jakým údajům Aplikace přistupuje a jak je používá, najdete v našich <a href="privacy-policy.html">Zásadách ochrany osobních údajů</a>.
      </p>

      <h3>Obecné řešení potíží</h3>

      <ul>
        <li>Ujistěte se, že používáte nejnovější verzi BikePilot z App Store.</li>
        <li>Restart Aplikace nebo zařízení vyřeší mnoho přechodných potíží (např. problémy s připojením snímačů nebo zpoždění při získání GPS signálu).</li>
        <li>Pokud Aplikace spadne nebo se chová nečekaně, pošlete nám prosím e-mail s popisem toho, co se stalo, spolu s modelem zařízení a verzí iOS, abychom to mohli prověřit.</li>
      </ul>
