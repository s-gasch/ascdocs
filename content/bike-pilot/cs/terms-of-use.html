      <p><em>Poslední aktualizace: 2026-08-11</em></p>

      <p>

      <h2>1. Licence</h2>

      <p>
        Za předpokladu, že dodržujete tyto Podmínky, vám Vývojář uděluje omezenou, nevýhradní, nepřevoditelnou a odvolatelnou licenci k používání Aplikace na zařízeních značky Apple, která vlastníte nebo ovládáte, a to výhradně pro vaši osobní nekomerční potřebu v souladu s pravidly používání App Store a se standardním EULA Apple uvedeným výše.
      </p>

      <h2>2. Popis Aplikace</h2>

      <p>
        BikePilot je aplikace typu cyklopočítač, která využívá GPS, barometr a volitelné snímače Bluetooth Low Energy (BLE) (tepová frekvence, rychlost a kadence, teplota) ve vašem zařízení k zobrazování a záznamu údajů o jízdě, jako jsou rychlost, vzdálenost, nadmořská výška, sklon a trasa na mapě. Některé funkce jsou dostupné pouze s volitelným automaticky obnovovaným předplatným ("BikePilot PRO"), jak je popsáno níže.
      </p>

      <h2>3. Nejde o bezpečnostní ani zdravotnické zařízení</h2>

      <p>
        BikePilot je poskytován výhradně pro informační a rekreační účely. <strong>Není</strong> zdravotnickým zařízením a <strong>není</strong> určen k diagnostice, léčbě, vyléčení ani prevenci jakékoli nemoci či zdravotního stavu ani k nahrazení odborného lékařského, navigačního nebo bezpečnostního úsudku. Údaje z GPS, barometru a Bluetooth snímačů (včetně tepové frekvence) mohou být nepřesné, zpožděné nebo nedostupné z důvodu omezení hardwaru, podmínek prostředí, počasí nebo problémů s připojením.
      </p>

      <p>
        <strong>Za svou bezpečnost při jízdě na kole nesete výhradní odpovědnost vy sami.</strong> Vždy věnujte nejvyšší pozornost vozovce, dopravě a svému okolí. Nespoléhejte na Aplikaci jako na jediný zdroj navigace nebo sledování fyziologických údajů a před zahájením náročné fyzické aktivity se poraďte s kvalifikovaným lékařem, zejména pokud máte jakýkoli již existující zdravotní problém.
      </p>

      <h2>4. Váš obsah a vaše data</h2>

      <p>
        Záznamy jízd, GPS trasy a údaje ze snímačů, které pomocí Aplikace vytvoříte, se ukládají lokálně ve vašem zařízení, jak je popsáno v našich <a href="privacy-policy.html">Zásadách ochrany osobních údajů</a>. Za udržování vlastních záloh odpovídáte vy sami (například exportem jízd jako souborů <code>.gpx</code>) — Vývojář nenese odpovědnost za jakoukoli ztrátu dat o jízdách způsobenou ztrátou zařízení, jeho poškozením, smazáním Aplikace nebo změnami operačního systému.
      </p>

      <p>
        Pokud do Aplikace importujete soubory <code>.gpx</code>, prohlašujete, že máte právo tato data používat a že tím neporušujete práva žádné třetí strany.
      </p>

      <h2>5. Předplatné (BikePilot PRO)</h2>

      <ul>
        <li>BikePilot nabízí volitelné automaticky obnovované předplatné, které odemyká další funkce ("BikePilot PRO") a je dostupné jako měsíční nebo roční tarif.</li>
        <li>Platba je při potvrzení nákupu účtována na váš účet Apple ID.</li>
        <li>Předplatné se automaticky obnovuje na stejné období a za tehdy platnou cenu, pokud automatické obnovení nevypnete alespoň 24 hodin před koncem aktuálního období.</li>
        <li>Obnovení bude účtováno na váš účet Apple ID během 24 hodin před koncem aktuálního období.</li>
        <li>Předplatné můžete kdykoli spravovat a automatické obnovení vypnout v nastavení svého účtu Apple ID v souladu s pravidly Apple; Vývojář nemá přístup k přímému zrušení ani změně vašeho předplatného.</li>
        <li>Jakákoli nevyužitá část zkušebního období zdarma, pokud je nabízena, propadá okamžikem zakoupení předplatného, je-li to relevantní.</li>
        <li>Veškeré platby, vrácení peněz a spory o vyúčtování řeší Apple v souladu s dokumentem <a href="https://www.apple.com/legal/internet-services/itunes/">Apple Media Services Terms and Conditions</a>. Vývojář platby přímo nezpracovává a nemůže vracet peníze.</li>
      </ul>

      <p>
        Zavazujete se, že nebudete:
      </p>

      <ul>
        <li>používat Aplikaci k žádnému protiprávnímu účelu ani způsobem, který porušuje jakýkoli platný zákon nebo právní předpis;</li>
        <li>pokoušet se o reverse engineering, dekompilaci nebo získání zdrojového kódu Aplikace, vyjma rozsahu, v němž je takové omezení zakázáno platnými právními předpisy;</li>
        <li>narušovat provoz Aplikace, vyvolávat jeho výpadky ani se pokoušet získat neoprávněný přístup k jakýmkoli systémům souvisejícím s Aplikací.</li>
      </ul>

      <h2>7. Duševní vlastnictví</h2>

      <p>
        Aplikace, včetně svého designu, kódu, grafiky a ochranných známek, je vlastnictvím Vývojáře a je chráněna příslušnými právními předpisy v oblasti duševního vlastnictví. Tyto Podmínky vám neudělují žádná práva k ochranným známkám, logům ani prvkům značky Vývojáře nad rámec toho, co je nezbytné k používání Aplikace zamýšleným způsobem.
      </p>

      <h2>8. Vyloučení záruk</h2>

      <p>
        APLIKACE JE POSKYTOVÁNA "TAK, JAK JE" A "PODLE DOSTUPNOSTI", BEZ JAKÝCHKOLI ZÁRUK JAKÉHOKOLI DRUHU, AŤ UŽ VÝSLOVNÝCH, NEBO KONKLUDENTNÍCH, VČETNĚ MIMO JINÉ KONKLUDENTNÍCH ZÁRUK OBCHODOVATELNOSTI, VHODNOSTI PRO KONKRÉTNÍ ÚČEL A NEPORUŠENÍ PRÁV. VÝVOJÁŘ NEZARUČUJE, ŽE APLIKACE BUDE FUNGOVAT NEPŘETRŽITĚ, BEZ CHYB ANI ŽE ÚDAJE ZE SNÍMAČŮ (VČETNĚ GPS, BAROMETRICKÝCH NEBO BLUETOOTH DAT) BUDOU VŽDY PŘESNÉ ČI DOSTUPNÉ.
