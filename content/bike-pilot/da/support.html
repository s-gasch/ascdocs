    <template id="doc-content" data-doc-title="Support">
      <p><em>Sidst opdateret: 2026-08-11</em></p>

      <p>
        Har du brug for hjælp til BikePilot? Denne side dækker almindelige spørgsmål, fejlfindingstrin og hvordan du kan kontakte os for yderligere support.
      </p>

      <h2>Kontakt</h2>

      <p>
        Hvis du ikke finder svar på dit spørgsmål nedenfor, kan du sende os en e-mail, så vender vi tilbage så hurtigt som muligt:
      </p>

      <p>
        <strong>Email:</strong> <a href="mailto:sebastian.gasch@outlook.com">sebastian.gasch@outlook.com</a>
      </p>

      <p>
        Medtag gerne følgende, når du rapporterer et problem, så vi hurtigere kan hjælpe dig:
      </p>

      <ul>
        <li>App-version (Settings → About i Appen)</li>
        <li>Din iOS-version og enhedsmodel</li>
        <li>Trin til at genskabe problemet</li>
        <li>Skærmbilleder eller skærmoptagelser, hvis det er relevant</li>
      </ul>

      <h2>Ofte stillede spørgsmål</h2>

      <h3>GPS og lokalitetssporing</h3>

      <p><strong>Min hastighed/distance/rute virker unøjagtig.</strong></p>

      <p>
        GPS-nøjagtighed afhænger af din enhed, vejret og dine omgivelser (høje bygninger, tunneler, tæt trædække osv. kan forringe signalet). Sørg for, at adgang til lokalitet er sat til "While Using the App" eller "Always" under iOS Settings → Privacy &amp; Security → Location Services → BikePilot, og at Location Services er aktiveret på systemniveau.
      </p>

      <p><strong>Appen stoppede med at registrere min tur, da jeg låste min telefon / skiftede app.</strong></p>

      <p>
        BikePilot bruger lokalitetsopdateringer i baggrunden til at fortsætte registreringen, mens din enhed er låst, eller mens du bruger en anden app. Sørg for, at lokalitetstilladelse er givet, og at Low Power Mode ikke begrænser baggrundsaktivitet for aggressivt, da det på nogle enheder kan påvirke hyppigheden af GPS-opdateringer.
      </p>

      <h3>Bluetooth-sensorer</h3>

      <p><strong>Min puls- / fart- og kadence- / temperatursensor vil ikke oprette forbindelse.</strong></p>

      <ol>
        <li>Sørg for, at sensoren er tændt og inden for rækkevidde (normalt 1–2 meter under parring).</li>
        <li>Bekræft, at Bluetooth er aktiveret i iOS Settings, og at BikePilot har Bluetooth-tilladelse (Settings → Privacy &amp; Security → Bluetooth → BikePilot).</li>
        <li>Nogle sensorer kan kun være forbundet til én app ad gangen — afbryd sensoren fra andre apps (f.eks. en anden cykel- eller fitnessapp), før du forbinder den i BikePilot.</li>
        <li>Prøv at genstarte sensoren (fjern og indsæt batteriet igen, hvis relevant), og scan derefter på ny fra Appens sensorindstillinger.</li>
      </ol>

      <p><strong>Min sensor mister forbindelsen midt under turen.</strong></p>

      <p>
        Det skyldes som regel lavt batteriniveau i sensoren, afstand til enheden eller Bluetooth-forstyrrelser. Udskiftning af sensorbatteriet og det at holde telefonen inden for rækkevidde løser typisk problemet.
      </p>

      <h3>Højde og stigningsprocent</h3>

      <p><strong>Målingerne for højde/stigningsprocent ser forkerte ud.</strong></p>

      <p>
        BikePilot bruger enhedens barometer sammen med GPS til at estimere højde og stigningsprocent. Barometriske målinger kan drive en smule over tid eller blive påvirket af hurtige vejrskift; det er en hardwarebegrænsning snarere end en fejl i Appen.
      </p>

      <h3>GPX-import/-eksport</h3>

      <p><strong>Hvordan eksporterer jeg en tur?</strong></p>

      <p>
        Åbn turen i din turhistorik, og brug delings-/eksportmuligheden for at gemme den som en <code>.gpx</code>-fil, som du derefter kan gemme i appen Filer, sende via AirDrop til en anden enhed eller dele via e-mail eller en anden app.
      </p>

      <p><strong>Hvordan importerer jeg et GPX-spor (f.eks. til navigation)?</strong></p>

      <p>
        Brug importfunktionen i Appen, og vælg en <code>.gpx</code>-fil fra appen Filer (adgang til mappen Dokumenter/Downloads er påkrævet — du bliver bedt om tilladelse første gang).
      </p>

      <h3>BikePilot PRO-abonnement</h3>

      <p><strong>Hvordan abonnerer jeg på / opsiger jeg BikePilot PRO?</strong></p>

      <p>
        Abonnementer administreres udelukkende via dit Apple ID. For at abonnere skal du bruge opgraderingsprompten i Appen. For at se, ændre eller opsige dit abonnement skal du gå til iOS Settings → [your name] → Subscriptions eller App Store-appen → dit profilikon → Subscriptions.
      </p>

      <p><strong>Jeg har tegnet et abonnement, men PRO-funktionerne er ikke låst op.</strong></p>

      <p>
        Prøv at bruge indstillingen "Restore Purchases" i Appens indstillinger/opgraderingsskærm. Hvis problemet fortsætter efter genstart af Appen, kan du kontakte os med den e-mailadresse, der er knyttet til dit Apple ID (del ikke din Apple ID-adgangskode), samt den omtrentlige købsdato, så vi kan hjælpe med at undersøge sagen.
      </p>

      <p><strong>Jeg blev opkrævet, men havde ikke tænkt mig at forny / ønsker en refusion.</strong></p>

      <p>
        Refusioner og fakturering håndteres direkte af Apple, ikke af Udvikleren. Du kan anmode om en refusion på <a href="https://reportaproblem.apple.com">reportaproblem.apple.com</a> eller via Settings → [your name] → Subscriptions på din enhed.
      </p>

      <h3>Privatliv</h3>

      <p>
        BikePilot gemmer alle dine turdata lokalt på din enhed og driver ingen backendserver. Se vores <a href="privacy-policy.html">privatlivspolitik</a> for alle detaljer om, hvilke data Appen har adgang til, og hvordan de bruges.
      </p>

      <h3>Generel fejlfinding</h3>

      <ul>
        <li>Sørg for, at du bruger den nyeste version af BikePilot fra App Store.</li>
        <li>Genstart af Appen eller din enhed løser mange forbigående problemer (f.eks. problemer med sensorforbindelse eller forsinkelser ved GPS-låsning).</li>
        <li>Hvis Appen crasher eller opfører sig uventet, er du velkommen til at sende os en e-mail med en beskrivelse af, hvad der skete, sammen med din enhedsmodel og iOS-version, så vi kan undersøge det.</li>
      </ul>

      <h2>Funktionsønsker og feedback</h2>

      <p>
        Vi hører meget gerne dine idéer til nye funktioner eller forbedringer. Send dine forslag til <a href="mailto:sebastian.gasch@outlook.com">sebastian.gasch@outlook.com</a> — vi læser hver eneste besked.
      </p>
