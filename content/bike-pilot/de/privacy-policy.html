    <template id="doc-content" data-doc-title="Datenschutzerklärung">
      <p><em>Zuletzt aktualisiert: 2026-08-11</em></p>

      <p>
        Diese Datenschutzerklärung beschreibt, wie BikePilot („die App“, „wir“, „uns“) mit Informationen umgeht, wenn Sie die App nutzen. BikePilot wird von Sebastian Gasch („der Entwickler“) entwickelt und veröffentlicht.
      </p>

      <h2>Zusammenfassung</h2>

      <p>
        BikePilot ist so konzipiert, dass die App vollständig auf Ihrem Gerät arbeitet. Wir betreiben keinen Backend-Server, wir erfassen keine Analysedaten und wir verkaufen oder teilen Ihre personenbezogenen Daten nicht mit Dritten. Die App verfolgt Sie nicht über Apps oder Websites anderer Unternehmen hinweg.
      </p>

      <h2>Auf welche Informationen die App zugreift</h2>

      <p>
        Um ihre Kernfunktionen als Fahrradcomputer bereitzustellen, benötigt BikePilot Zugriff auf die folgenden Gerätefunktionen. Der Zugriff wird nur dann angefordert, wenn er erforderlich ist, und nur mit Ihrer Einwilligung über die standardmäßigen iOS-Berechtigungsabfragen.
      </p>

      <table>
        <thead>
          <tr>
            <th>Daten / Berechtigung</th>
            <th>Zweck</th>
            <th>Speicherort</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>Standort (GPS)</strong> („Beim Verwenden der App“)</td>
            <td>Ermittlung von Geschwindigkeit, Distanz, Höhe und Steigung sowie Aufzeichnung Ihrer Route auf der Karte während einer Fahrt.</td>
            <td>Ausschließlich auf Ihrem Gerät als Teil Ihrer lokalen Fahrhistorie.</td>
          </tr>
          <tr>
            <td><strong>Bewegung &amp; Fitness (Barometer)</strong></td>
            <td>Schätzung von Höhenänderungen und Steigungswerten während der Fahrt.</td>
            <td>Ausschließlich auf Ihrem Gerät; Rohsensordaten werden nicht über die aktuelle Sitzung hinaus gespeichert.</td>
          </tr>
          <tr>
            <td><strong>Bluetooth</strong></td>
            <td>Verbindung mit Ihren eigenen Bluetooth Low Energy (BLE) Sensoren — Herzfrequenzmesser, Geschwindigkeits- &amp; Kadenzsensor, Temperatursensor — zur Anzeige von Live-Fahrdaten.</td>
            <td>Sensormesswerte werden in Echtzeit auf Ihrem Gerät verarbeitet und lokal als Teil Ihrer Fahrdaten gespeichert; BikePilot überträgt Sensordaten nirgendwohin.</td>
          </tr>
          <tr>
            <td><strong>Dateien (Zugriff auf die Ordner „Dokumente“/„Downloads“)</strong></td>
            <td>Ermöglicht den Import von <code>.gpx</code>-Trackdateien, die Sie ausdrücklich auswählen, sowie den Export Ihrer aufgezeichneten Fahrten als <code>.gpx</code>-Dateien (z. B. zum Teilen oder Sichern).</td>
            <td>Von Ihnen zum Import ausgewählte Dateien werden auf Ihrem Gerät gelesen; exportierte Dateien werden an den von Ihnen gewählten Speicherort geschrieben (z. B. Dateien-App, AirDrop, Mail) — über das standardmäßige iOS Teilen-Menü.</td>
          </tr>
        </tbody>
      </table>

      <h2>Daten, die wir nicht erheben</h2>

      <ul>
        <li>Wir verwenden keinerlei SDKs für Analysen, Werbung oder Crash-Reporting.</li>
        <li>Wir betreiben keine eigenen Server, und die App sendet weder Ihre Fahrten, Ihren Standortverlauf, Sensormesswerte noch sonstige personenbezogene Daten an uns oder an Dritte.</li>
        <li>Wir verwenden keine Tracking-Technologien (im Sinne von Apples App Tracking Transparency Framework) und fragen auch keine Tracking-Berechtigung ab.</li>
        <li>Wir erheben oder speichern keine Kontoinformationen, da BikePilot weder eine Kontoerstellung noch eine Anmeldung erfordert.</li>
      </ul>

      <h2>Speicherung und Aufbewahrung von Daten</h2>

      <p>
        Sämtliche Fahrdaten (GPS-Tracks, Geschwindigkeits-/Kadenz-/Herzfrequenz-/Temperaturmesswerte, Einstellungen und aufgezeichnete Fahrten) werden lokal auf Ihrem Gerät mit den üblichen On-Device-Speichermechanismen von Apple (<code>UserDefaults</code> und lokaler App-Speicher) gespeichert. Diese Daten werden von der App selbst nicht mit iCloud oder einem anderen Cloud-Dienst synchronisiert — es sei denn, das iCloud-Gerätebackup Ihres Geräts umfasst die lokalen App-Daten im Rahmen einer systemweiten Sicherung. Dies wird durch Ihre iOS-Einstellungen gesteuert, nicht durch BikePilot.
      </p>

      <p>
        Sie können alle lokal gespeicherten Fahrdaten jederzeit löschen, indem Sie aufgezeichnete Fahrten innerhalb der App entfernen oder die App von Ihrem Gerät löschen. Dadurch werden sämtliche lokalen Daten entsprechend dem üblichen iOS Verhalten beim Löschen einer App entfernt.
      </p>

      <h2>GPX-Import/-Export</h2>

      <p>
        BikePilot ermöglicht es Ihnen, von Ihnen ausgewählte <code>.gpx</code>-Dateien zu importieren und Ihre aufgezeichneten Fahrten über das iOS Teilen-Menü als <code>.gpx</code>-Dateien zu exportieren. Was Sie mit einer exportierten Datei tun (z. B. die Weitergabe an einen Drittanbieter-Dienst), entscheiden Sie selbst; dies unterliegt den jeweiligen Datenschutzpraktiken des betreffenden Dritten und nicht dieser Erklärung.
      </p>

      <h2>Abonnements (BikePilot PRO)</h2>

      <p>
        BikePilot bietet ein optionales Abonnement mit automatischer Verlängerung („BikePilot PRO“) an, das zusätzliche Funktionen freischaltet. Käufe, Verlängerungen und Wiederherstellungen von Abonnements werden vollständig über Apples StoreKit und Ihr Apple ID / App Store Konto abgewickelt. Wir erhalten oder speichern keine Zahlungsinformationen von Ihnen — Kauf- und Abrechnungsdaten werden von Apple gemäß <a href="https://www.apple.com/legal/privacy/">Apples Datenschutzrichtlinie</a> verarbeitet und gespeichert.
      </p>

      <h2>Datenschutz von Kindern</h2>

      <p>
        BikePilot richtet sich nicht an Kinder und erhebt wissentlich keine personenbezogenen Daten von Kindern. Da die App ohnehin keine personenbezogenen Daten an uns erhebt oder übermittelt, werden vom Entwickler keine Daten über Nutzerinnen oder Nutzer — einschließlich Kindern — gespeichert.
      </p>

      <h2>Ihre Rechte</h2>

      <p>
        Da sämtliche personenbezogenen Daten, die bei der Nutzung von BikePilot entstehen (Standortverlauf, Fahrdaten, Sensormesswerte), auf Ihrem Gerät verbleiben und niemals an uns übermittelt werden, behalten Sie jederzeit die volle Kontrolle darüber: Sie können diese Daten direkt in der App einsehen, exportieren oder löschen oder die App entfernen. Da wir keine Ihrer personenbezogenen Daten auf unseren Systemen vorhalten, gibt es für diese Daten kein gesondertes Verfahren, um bei uns Auskunfts-, Berichtigungs- oder Löschanträge zu stellen.
      </p>

      <p>
        Wenn Sie Fragen zu dieser Erklärung oder dazu haben, wie die App mit Geräteberechtigungen umgeht, können Sie uns über die unten stehenden Kontaktdaten erreichen.
      </p>

      <h2>Änderungen dieser Erklärung</h2>

      <p>
        Wir können diese Datenschutzerklärung gelegentlich aktualisieren, etwa um neue App-Funktionen abzubilden. Das Datum „Zuletzt aktualisiert“ am Anfang dieses Dokuments zeigt an, wann diese Erklärung zuletzt überarbeitet wurde. Wenn Sie die App nach einer Änderung weiter nutzen, gilt dies als Zustimmung zur aktualisierten Erklärung.
      </p>
