      <p><em>Zuletzt aktualisiert: 2026-08-11</em></p>

      <p>
        Benötigen Sie Hilfe mit BikePilot? Auf dieser Seite finden Sie häufige Fragen, Schritte zur Fehlerbehebung und Informationen dazu, wie Sie uns für weitere Unterstützung erreichen können.
      </p>

      <h2>Kontakt</h2>

      <p>
        Falls Ihre Frage unten nicht beantwortet wird, schreiben Sie uns eine E-Mail — wir melden uns so schnell wie möglich bei Ihnen:
      </p>

      <p>
        <strong>Email:</strong> <a href="mailto:sebastian.gasch@outlook.com">sebastian.gasch@outlook.com</a>
      </p>

      <p>
        Bitte geben Sie bei einer Fehlermeldung möglichst Folgendes an, damit wir Ihnen schneller helfen können:
      </p>

      <ul>
        <li>App-Version (Settings → About in der App)</li>
        <li>Ihre iOS-Version und Ihr Gerätemodell</li>
        <li>Schritte zum Reproduzieren des Problems</li>
        <li>Screenshots oder Bildschirmaufnahmen, falls zutreffend</li>
      </ul>

      <h2>Häufig gestellte Fragen</h2>

      <h3>GPS und Standortaufzeichnung</h3>

      <p><strong>Meine Geschwindigkeit/Distanz/Route wirkt ungenau.</strong></p>

      <p>
        Die GPS-Genauigkeit hängt von Ihrem Gerät, dem Wetter und Ihrer Umgebung ab (hohe Gebäude, Tunnel, dichter Baumbestand usw. können das Signal beeinträchtigen). Stellen Sie sicher, dass der Standortzugriff in iOS unter Einstellungen → Datenschutz &amp; Sicherheit → Ortungsdienste → BikePilot auf „Beim Verwenden der App“ oder „Immer“ gesetzt ist und dass Ortungsdienste systemweit aktiviert sind.
      </p>

      <p><strong>Die App hat meine Fahrt nicht weiter aufgezeichnet, als ich mein iPhone gesperrt / die App gewechselt habe.</strong></p>

      <p>
        BikePilot verwendet Standortaktualisierungen im Hintergrund, damit die Aufzeichnung weiterläuft, während Ihr Gerät gesperrt ist oder Sie eine andere App verwenden. Stellen Sie sicher, dass die Standortberechtigung erteilt wurde und dass der Stromsparmodus Hintergrundaktivitäten nicht zu stark einschränkt; auf manchen Geräten kann dies die Häufigkeit von GPS-Aktualisierungen beeinflussen.
      </p>

      <h3>Bluetooth-Sensoren</h3>

      <p><strong>Mein Herzfrequenz- / Geschwindigkeits- &amp; Kadenz- / Temperatursensor stellt keine Verbindung her.</strong></p>

      <ol>
        <li>Stellen Sie sicher, dass der Sensor eingeschaltet ist und sich in Reichweite befindet (während des Koppelns in der Regel 1–2 Meter).</li>
        <li>Prüfen Sie, ob Bluetooth in den iOS-Einstellungen aktiviert ist und BikePilot die Bluetooth-Berechtigung hat (Einstellungen → Datenschutz &amp; Sicherheit → Bluetooth → BikePilot).</li>
        <li>Manche Sensoren können jeweils nur mit einer App gleichzeitig verbunden sein — trennen Sie den Sensor vor dem Verbinden in BikePilot von jeder anderen App (z. B. einer anderen Radfahr- oder Fitness-App).</li>
        <li>Starten Sie den Sensor neu (entfernen Sie ggf. die Batterie und setzen Sie sie wieder ein) und starten Sie den Scan erneut über die Sensor-Einstellungen der App.</li>
      </ol>

      <p><strong>Mein Sensor trennt die Verbindung während der Fahrt immer wieder.</strong></p>

      <p>
        Die Ursache ist meist ein schwacher Sensorakku, zu große Entfernung zum Gerät oder Bluetooth Interferenzen. In den meisten Fällen hilft es, die Batterie des Sensors zu wechseln und das iPhone in Reichweite zu halten.
      </p>

      <h3>Höhe und Steigung</h3>

      <p><strong>Höhen-/Steigungswerte sehen unplausibel aus.</strong></p>

      <p>
        BikePilot nutzt das Barometer Ihres Geräts zusammen mit GPS, um Höhe und Steigung zu schätzen. Barometrische Messwerte können im Zeitverlauf leicht driften oder durch schnelle Wetterwechsel beeinflusst werden; dabei handelt es sich um eine hardwarebedingte Einschränkung und nicht um eine Fehlfunktion der App.
      </p>

      <h3>GPX-Import/-Export</h3>

      <p><strong>Wie exportiere ich eine Fahrt?</strong></p>

      <p>
        Öffnen Sie die Fahrt in Ihrer Fahrhistorie und verwenden Sie die Teilen-/Exportieren-Option, um sie als <code>.gpx</code>-Datei zu sichern. Anschließend können Sie sie in der Dateien-App speichern, per AirDrop an ein anderes Gerät senden oder per E-Mail bzw. über eine andere App teilen.
      </p>

      <p><strong>Wie importiere ich einen GPX-Track (z. B. für die Navigation)?</strong></p>

      <p>
        Verwenden Sie die Import-Option in der App und wählen Sie eine <code>.gpx</code>-Datei aus der Dateien-App aus (Zugriff auf die Ordner „Dokumente“/„Downloads“ ist erforderlich — beim ersten Mal werden Sie dazu aufgefordert).
      </p>

      <h3>BikePilot PRO Abonnement</h3>

      <p><strong>Wie abonniere ich BikePilot PRO / wie kündige ich BikePilot PRO?</strong></p>

      <p>
        Abonnements werden vollständig über Ihre Apple ID verwaltet. Um zu abonnieren, verwenden Sie den Upgrade-Hinweis innerhalb der App. Um Ihr Abonnement anzusehen, zu ändern oder zu kündigen, gehen Sie zu iOS Einstellungen → [Ihr Name] → Abonnements oder in der App Store App zu Ihrem Profilsymbol → Abonnements.
      </p>

      <p><strong>Ich habe abonniert, aber die PRO-Funktionen sind nicht freigeschaltet.</strong></p>

      <p>
        Versuchen Sie in den Einstellungen bzw. auf dem Upgrade-Bildschirm der App die Option „Käufe wiederherstellen“. Wenn das Problem nach einem Neustart der App weiterhin besteht, kontaktieren Sie uns bitte mit der zu Ihrer Apple ID gehörenden E-Mail-Adresse (teilen Sie niemals Ihr Apple ID Passwort mit) und dem ungefähren Kaufdatum, damit wir den Fall prüfen können.
      </p>

      <p><strong>Mir wurde etwas berechnet, ich wollte aber nicht verlängern / ich möchte eine Rückerstattung.</strong></p>

      <p>
        Rückerstattungen und Abrechnungsfragen werden direkt von Apple bearbeitet, nicht vom Entwickler. Sie können eine Rückerstattung unter <a href="https://reportaproblem.apple.com">reportaproblem.apple.com</a> anfordern oder über Einstellungen → [Ihr Name] → Abonnements auf Ihrem Gerät.
      </p>

      <h3>Datenschutz</h3>

      <p>
        BikePilot speichert alle Ihre Fahrdaten lokal auf Ihrem Gerät und betreibt keinen Backend-Server. Ausführliche Informationen dazu, auf welche Daten die App zugreift und wie diese verwendet werden, finden Sie in unserer <a href="privacy-policy.html">Datenschutzerklärung</a>.
      </p>

      <h3>Allgemeine Fehlerbehebung</h3>

      <ul>
        <li>Stellen Sie sicher, dass Sie die neueste Version von BikePilot aus dem App Store verwenden.</li>
        <li>Ein Neustart der App oder Ihres Geräts behebt viele vorübergehende Probleme (z. B. Sensorverbindungsprobleme oder Verzögerungen beim GPS-Fix).</li>
        <li>Wenn die App abstürzt oder sich unerwartet verhält, senden Sie uns bitte eine E-Mail mit einer Beschreibung des Vorfalls sowie Ihrem Gerätemodell und Ihrer iOS-Version, damit wir den Vorgang untersuchen können.</li>
      </ul>

      <h2>Funktionswünsche und Feedback</h2>

      <p>
        Wir freuen uns über Ihre Ideen für neue Funktionen oder Verbesserungen. Senden Sie Ihre Vorschläge an <a href="mailto:sebastian.gasch@outlook.com">sebastian.gasch@outlook.com</a> — wir lesen jede Nachricht.
      </p>
