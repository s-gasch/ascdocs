      <h2>2. Beschreibung der App</h2>

        BikePilot ist eine Fahrradcomputer-App, die GPS, Barometer und optionale Bluetooth Low Energy (BLE) Sensoren (Herzfrequenz, Geschwindigkeit &amp; Kadenz, Temperatur) Ihres Geräts nutzt, um Fahrdaten wie Geschwindigkeit, Distanz, Höhe, Steigung und Route auf einer Karte anzuzeigen und aufzuzeichnen. Einige Funktionen sind nur mit einem optionalen Abonnement mit automatischer Verlängerung („BikePilot PRO“) verfügbar, wie unten beschrieben.
      </p>
