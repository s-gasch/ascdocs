    <template id="doc-content" data-doc-title="Privacy Policy">
      <p><em>Last updated: 2026-08-11</em></p>

      <p>
        This Privacy Policy describes how BikePilot ("the App", "we", "us") handles information
        when you use the app. BikePilot is developed and published by Sebastian Gasch ("the
        Developer").
      </p>

      <h2>Summary</h2>
      <p>
        BikePilot is designed to work entirely on your device. We do not operate a backend
        server, we do not collect analytics, and we do not sell or share your personal data with
        third parties. The App does not track you across apps or websites owned by other
        companies.
      </p>

      <h2>Information the App Accesses</h2>
      <p>
        To provide its core cycling-computer functionality, BikePilot requests access to the
        following device capabilities. Access is requested only when needed and only with your
        permission, granted through the standard iOS permission prompts.
      </p>
      <table>
        <thead>
          <tr>
            <th>Data / Permission</th>
            <th>Purpose</th>
            <th>Where it is stored</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>Location (GPS)</strong> ("When In Use")</td>
            <td>
              Measure speed, distance, altitude and grade, and to record your route on the map
              during a ride.
            </td>
            <td>On your device only, as part of your local ride history.</td>
          </tr>
          <tr>
            <td><strong>Motion &amp; Fitness (barometer)</strong></td>
            <td>Estimate altitude changes and slope grade while you ride.</td>
            <td>
              On your device only; not stored as raw sensor data beyond the current session.
            </td>
          </tr>
          <tr>
            <td><strong>Bluetooth</strong></td>
            <td>
              Connect to your own Bluetooth Low Energy (BLE) sensors — heart rate monitor, speed
              &amp; cadence sensor, temperature sensor — to display live ride data.
            </td>
            <td>
              Sensor readings are processed on your device in real time and stored locally as
              part of your ride data; BikePilot does not transmit sensor data anywhere.
            </td>
          </tr>
          <tr>
            <td><strong>Files (Documents/Downloads folder access)</strong></td>
            <td>
              Let you import <code>.gpx</code> track files you explicitly choose, and export your
              recorded rides as <code>.gpx</code> files (e.g. to share or back up).
            </td>
            <td>
              Files you choose to import are read on your device; exported files are written to
              the location you select (e.g. Files app, AirDrop, Mail) using the standard iOS share
              sheet.
            </td>
          </tr>
        </tbody>
      </table>

      <h2>Data We Do Not Collect</h2>
      <ul>
        <li>We do not use any analytics, advertising, or crash-reporting SDKs.</li>
        <li>
          We do not operate our own servers, and the App does not send your rides, location
          history, sensor readings, or any other personal data to us or to any third party.
        </li>
        <li>
          We do not use tracking technologies (as defined by Apple's App Tracking Transparency
          framework) and do not request tracking permission.
        </li>
        <li>
          We do not collect or store account information, because BikePilot does not require
          account creation or sign-in.
        </li>
      </ul>

      <h2>Data Storage and Retention</h2>
      <p>
        All ride data (GPS tracks, speed/cadence/heart-rate/temperature readings, settings, and
        recorded rides) is stored locally on your device using Apple's standard on-device storage
        mechanisms (<code>UserDefaults</code> and local app storage). This data is not synced to
        iCloud or any other cloud service by the App itself, unless your device's own iCloud
        device backup includes the App's local data as part of a system-level backup, which is
        controlled by your iOS Settings, not by BikePilot.
      </p>
      <p>
        You can delete all locally stored ride data at any time by deleting recorded rides within
        the App, or by deleting the App from your device, which removes all of its local data in
        accordance with standard iOS app-deletion behavior.
      </p>

      <h2>GPX Import/Export</h2>
      <p>
        BikePilot lets you import <code>.gpx</code> files you select and export your recorded
        rides as <code>.gpx</code> files using the iOS share sheet. What you do with an exported
        file (e.g. sharing it with a third-party service) is your choice and is governed by that
        third party's own privacy practices, not by this Policy.
      </p>

      <h2>Subscriptions (BikePilot PRO)</h2>
      <p>
        BikePilot offers an optional auto-renewable subscription ("BikePilot PRO") that unlocks
        additional features. Subscription purchases, renewals, and restores are handled entirely
        by Apple's StoreKit and your Apple ID / App Store account. We do not receive or store your
        payment information — purchase and billing data is processed and retained by Apple in
        accordance with
        <a href="https://www.apple.com/legal/privacy/">Apple's Privacy Policy</a>.
      </p>

      <h2>Children's Privacy</h2>
      <p>
        BikePilot is not directed at children and does not knowingly collect personal data from
        children. Because the App does not collect or transmit personal data to us in the first
        place, no data about any user, including children, is retained by the Developer.
      </p>

      <h2>Your Rights</h2>
      <p>
        Because all personal data created by using BikePilot (location history, ride data, sensor
        readings) remains on your device and is never transmitted to us, you retain full control
        over it at all times: you can view, export, or delete it directly within the App or by
        removing the App. As we do not hold any of your personal data on our systems, there is no
        separate data-access, correction, or deletion request process to submit to us for that
        data.
      </p>
      <p>
        If you have questions about this Policy or how the App handles device permissions, you
        may contact us using the details below.
      </p>

      <h2>Changes to This Policy</h2>
      <p>
        We may update this Privacy Policy from time to time, for example to reflect new App
        features. The "Last updated" date at the top of this document indicates when it was last
        revised. Continued use of the App after a change constitutes acceptance of the updated
        Policy.
      </p>

      </p>
    </template>
