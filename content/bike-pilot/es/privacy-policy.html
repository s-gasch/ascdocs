    <template id="doc-content" data-doc-title="Política de privacidad">
      <p><em>Última actualización: 2026-08-11</em></p>

      <p>
        Esta Política de privacidad describe cómo BikePilot ("la App", "nosotros") gestiona la información cuando usted utiliza la app. BikePilot está desarrollada y publicada por Sebastian Gasch ("el Desarrollador").
      </p>

      <h2>Resumen</h2>

      <p>
        BikePilot está diseñada para funcionar íntegramente en su dispositivo. No operamos ningún servidor backend, no recopilamos analíticas y no vendemos ni compartimos sus datos personales con terceros. La App no le rastrea a través de apps o sitios web propiedad de otras empresas.
      </p>

      <h2>Información a la que accede la App</h2>

      <p>
        Para ofrecer su funcionalidad principal como ciclocomputador, BikePilot solicita acceso a las siguientes capacidades del dispositivo. El acceso solo se solicita cuando es necesario y únicamente con su permiso, concedido mediante los avisos de autorización estándar de iOS.
      </p>

      <table>
        <thead>
          <tr>
            <th>Datos / Permiso</th>
            <th>Finalidad</th>
            <th>Dónde se almacena</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>Ubicación (GPS)</strong> ("When In Use")</td>
            <td>Medir velocidad, distancia, altitud y pendiente, y registrar su ruta en el mapa durante una actividad.</td>
            <td>Solo en su dispositivo, como parte de su historial local de actividades.</td>
          </tr>
          <tr>
            <td><strong>Movimiento y Fitness (barómetro)</strong></td>
            <td>Estimar los cambios de altitud y la pendiente mientras circula.</td>
            <td>Solo en su dispositivo; no se almacena como datos brutos del sensor más allá de la sesión actual.</td>
          </tr>
          <tr>
            <td><strong>Bluetooth</strong></td>
            <td>Conectar con sus propios sensores Bluetooth Low Energy (BLE) — monitor de frecuencia cardíaca, sensor de velocidad y cadencia, sensor de temperatura — para mostrar datos de la actividad en tiempo real.</td>
            <td>Las lecturas de los sensores se procesan en tiempo real en su dispositivo y se almacenan localmente como parte de sus datos de actividad; BikePilot no transmite los datos de los sensores a ningún lugar.</td>
          </tr>
          <tr>
            <td><strong>Archivos (acceso a las carpetas Documentos/Descargas)</strong></td>
            <td>Permitirle importar archivos de trayecto <code>.gpx</code> que usted elija expresamente y exportar sus actividades registradas como archivos <code>.gpx</code> (por ejemplo, para compartirlas o crear una copia de seguridad).</td>
            <td>Los archivos que usted elige importar se leen en su dispositivo; los archivos exportados se escriben en la ubicación que usted seleccione (por ejemplo, la app Archivos, AirDrop, Mail) mediante la hoja estándar para compartir de iOS.</td>
          </tr>
        </tbody>
      </table>

      <h2>Datos que no recopilamos</h2>

      <ul>
        <li>No utilizamos SDK de analítica, publicidad ni informes de fallos.</li>
        <li>No operamos nuestros propios servidores, y la App no nos envía a nosotros ni a ningún tercero sus actividades, historial de ubicación, lecturas de sensores ni ningún otro dato personal.</li>
        <li>No utilizamos tecnologías de seguimiento (según la definición del marco App Tracking Transparency de Apple) y no solicitamos permiso de seguimiento.</li>
        <li>No recopilamos ni almacenamos información de cuentas, porque BikePilot no requiere crear una cuenta ni iniciar sesión.</li>
      </ul>

      <h2>Almacenamiento y conservación de datos</h2>

      <p>
        Todos los datos de actividad (tracks GPS, lecturas de velocidad/cadencia/frecuencia cardíaca/temperatura, ajustes y actividades registradas) se almacenan localmente en su dispositivo mediante los mecanismos estándar de almacenamiento local de Apple (<code>UserDefaults</code> y almacenamiento local de la app). La propia App no sincroniza estos datos con iCloud ni con ningún otro servicio en la nube, salvo que la copia de seguridad del dispositivo en iCloud incluya los datos locales de la App como parte de una copia de seguridad a nivel del sistema, algo que depende de sus ajustes de iOS y no de BikePilot.
      </p>

      <p>
        Usted puede eliminar en cualquier momento todos los datos de actividad almacenados localmente, borrando las actividades registradas dentro de la App o eliminando la App de su dispositivo, lo que suprime todos sus datos locales de acuerdo con el comportamiento estándar de iOS al eliminar apps.
      </p>

      <h2>Importación/exportación de GPX</h2>

      <p>
        BikePilot le permite importar los archivos <code>.gpx</code> que usted seleccione y exportar sus actividades registradas como archivos <code>.gpx</code> mediante la hoja para compartir de iOS. Lo que usted haga con un archivo exportado (por ejemplo, compartirlo con un servicio de terceros) es decisión suya y se rige por las prácticas de privacidad de ese tercero, no por esta Política.
      </p>

      <h2>Suscripciones (BikePilot PRO)</h2>

      <p>
        BikePilot ofrece una suscripción opcional con renovación automática ("BikePilot PRO") que desbloquea funciones adicionales. Las compras, renovaciones y restauraciones de suscripciones se gestionan íntegramente a través de StoreKit de Apple y de su cuenta de Apple ID / App Store. No recibimos ni almacenamos su información de pago: Apple procesa y conserva los datos de compra y facturación de conformidad con la <a href="https://www.apple.com/legal/privacy/">Política de Privacidad de Apple</a>.
      </p>

      <h2>Privacidad infantil</h2>

      <p>
        BikePilot no está dirigida a menores y no recopila conscientemente datos personales de menores. Como la App no recopila ni nos transmite datos personales en primer lugar, el Desarrollador no conserva datos de ningún usuario, incluidos los menores.
      </p>

      <h2>Sus derechos</h2>

      <p>
        Dado que todos los datos personales generados por el uso de BikePilot (historial de ubicación, datos de actividad, lecturas de sensores) permanecen en su dispositivo y nunca se nos transmiten, usted conserva en todo momento el control total sobre ellos: puede consultarlos, exportarlos o eliminarlos directamente en la App o eliminando la App. Como no conservamos ninguno de sus datos personales en nuestros sistemas, no existe un proceso independiente para solicitarnos acceso, rectificación o eliminación de esos datos.
      </p>

      <p>
        Si tiene preguntas sobre esta Política o sobre cómo la App gestiona los permisos del dispositivo, puede ponerse en contacto con nosotros mediante los datos que figuran a continuación.
      </p>

      <h2>Cambios en esta Política</h2>

      <p>
        Podremos actualizar esta Política de privacidad ocasionalmente, por ejemplo para reflejar nuevas funciones de la App. La fecha de "Última actualización" situada al inicio de este documento indica cuándo se revisó por última vez. El uso continuado de la App después de un cambio constituye la aceptación de la Política actualizada.
      </p>
