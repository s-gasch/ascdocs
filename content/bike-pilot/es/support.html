      <p><em>Última actualización: 2026-08-11</em></p>

      <p>
        ¿Necesita ayuda con BikePilot? Esta página recoge preguntas frecuentes, pasos de solución de problemas y la forma de ponerse en contacto con nosotros para recibir asistencia adicional.
      </p>

      <h2>Contacto</h2>

      <p>
        Si su pregunta no queda resuelta a continuación, envíenos un correo electrónico y le responderemos lo antes posible:
      </p>

      <p>
        <strong>Email:</strong> <a href="mailto:sebastian.gasch@outlook.com">sebastian.gasch@outlook.com</a>
      </p>

      <p>
        Incluya lo siguiente al informar de un problema para que podamos ayudarle más rápido:
      </p>

      <ul>
        <li>Versión de la app (Ajustes → Acerca de en la app)</li>
        <li>Su versión de iOS y el modelo del dispositivo</li>
        <li>Pasos para reproducir el problema</li>
        <li>Capturas de pantalla o grabaciones de pantalla, si procede</li>
      </ul>

      <h2>Preguntas frecuentes</h2>

      <h3>GPS y seguimiento de ubicación</h3>

      <p><strong>La velocidad/distancia/ruta parece inexacta.</strong></p>

      <p>
        La precisión del GPS depende de su dispositivo, del tiempo y del entorno (por ejemplo, edificios altos, túneles o zonas con vegetación densa pueden degradar la señal). Asegúrese de que el acceso a la ubicación esté configurado como "While Using the App" o "Always" en Ajustes de iOS → Privacidad y seguridad → Localización → BikePilot, y de que la localización esté activada en todo el sistema.
      </p>

      <p><strong>La App dejó de registrar mi actividad al bloquear el teléfono o al cambiar de app.</strong></p>

      <p>
        BikePilot utiliza actualizaciones de ubicación en segundo plano para seguir registrando datos mientras el dispositivo está bloqueado o usted utiliza otra app. Asegúrese de haber concedido el permiso de ubicación y de que el modo de bajo consumo no esté limitando de forma agresiva la actividad en segundo plano, ya que esto puede afectar a la frecuencia de actualización del GPS en algunos dispositivos.
      </p>

      <h3>Sensores Bluetooth</h3>

      <p><strong>Mi sensor de frecuencia cardíaca / velocidad y cadencia / temperatura no se conecta.</strong></p>

      <ol>
        <li>Asegúrese de que el sensor esté encendido y dentro del alcance (normalmente 1–2 metros durante el emparejamiento).</li>
        <li>Confirme que Bluetooth esté activado en Ajustes de iOS y que BikePilot tenga permiso para usar Bluetooth (Ajustes → Privacidad y seguridad → Bluetooth → BikePilot).</li>
        <li>Algunos sensores solo pueden conectarse a una app al mismo tiempo: desconecte el sensor de cualquier otra app (por ejemplo, otra app de ciclismo o fitness) antes de conectarlo en BikePilot.</li>
        <li>Pruebe a reiniciar el sensor (retire y vuelva a colocar la batería, si procede) y vuelva a buscarlo desde los ajustes de sensores de la App.</li>
      </ol>

      <p><strong>Mi sensor se desconecta continuamente durante la actividad.</strong></p>

      <p>
        Esto suele deberse a poca batería en el sensor, a la distancia con respecto al dispositivo o a interferencias de Bluetooth. Sustituir la batería del sensor y mantener el teléfono dentro del alcance suele resolver el problema.
      </p>

      <h3>Altitud y pendiente</h3>

      <p><strong>Las lecturas de altitud/pendiente parecen incorrectas.</strong></p>

      <p>
        BikePilot utiliza el barómetro del dispositivo junto con el GPS para estimar la altitud y la pendiente. Las lecturas barométricas pueden desviarse ligeramente con el tiempo o verse afectadas por cambios rápidos de tiempo; se trata de una limitación del hardware y no de un fallo de la App.
      </p>

      <h3>Importación/exportación de GPX</h3>

      <p><strong>¿Cómo exporto una actividad?</strong></p>

      <p>
        Abra la actividad desde su historial y use la opción de compartir/exportar para guardarla como un archivo <code>.gpx</code>, que después podrá guardar en la app Archivos, enviar por AirDrop a otro dispositivo o compartir por correo electrónico u otra app.
      </p>

      <p><strong>¿Cómo importo un track GPX (por ejemplo, para navegación)?</strong></p>

      <p>
        Use la opción de importar en la App y elija un archivo <code>.gpx</code> desde la app Archivos (se requiere acceso a la carpeta Documentos/Descargas; se le solicitará la primera vez).
      </p>

      <h3>Suscripción BikePilot PRO</h3>

      <p><strong>¿Cómo me suscribo a BikePilot PRO o cancelo la suscripción?</strong></p>

      <p>
        Las suscripciones se gestionan íntegramente a través de su Apple ID. Para suscribirse, use el aviso de actualización dentro de la App. Para ver, cambiar o cancelar su suscripción, vaya a Ajustes de iOS → [su nombre] → Suscripciones, o a la app App Store → el icono de su perfil → Suscripciones.
      </p>

      <p><strong>Me suscribí, pero las funciones PRO no se han desbloqueado.</strong></p>

      <p>
        Pruebe a usar la opción "Restore Purchases" en la pantalla de ajustes/actualización de la App. Si el problema continúa después de reiniciar la App, póngase en contacto con nosotros indicando el correo electrónico de su Apple ID (no comparta su contraseña del Apple ID) y la fecha aproximada de la compra para que podamos investigarlo.
      </p>

      <p><strong>Me han cobrado, pero no quería renovar o quiero un reembolso.</strong></p>

      <p>
        Apple gestiona directamente los reembolsos y la facturación, no el Desarrollador. Puede solicitar un reembolso en <a href="https://reportaproblem.apple.com">reportaproblem.apple.com</a> o a través de Ajustes → [su nombre] → Suscripciones en su dispositivo.
      </p>

      <h3>Privacidad</h3>

      <p>
        BikePilot almacena todos los datos de sus actividades localmente en su dispositivo y no opera ningún servidor backend. Consulte nuestra <a href="privacy-policy.html">Política de privacidad</a> para ver todos los detalles sobre los datos a los que accede la App y cómo se utilizan.
      </p>

      <h3>Solución general de problemas</h3>

      <ul>
        <li>Asegúrese de estar utilizando la última versión de BikePilot disponible en el App Store.</li>
        <li>Reiniciar la App o el dispositivo resuelve muchos problemas transitorios (por ejemplo, problemas de conexión de sensores o retrasos al obtener señal GPS).</li>
        <li>Si la App se cierra inesperadamente o se comporta de forma extraña, envíenos por correo electrónico una descripción de lo ocurrido junto con el modelo de su dispositivo y su versión de iOS para que podamos investigarlo.</li>
      </ul>

      <h2>Solicitudes de funciones y comentarios</h2>

      <p>
        Nos encantará conocer sus ideas sobre nuevas funciones o mejoras. Envíe sus sugerencias a <a href="mailto:sebastian.gasch@outlook.com">sebastian.gasch@outlook.com</a>: leemos todos los mensajes.
      </p>
