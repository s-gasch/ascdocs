      <p><em>Dernière mise à jour: 2026-08-11</em></p>

      <p>
        La présente Politique de confidentialité décrit la manière dont BikePilot (« l’App », « nous », « notre ») traite les informations lorsque vous utilisez l’application. BikePilot est développée et publiée par Sebastian Gasch (« le Développeur »).
      </p>

      <h2>Résumé</h2>

      <p>
        BikePilot est conçue pour fonctionner entièrement sur votre appareil. Nous n’exploitons aucun serveur backend, nous ne collectons aucune donnée d’analyse et nous ne vendons ni ne partageons vos données personnelles avec des tiers. L’App ne vous suit pas à travers les apps ou sites web appartenant à d’autres sociétés.
      </p>

      <h2>Informations auxquelles l’App accède</h2>

      <p>
        Pour fournir ses fonctionnalités essentielles de compteur vélo, BikePilot demande l’accès aux capacités suivantes de votre appareil. Cet accès n’est demandé qu’en cas de besoin et uniquement avec votre autorisation, accordée via les demandes standard d’iOS.
      </p>

      <table>
        <thead>
          <tr>
            <th>Données / Autorisation</th>
            <th>Finalité</th>
            <th>Lieu de stockage</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>Location (GPS)</strong> (« Quand l’app est active »)</td>
            <td>Mesurer la vitesse, la distance, l’altitude et la pente, et enregistrer votre itinéraire sur la carte pendant une sortie.</td>
            <td>Uniquement sur votre appareil, dans votre historique local des sorties.</td>
          </tr>
          <tr>
            <td><strong>Données de mouvement et d’activité physique (baromètre)</strong></td>
            <td>Estimer les variations d’altitude et la pente pendant vos sorties.</td>
            <td>Uniquement sur votre appareil ; non conservées sous forme de données brutes de capteur au-delà de la session en cours.</td>
          </tr>
          <tr>
            <td><strong>Bluetooth</strong></td>
            <td>Se connecter à vos propres capteurs Bluetooth Low Energy (BLE) — cardiofréquencemètre, capteur de vitesse &amp; cadence, capteur de température — afin d’afficher les données de sortie en direct.</td>
            <td>Les mesures des capteurs sont traitées en temps réel sur votre appareil et stockées localement dans vos données de sortie ; BikePilot ne transmet les données des capteurs nulle part.</td>
          </tr>
          <tr>
            <td><strong>Fichiers (accès aux dossiers Documents/Téléchargements)</strong></td>
            <td>Vous permettre d’importer les fichiers <code>.gpx</code> que vous choisissez explicitement et d’exporter vos sorties enregistrées au format <code>.gpx</code> (par exemple pour les partager ou les sauvegarder).</td>
            <td>Les fichiers que vous choisissez d’importer sont lus sur votre appareil ; les fichiers exportés sont écrits à l’emplacement que vous sélectionnez (par ex. Fichiers, AirDrop, Mail) via la feuille de partage standard d’iOS.</td>
          </tr>
        </tbody>
      </table>

      <h2>Données que nous ne collectons pas</h2>

      <ul>
        <li>Nous n’utilisons aucun SDK d’analyse, de publicité ou de rapport de plantage.</li>
        <li>Nous n’exploitons pas nos propres serveurs, et l’App n’envoie ni vos sorties, ni votre historique de localisation, ni les mesures de vos capteurs, ni aucune autre donnée personnelle à nous-mêmes ou à un tiers.</li>
        <li>Nous n’utilisons aucune technologie de suivi (au sens du cadre App Tracking Transparency d’Apple) et ne demandons aucune autorisation de suivi.</li>
        <li>Nous ne collectons ni ne stockons d’informations de compte, car BikePilot ne nécessite ni création de compte ni connexion.</li>
      </ul>

      <h2>Stockage et conservation des données</h2>

      <p>
        Toutes les données de sortie (traces GPS, mesures de vitesse/cadence/fréquence cardiaque/ température, réglages et sorties enregistrées) sont stockées localement sur votre appareil à l’aide des mécanismes standard de stockage local d’Apple (<code>UserDefaults</code> et stockage local de l’app). Ces données ne sont synchronisées ni avec iCloud ni avec aucun autre service cloud par l’App elle-même, sauf si la sauvegarde iCloud de votre appareil inclut les données locales de l’App dans le cadre d’une sauvegarde système ; cela dépend de vos réglages iOS, et non de BikePilot.
      </p>

      <p>
        Vous pouvez supprimer à tout moment toutes les données de sortie stockées localement en supprimant les sorties enregistrées dans l’App, ou en supprimant l’App de votre appareil, ce qui efface l’ensemble de ses données locales conformément au comportement standard d’iOS lors de la suppression d’une app.
      </p>

      <h2>Importation/exportation GPX</h2>

      <p>
        BikePilot vous permet d’importer les fichiers <code>.gpx</code> que vous sélectionnez et d’exporter vos sorties enregistrées sous forme de fichiers <code>.gpx</code> via la feuille de partage iOS. L’usage que vous faites d’un fichier exporté (par ex. le partager avec un service tiers) relève de votre choix et est régi par les pratiques de confidentialité de ce tiers, et non par la présente Politique.
      </p>

      <h2>Abonnements (BikePilot PRO)</h2>

      <p>
        BikePilot propose un abonnement auto-renouvelable facultatif (« BikePilot PRO ») qui débloque des fonctionnalités supplémentaires. Les achats d’abonnement, renouvellements et restaurations sont gérés intégralement par StoreKit d’Apple et par votre compte Apple ID / App Store. Nous ne recevons ni ne stockons vos informations de paiement — les données d’achat et de facturation sont traitées et conservées par Apple conformément à la <a href="https://www.apple.com/legal/privacy/">Politique de confidentialité d’Apple</a>.
      </p>

      <h2>Vie privée des enfants</h2>

      <p>
        BikePilot n’est pas destinée aux enfants et ne collecte pas sciemment de données personnelles concernant des enfants. Comme l’App ne collecte ni ne nous transmet de données personnelles en premier lieu, aucune donnée relative à un utilisateur, y compris un enfant, n’est conservée par le Développeur.
      </p>

      <h2>Vos droits</h2>

      <p>
        Comme toutes les données personnelles créées lors de l’utilisation de BikePilot (historique de localisation, données de sortie, mesures de capteurs) restent sur votre appareil et ne nous sont jamais transmises, vous en gardez à tout moment l’entier contrôle : vous pouvez les consulter, les exporter ou les supprimer directement dans l’App ou en supprimant l’App. Puisque nous ne détenons aucune de vos données personnelles sur nos systèmes, il n’existe pas de procédure distincte de demande d’accès, de rectification ou de suppression à nous adresser pour ces données.
      </p>

      <p>
        Si vous avez des questions sur la présente Politique ou sur la manière dont l’App gère les autorisations de l’appareil, vous pouvez nous contacter à l’aide des coordonnées ci-dessous.
      </p>

      <h2>Modifications de la présente Politique</h2>

      <p>
        Nous pouvons mettre à jour la présente Politique de confidentialité de temps à autre, par exemple pour tenir compte de nouvelles fonctionnalités de l’App. La date de « dernière mise à jour » en haut de ce document indique la date de sa dernière révision. La poursuite de l’utilisation de l’App après une modification vaut acceptation de la Politique mise à jour.
      </p>
