      <p><em>Dernière mise à jour: 2026-08-11</em></p>

      <p>
        Besoin d’aide avec BikePilot ? Cette page rassemble les questions fréquentes, des étapes de dépannage et la marche à suivre pour nous contacter si vous avez besoin d’une aide complémentaire.
      </p>

      <h2>Contact</h2>

      <p>
        Si votre question ne trouve pas de réponse ci-dessous, écrivez-nous par e-mail et nous vous répondrons dès que possible :
      </p>

      <p>
        <strong>Email:</strong> <a href="mailto:sebastian.gasch@outlook.com">sebastian.gasch@outlook.com</a>
      </p>

      <p>
        Merci d’inclure les éléments suivants lorsque vous signalez un problème, afin que nous puissions vous aider plus rapidement :
      </p>

      <ul>
        <li>Version de l’App (dans l’App : Settings → About)</li>
        <li>Votre version d’iOS et le modèle de votre appareil</li>
        <li>Les étapes permettant de reproduire le problème</li>
        <li>Des captures d’écran ou enregistrements d’écran, le cas échéant</li>
      </ul>

      <h2>Questions fréquentes</h2>

      <h3>GPS et suivi de la localisation</h3>

      <p><strong>Ma vitesse / ma distance / mon itinéraire semblent inexacts.</strong></p>

      <p>
        La précision du GPS dépend de votre appareil, de la météo et de votre environnement (immeubles élevés, tunnels, couverture arborée dense, etc. peuvent dégrader le signal). Vérifiez que l’accès à la localisation est réglé sur « Quand l’app est active » ou « Toujours » dans Réglages iOS → Confidentialité et sécurité → Service de localisation → BikePilot, et que le Service de localisation est activé au niveau du système.
      </p>

      <p><strong>L’App a cessé d’enregistrer ma sortie lorsque j’ai verrouillé mon téléphone / changé d’app.</strong></p>

      <p>
        BikePilot utilise les mises à jour de localisation en arrière-plan pour continuer l’enregistrement lorsque votre appareil est verrouillé ou que vous utilisez une autre app. Vérifiez que l’autorisation de localisation est accordée et que le mode économie d’énergie ne limite pas trop fortement l’activité en arrière-plan, car cela peut affecter la fréquence des mises à jour GPS sur certains appareils.
      </p>

      <h3>Capteurs Bluetooth</h3>

      <p><strong>Mon capteur de fréquence cardiaque / de vitesse &amp; cadence / de température ne se connecte pas.</strong></p>

      <ol>
        <li>Vérifiez que le capteur est allumé et à portée (généralement 1 à 2 mètres lors de l’appairage).</li>
        <li>Vérifiez que Bluetooth est activé dans les Réglages iOS et que BikePilot dispose de l’autorisation Bluetooth (Réglages → Confidentialité et sécurité → Bluetooth → BikePilot).</li>
        <li>Certains capteurs ne peuvent être connectés qu’à une seule app à la fois — déconnectez le capteur de toute autre app (par ex. une autre app de vélo ou de fitness) avant de le connecter dans BikePilot.</li>
        <li>Essayez de redémarrer le capteur (retirez puis remettez la batterie, le cas échéant) et relancez un scan depuis les réglages des capteurs de l’App.</li>
      </ol>

      <p><strong>Mon capteur se déconnecte sans arrêt pendant la sortie.</strong></p>

      <p>
        Cela est généralement dû à une pile faible, à une distance trop importante par rapport à l’appareil ou à des interférences Bluetooth. Le remplacement de la pile du capteur et le fait de garder votre téléphone à portée résolvent généralement le problème.
      </p>

      <h3>Altitude et pente</h3>

      <p><strong>Les valeurs d’altitude / de pente semblent erronées.</strong></p>

      <p>
        BikePilot utilise le baromètre de votre appareil ainsi que le GPS pour estimer l’altitude et la pente. Les mesures barométriques peuvent légèrement dériver avec le temps ou être affectées par des changements météorologiques rapides ; il s’agit d’une limite matérielle plutôt que d’un dysfonctionnement de l’App.
      </p>

      <h3>Importation/exportation GPX</h3>

      <p><strong>Comment exporter une sortie ?</strong></p>

      <p>
        Ouvrez la sortie depuis votre historique et utilisez l’option de partage/export afin de l’enregistrer en tant que fichier <code>.gpx</code>, que vous pourrez ensuite enregistrer dans l’app Fichiers, envoyer via AirDrop vers un autre appareil, ou partager par e-mail ou via une autre app.
      </p>

      <p><strong>Comment importer une trace GPX (par ex. pour la navigation) ?</strong></p>

      <p>
        Utilisez l’option d’importation dans l’App et choisissez un fichier <code>.gpx</code> depuis l’app Fichiers (un accès au dossier Documents/Téléchargements est requis — une demande vous sera présentée la première fois).
      </p>

      <h3>Abonnement BikePilot PRO</h3>

      <p><strong>Comment m’abonner à / résilier BikePilot PRO ?</strong></p>

      <p>
        Les abonnements sont gérés intégralement via votre Apple ID. Pour vous abonner, utilisez l’invite de mise à niveau dans l’App. Pour consulter, modifier ou résilier votre abonnement, rendez-vous dans Réglages iOS → [votre nom] → Abonnements, ou dans l’app App Store → l’icône de votre profil → Abonnements.
      </p>

      <p><strong>Je me suis abonné, mais les fonctionnalités PRO ne sont pas débloquées.</strong></p>

      <p>
        Essayez d’utiliser l’option « Restore Purchases » dans l’écran de réglages / mise à niveau de l’App. Si le problème persiste après avoir redémarré l’App, contactez-nous avec l’adresse e-mail de votre Apple ID (ne communiquez pas votre mot de passe Apple ID) ainsi que la date approximative de l’achat afin que nous puissions vous aider à vérifier la situation.
      </p>

      <p><strong>J’ai été facturé alors que je ne voulais pas renouveler / je souhaite un remboursement.</strong></p>

      <p>
        Les remboursements et la facturation sont gérés directement par Apple, et non par le Développeur. Vous pouvez demander un remboursement sur <a href="https://reportaproblem.apple.com">reportaproblem.apple.com</a> ou via Réglages iOS → [votre nom] → Abonnements sur votre appareil.
      </p>

      <h3>Confidentialité</h3>

      <p>
        BikePilot stocke toutes vos données de sortie localement sur votre appareil et n’exploite aucun serveur backend. Consultez notre <a href="privacy-policy.html">Politique de confidentialité</a> pour obtenir tous les détails sur les données auxquelles l’App accède et sur leur utilisation.
      </p>

      <h3>Dépannage général</h3>

      <ul>
        <li>Vérifiez que vous utilisez la dernière version de BikePilot disponible sur l’App Store.</li>
        <li>Le redémarrage de l’App ou de votre appareil résout de nombreux problèmes temporaires (par ex. problèmes de connexion de capteur, délais d’acquisition du signal GPS).</li>
        <li>Si l’App plante ou se comporte de manière inattendue, merci de nous envoyer par e-mail une description de ce qui s’est produit, ainsi que le modèle de votre appareil et votre version d’iOS, afin que nous puissions mener notre enquête.</li>
      </ul>

      <h2>Demandes de fonctionnalités et retours</h2>

      <p>
        Nous serions ravis de connaître vos idées de nouvelles fonctionnalités ou d’améliorations. Envoyez vos suggestions à <a href="mailto:sebastian.gasch@outlook.com">sebastian.gasch@outlook.com</a> — nous lisons chaque message.
      </p>
