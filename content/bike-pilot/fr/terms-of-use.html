      <h2>2. Description de l’App</h2>

      <p>
        BikePilot est une application de compteur vélo qui utilise le GPS, le baromètre et, en option, des capteurs Bluetooth Low Energy (BLE) (fréquence cardiaque, vitesse &amp; cadence, température) de votre appareil afin d’afficher et d’enregistrer des données de sortie telles que la vitesse, la distance, l’altitude, la pente et l’itinéraire sur une carte. Certaines fonctionnalités ne sont disponibles qu’avec un abonnement auto-renouvelable facultatif (« BikePilot PRO »), comme indiqué ci-dessous.
      </p>
