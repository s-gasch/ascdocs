      <p><em>Ultimo aggiornamento: 2026-08-11</em></p>

      <p>
        La presente Informativa sulla privacy descrive come BikePilot ("l’App", "noi", "ci") gestisce le informazioni quando Lei utilizza l’app. BikePilot è sviluppata e pubblicata da Sebastian Gasch ("lo Sviluppatore").
      </p>

      <h2>Sintesi</h2>

      <p>
        BikePilot è progettata per funzionare interamente sul Suo dispositivo. Non gestiamo alcun server backend, non raccogliamo analytics e non vendiamo né condividiamo i Suoi dati personali con terze parti. L’App non La traccia attraverso app o siti web di altre società.
      </p>

      <h2>Informazioni a cui l’App accede</h2>

      <p>
        Per fornire le sue funzionalità essenziali di ciclocomputer, BikePilot richiede l’accesso alle seguenti capacità del dispositivo. L’accesso viene richiesto solo quando necessario e solo con il Suo consenso, tramite i consueti prompt di autorizzazione di iOS.
      </p>

      <table>
        <thead>
          <tr>
            <th>Dati / Autorizzazione</th>
            <th>Finalità</th>
            <th>Dove sono archiviati</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>Posizione (GPS)</strong> ("When In Use")</td>
            <td>Misurare velocità, distanza, altitudine e pendenza, e registrare il Suo percorso sulla mappa durante un’uscita.</td>
            <td>Solo sul Suo dispositivo, come parte della cronologia locale delle uscite.</td>
          </tr>
          <tr>
            <td><strong>Movimento e forma fisica (barometro)</strong></td>
            <td>Stimare le variazioni di altitudine e la pendenza durante l’uscita.</td>
            <td>Solo sul Suo dispositivo; i dati grezzi dei sensori non vengono conservati oltre la sessione corrente.</td>
          </tr>
          <tr>
            <td><strong>Bluetooth</strong></td>
            <td>Collegarsi ai Suoi sensori Bluetooth Low Energy (BLE) — cardiofrequenzimetro, sensore di velocità e cadenza, sensore di temperatura — per mostrare dati live dell’uscita.</td>
            <td>Le letture dei sensori vengono elaborate in tempo reale sul Suo dispositivo e salvate localmente come parte dei dati dell’uscita; BikePilot non trasmette i dati dei sensori da nessuna parte.</td>
          </tr>
          <tr>
            <td><strong>File (accesso alle cartelle Documents/Downloads)</strong></td>
            <td>ConsentirLe di importare file traccia <code>.gpx</code> da Lei scelti esplicitamente ed esportare le Sue uscite registrate come file <code>.gpx</code> (ad esempio per condividerli o crearne una copia di backup).</td>
            <td>I file che sceglie di importare vengono letti sul Suo dispositivo; i file esportati vengono scritti nella posizione da Lei selezionata (ad es. app File, AirDrop, Mail) tramite il foglio di condivisione standard di iOS.</td>
          </tr>
        </tbody>
      </table>

      <h2>Dati che non raccogliamo</h2>

      <ul>
        <li>Non utilizziamo SDK di analytics, pubblicità o crash reporting.</li>
        <li>Non gestiamo nostri server e l’App non invia a noi né a terze parti le Sue uscite, la cronologia della posizione, le letture dei sensori o qualsiasi altro dato personale.</li>
        <li>Non utilizziamo tecnologie di tracciamento (come definite dal framework App Tracking Transparency di Apple) e non richiediamo il permesso di tracciamento.</li>
        <li>Non raccogliamo né archiviamo informazioni di account, perché BikePilot non richiede la creazione di un account né l’accesso.</li>
      </ul>

      <h2>Archiviazione e conservazione dei dati</h2>

      <p>
        Tutti i dati delle uscite (tracce GPS, letture di velocità/cadenza/frequenza cardiaca/temperatura, impostazioni e uscite registrate) vengono archiviati localmente sul Suo dispositivo utilizzando i meccanismi standard di archiviazione on-device di Apple (<code>UserDefaults</code> e spazio di archiviazione locale dell’app). Questi dati non vengono sincronizzati su iCloud o su altri servizi cloud da parte dell’App stessa, a meno che il backup iCloud del Suo dispositivo non includa i dati locali dell’App come parte di un backup a livello di sistema, che è controllato dalle Sue impostazioni iOS e non da BikePilot.
      </p>

      <p>
        Può eliminare in qualsiasi momento tutti i dati delle uscite archiviati localmente cancellando le uscite registrate all’interno dell’App oppure eliminando l’App dal Suo dispositivo, operazione che rimuove tutti i dati locali in conformità al normale comportamento di iOS per la rimozione delle app.
      </p>

      <h2>Importazione/esportazione GPX</h2>

      <p>
        BikePilot Le consente di importare i file <code>.gpx</code> che seleziona ed esportare le Sue uscite registrate come file <code>.gpx</code> utilizzando il foglio di condivisione di iOS. L’uso che farà di un file esportato (ad es. condividerlo con un servizio di terze parti) è una Sua scelta ed è disciplinato dalle pratiche sulla privacy di tale terza parte, non dalla presente Informativa.
      </p>

      <h2>Abbonamenti (BikePilot PRO)</h2>

      <p>
        BikePilot offre un abbonamento opzionale con rinnovo automatico ("BikePilot PRO") che sblocca funzionalità aggiuntive. Acquisti, rinnovi e ripristini dell’abbonamento sono gestiti interamente da StoreKit di Apple e dal Suo account Apple ID / App Store. Non riceviamo né archiviamo i Suoi dati di pagamento: i dati relativi all’acquisto e alla fatturazione vengono trattati e conservati da Apple in conformità con la <a href="https://www.apple.com/legal/privacy/">Privacy Policy di Apple</a>.
      </p>

      <h2>Privacy dei minori</h2>

      <p>
        BikePilot non è destinata ai minori e non raccoglie consapevolmente dati personali di minori. Poiché l’App non raccoglie né trasmette a noi dati personali in primo luogo, nessun dato relativo a qualsiasi utente, inclusi i minori, viene conservato dallo Sviluppatore.
      </p>

      <h2>I Suoi diritti</h2>

      <p>
        Poiché tutti i dati personali generati dall’uso di BikePilot (cronologia della posizione, dati delle uscite, letture dei sensori) restano sul Suo dispositivo e non ci vengono mai trasmessi, Lei ne mantiene in ogni momento il pieno controllo: può consultarli, esportarli o eliminarli direttamente nell’App oppure rimuovendo l’App. Poiché non conserviamo alcun Suo dato personale sui nostri sistemi, non esiste una procedura separata per richiederci l’accesso, la rettifica o la cancellazione di tali dati.
      </p>

      <p>
        Se ha domande sulla presente Informativa o su come l’App gestisce le autorizzazioni del dispositivo, può contattarci utilizzando i dettagli riportati di seguito.
      </p>

      <h2>Modifiche alla presente Informativa</h2>

      <p>
        Potremmo aggiornare periodicamente la presente Informativa sulla privacy, ad esempio per riflettere nuove funzionalità dell’App. La data di "Ultimo aggiornamento" riportata all’inizio di questo documento indica quando è stata effettuata l’ultima revisione. L’uso continuato dell’App dopo una modifica costituisce accettazione della versione aggiornata dell’Informativa.
      </p>
