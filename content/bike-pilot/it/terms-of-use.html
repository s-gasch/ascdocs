      <h2>2. Descrizione dell’App</h2>

      <p>
        BikePilot è un’app di ciclocomputer che utilizza il GPS, il barometro del Suo dispositivo e sensori opzionali Bluetooth Low Energy (BLE) (frequenza cardiaca, velocità e cadenza, temperatura) per mostrare e registrare dati dell’uscita come velocità, distanza, altitudine, pendenza e percorso su una mappa. Alcune funzionalità sono disponibili solo con un abbonamento opzionale con rinnovo automatico ("BikePilot PRO"), come descritto di seguito.
      </p>

      <h2>3. Non è un dispositivo di sicurezza o medico</h2>

        BikePilot è fornita esclusivamente a scopo informativo e ricreativo. <strong>Non</strong> è un dispositivo medico e <strong>non</strong> è destinata a diagnosticare, trattare, curare o prevenire alcuna malattia o condizione di salute, né a sostituire il giudizio professionale in ambito medico, di navigazione o di sicurezza. Le letture di GPS, barometro e sensori Bluetooth (inclusa la frequenza cardiaca) possono essere imprecise, ritardate o non disponibili a causa di limiti hardware, condizioni ambientali, meteo o problemi di connettività.
      </p>

      <p>
        <strong>Lei è l’unico responsabile della Sua sicurezza durante il ciclismo.</strong> Mantenga sempre la Sua attenzione primaria sulla strada, sul traffico e su ciò che La circonda. Non faccia affidamento sull’App come unica fonte di navigazione o monitoraggio fisiologico e consulti un medico qualificato prima di intraprendere attività fisica intensa, soprattutto se presenta condizioni di salute preesistenti.
      </p>
