    <template id="doc-content" data-doc-title="プライバシーポリシー">
      <p><em>最終更新日: 2026-08-11</em></p>

      <p>
        本プライバシーポリシーは、お客様がBikePilot（以下「本アプリ」といいます）をご利用になる際に、 本アプリがどのように情報を取り扱うかを説明するものです。BikePilotは、Sebastian Gasch （以下「開発者」といいます）が開発および公開しています。
      </p>

      <h2>概要</h2>

      <p>
        BikePilotは、完全にお客様のデバイス上で動作するよう設計されています。当方はバックエンド サーバーを運用しておらず、分析データを収集せず、またお客様の個人データを第三者に販売または 共有することもありません。本アプリは、他社が所有するAppやWebサイトをまたいでお客様を追跡 することもありません。
      </p>

      <h2>本アプリがアクセスする情報</h2>

      <p>
        BikePilotは、サイクルコンピューターとしての中核機能を提供するために、以下のデバイス機能への アクセスを求めます。アクセスは必要な場合に限って行われ、標準のiOS権限ダイアログを通じて お客様の許可をいただいた場合にのみ有効になります。
      </p>

      <table>
        <thead>
          <tr>
            <th>データ / 権限</th>
            <th>目的</th>
            <th>保存場所</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>位置情報（GPS）</strong>（「使用中のみ」）</td>
            <td>走行中の速度、距離、高度、勾配を計測し、地図上にルートを記録するため。</td>
            <td>お客様のデバイス上にのみ、ローカルの走行履歴の一部として保存されます。</td>
          </tr>
          <tr>
            <td><strong>モーションとフィットネス（気圧計）</strong></td>
            <td>走行中の高度変化および勾配を推定するため。</td>
            <td>お客様のデバイス上にのみ保存されます。現在のセッションを超えて、生のセンサーデータとして保存されることはありません。</td>
          </tr>
          <tr>
            <td><strong>Bluetooth</strong></td>
            <td>お客様ご自身のBluetooth Low Energy（BLE）センサー（心拍計、速度・ケイデンスセンサー、温度センサー）に接続し、走行データをリアルタイムで表示するため。</td>
            <td>センサーの測定値はお客様のデバイス上でリアルタイム処理され、走行データの一部としてローカルに保存されます。BikePilotがセンサーデータを外部へ送信することはありません。</td>
          </tr>
          <tr>
            <td><strong>ファイル（Documents/Downloadsフォルダへのアクセス）</strong></td>
            <td>お客様が明示的に選択した<code>.gpx</code>トラックファイルをインポートし、記録した走行データを<code>.gpx</code>ファイルとしてエクスポートするため（共有やバックアップなど）。</td>
            <td>お客様がインポートすることを選択したファイルはデバイス上で読み込まれ、エクスポートされたファイルは、標準のiOS共有シートを使用して、お客様が選択した保存先（たとえばFiles App、AirDrop、Mail）に書き出されます。</td>
          </tr>
        </tbody>
      </table>

      <h2>当方が収集しないデータ</h2>

      <ul>
        <li>当方は、分析、広告、またはクラッシュレポート用のSDKを一切使用していません。</li>
        <li>当方は独自のサーバーを運用しておらず、本アプリがお客様の走行データ、位置情報履歴、 センサー測定値、その他の個人データを、当方またはいかなる第三者にも送信することはありません。</li>
        <li>当方は、AppleのApp Tracking Transparencyフレームワークで定義されるトラッキング技術を 使用せず、トラッキング許可を求めることもありません。</li>
        <li>BikePilotではアカウント作成やサインインが不要であるため、アカウント情報を収集または保存 することはありません。</li>
      </ul>

      <h2>データの保存および保持</h2>

      <p>
        すべての走行データ（GPSトラック、速度／ケイデンス／心拍数／温度の測定値、設定、記録済みの 走行データ）は、Appleの標準的なオンデバイス保存機構（<code>UserDefaults</code>およびローカルApp ストレージ）を用いて、お客様のデバイス上にローカル保存されます。本アプリ自体が、これらの データをiCloudやその他のクラウドサービスへ同期することはありません。ただし、お客様のデバイスの iCloudデバイスバックアップに本アプリのローカルデータがシステムレベルのバックアップの一部として 含まれる場合がありますが、これはBikePilotではなく、お客様のiOS設定によって管理されます。
      </p>

      <p>
        お客様は、App内で記録済みの走行データを削除するか、またはデバイスから本アプリを削除することで、 ローカルに保存されたすべての走行データをいつでも削除できます。この場合、標準的なiOSのApp削除の 動作に従い、本アプリのローカルデータもすべて削除されます。
      </p>

      <h2>GPXのインポート／エクスポート</h2>

      <p>
        BikePilotでは、お客様が選択した<code>.gpx</code>ファイルをインポートし、記録済みの走行データをiOS共有 シートを使って<code>.gpx</code>ファイルとしてエクスポートできます。エクスポートしたファイルをどのように 利用するか（たとえば第三者サービスに共有するかどうか）は、お客様ご自身の判断によるものであり、 その取扱いは本ポリシーではなく、当該第三者のプライバシー慣行に従います。
      </p>

      <h2>サブスクリプション（BikePilot PRO）</h2>

      <p>
        BikePilotでは、追加機能を利用できる任意の自動更新サブスクリプション（「BikePilot PRO」）を 提供しています。サブスクリプションの購入、更新、および復元は、すべてAppleのStoreKitと お客様のApple ID / App Storeアカウントを通じて処理されます。当方がお客様の支払い情報を受領・ 保存することはありません。購入および請求データは、Appleが <a href="https://www.apple.com/legal/privacy/">Appleのプライバシーポリシー</a>に従って処理・保持します。
      </p>

      <h2>お子様のプライバシー</h2>

      <p>
        BikePilotはお子様を対象としたものではなく、お子様の個人データを故意に収集することもありません。 そもそも本アプリは個人データを当方に収集・送信しないため、お子様を含むいかなる利用者についても、 開発者がデータを保持することはありません。
      </p>

      <h2>お客様の権利</h2>

      <p>
        BikePilotの利用により生成されるすべての個人データ（位置情報履歴、走行データ、センサー測定値）は、 お客様のデバイス上にのみ保存され、当方に送信されることはありません。そのため、お客様は常にそれらを 完全に管理でき、App内で直接閲覧、エクスポート、削除することができます。なお、当方のシステム上に お客様の個人データを保持していないため、当該データについて、当方に対して別途アクセス、訂正、削除を 請求するための手続はありません。
      </p>

      <p>
        本ポリシーまたは本アプリによるデバイス権限の取扱いについてご不明な点がある場合は、下記の連絡先まで お問い合わせください。
      </p>

      <h2>本ポリシーの変更</h2>

      <p>
        当方は、たとえば本アプリの新機能に対応するためなど、必要に応じて本プライバシーポリシーを更新する ことがあります。本書の冒頭に記載された「最終更新日」は、直近の改定日を示しています。変更後も本アプリを 継続してご利用になった場合、更新後の本ポリシーに同意したものとみなされます。
      </p>
