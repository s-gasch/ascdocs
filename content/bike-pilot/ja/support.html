      <p>
        BikePilotでお困りですか？このページでは、よくあるご質問、トラブルシューティングの手順、 さらにサポートが必要な場合の連絡方法をご案内します。
      </p>

      <h2>連絡先</h2>

      <p>
        以下で疑問が解決しない場合は、メールでご連絡ください。できるだけ早くご返信します。
      </p>

      <p>
        <strong>Email:</strong> <a href="mailto:sebastian.gasch@outlook.com">sebastian.gasch@outlook.com</a>
      </p>

      <p>
        不具合のご報告時には、できるだけ早くご案内できるよう、以下の情報をお知らせください。
      </p>

      <ul>
        <li>Appのバージョン（App内の「設定」→「情報」）</li>
        <li>お使いのiOSバージョンとデバイスモデル</li>
        <li>問題を再現する手順</li>
        <li>必要に応じて、スクリーンショットまたは画面収録</li>
      </ul>

      <h2>よくあるご質問</h2>

      <h3>GPSと位置情報の記録</h3>

      <p><strong>速度／距離／ルートの精度が良くないようです。</strong></p>

      <p>
        GPSの精度は、デバイス、天候、周囲の環境に左右されます（高い建物、トンネル、密集した樹木などは 信号を弱める原因になります）。iOSの「設定」→「プライバシーとセキュリティ」→「位置情報サービス」 →「BikePilot」で位置情報へのアクセスが「このAppの使用中」または「常に」になっていること、 そしてシステム全体で位置情報サービスが有効になっていることをご確認ください。
      </p>

      <p><strong>スマートフォンをロックしたり、別のAppに切り替えたりすると、走行の記録が止まってしまいます。</strong></p>

      <p>
        BikePilotは、デバイスがロックされている間や別のAppを使用している間も記録を継続できるよう、 バックグラウンド位置情報更新を使用しています。位置情報の許可が有効になっており、また低電力モードが バックグラウンド動作を強く制限していないことをご確認ください。デバイスによっては、これによりGPS更新の 頻度が影響を受ける場合があります。
      </p>

      <h3>Bluetoothセンサー</h3>

      <p><strong>心拍／速度・ケイデンス／温度センサーが接続できません。</strong></p>

      <ol>
        <li>センサーの電源が入っており、接続可能な範囲内（通常、ペアリング時は1〜2メートル程度）にあることを確認してください。</li>
        <li>iOSの設定でBluetoothが有効になっていること、およびBikePilotにBluetoothの許可が付与されていることを確認してください （「設定」→「プライバシーとセキュリティ」→「Bluetooth」→「BikePilot」）。</li>
        <li>センサーによっては、同時に1つのAppにしか接続できません。BikePilotで接続する前に、ほかのApp （たとえば別のサイクリングAppやフィットネスApp）との接続を解除してください。</li>
        <li>必要に応じてセンサーを再起動し（該当する場合は電池を抜き差ししてください）、Appのセンサー設定から 再スキャンをお試しください。</li>
      </ol>

      <p><strong>走行中にセンサーの接続が何度も切れます。</strong></p>

      <p>
        多くの場合、センサーの電池残量不足、デバイスとの距離、またはBluetooth干渉が原因です。センサーの 電池を交換し、スマートフォンを通信範囲内に保つことで、通常は改善します。
      </p>

      <h3>高度と勾配</h3>

      <p><strong>高度／勾配の表示が正しくないようです。</strong></p>

      <p>
        BikePilotは、デバイスの気圧計とGPSを組み合わせて高度および勾配を推定しています。気圧計の値は、 時間の経過や急激な天候変化の影響でわずかにずれることがあり、これはAppの不具合というより、 ハードウェア上の制約によるものです。
      </p>

      <h3>GPXのインポート／エクスポート</h3>

      <p><strong>走行データをエクスポートするにはどうすればよいですか？</strong></p>

      <p>
        走行履歴から対象の走行データを開き、共有／エクスポート機能を使って<code>.gpx</code>ファイルとして保存してください。 保存後は、Files Appに保存したり、AirDropで別のデバイスへ送ったり、メールやほかのAppで共有したりできます。
      </p>

      <p><strong>GPXトラック（たとえばナビゲーション用）をインポートするにはどうすればよいですか？</strong></p>

      <p>
        App内のインポート機能を使い、Files Appから<code>.gpx</code>ファイルを選択してください （Documents/Downloadsフォルダへのアクセスが必要です。初回時に確認が表示されます）。
      </p>

      <h3>BikePilot PROサブスクリプション</h3>

      <p><strong>BikePilot PROを購読／解約するにはどうすればよいですか？</strong></p>

      <p>
        サブスクリプションはApple IDを通じて完全に管理されます。購読するには、App内のアップグレード案内を ご利用ください。サブスクリプションの確認、変更、解約は、iOSの「設定」→「[お客様のお名前]」→ 「サブスクリプション」またはApp Store App → プロフィールアイコン → サブスクリプションから行えます。
      </p>

      <p><strong>購読したのに、PRO機能が利用できません。</strong></p>

      <p>
        Appの設定画面またはアップグレード画面にある「購入を復元」をお試しください。Appを再起動しても問題が 解消しない場合は、Apple IDのメールアドレス（Apple IDのパスワードは共有しないでください）と、 おおよその購入日を添えてご連絡ください。確認のお手伝いをいたします。
      </p>

      <p><strong>更新するつもりがなかったのに請求された／返金を希望しています。</strong></p>

      <p>
        返金および請求に関する対応は、開発者ではなくAppleが直接行います。返金の申請は <a href="https://reportaproblem.apple.com">reportaproblem.apple.com</a> またはデバイスの「設定」→「[お客様のお名前]」→ 「サブスクリプション」から行えます。
      </p>

      <h3>プライバシー</h3>

      <p>
        BikePilotは、すべての走行データをお客様のデバイス上にローカル保存しており、バックエンドサーバーは 運用していません。本アプリがアクセスするデータとその利用方法の詳細については、 <a href="privacy-policy.html">プライバシーポリシー</a>をご覧ください。
      </p>

      <h3>一般的なトラブルシューティング</h3>

      <ul>
        <li>App StoreからBikePilotの最新バージョンを使用していることをご確認ください。</li>
        <li>Appやデバイスの再起動で、一時的な問題（たとえばセンサー接続の不具合、GPS捕捉の遅れ）が解消する ことがよくあります。</li>
        <li>Appがクラッシュしたり、予期しない動作をしたりする場合は、発生した状況の説明に加えて、デバイス モデルとiOSバージョンをメールでお知らせください。確認のうえ調査いたします。</li>
      </ul>

      <h2>機能要望とフィードバック</h2>

      <p>

      </p>
