      <h2>2. 本アプリの内容</h2>

      <p>
        BikePilotは、デバイスのGPS、気圧計、および任意で接続するBluetooth Low Energy（BLE）センサー （心拍数、速度・ケイデンス、温度）を使用して、速度、距離、高度、勾配、地図上のルートなどの走行データを 表示および記録するサイクルコンピューターAppです。一部の機能は、以下に記載する任意の自動更新 サブスクリプション（「BikePilot PRO」）でのみ利用できます。
      </p>

      <h2>3. 安全機器・医療機器ではありません</h2>

      <p>
        BikePilotは、情報提供およびレクリエーション目的に限って提供されます。これは<strong>医療機器ではなく</strong>、 病気や健康状態の診断、治療、治癒、予防を目的とするものでも、専門的な医療判断、ナビゲーション判断、 または安全判断に代わるものでも<strong>ありません</strong>。GPS、気圧計、およびBluetoothセンサー（心拍数を含みます） の測定値は、ハードウェア上の制約、周囲の環境、天候、または接続上の問題により、不正確であったり、 遅延したり、利用できなかったりする場合があります。
      </p>
