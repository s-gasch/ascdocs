    <template id="doc-content" data-doc-title="Personvernerklæring">
      <p><em>Sist oppdatert: 2026-08-11</em></p>

      <p>
        Denne personvernerklæringen beskriver hvordan BikePilot ("appen", "vi", "oss") håndterer opplysninger når du bruker appen. BikePilot er utviklet og publisert av Sebastian Gasch ("Utvikleren").
      </p>

      <h2>Sammendrag</h2>

      <p>
        BikePilot er utviklet for å fungere fullt og helt på enheten din. Vi driver ingen backend-server, vi samler ikke inn analyser, og vi selger eller deler ikke personopplysningene dine med tredjeparter. Appen sporer deg ikke på tvers av apper eller nettsteder som eies av andre selskaper.
      </p>

      <h2>Opplysninger appen får tilgang til</h2>

      <p>
        For å levere kjernefunksjonaliteten som sykkelcomputer ber BikePilot om tilgang til følgende enhetsfunksjoner. Tilgang blir bare bedt om når det er nødvendig, og bare med ditt samtykke via de standardiserte tillatelsesforespørslene i iOS.
      </p>

      <table>
        <thead>
          <tr>
            <th>Data / tillatelse</th>
            <th>Formål</th>
            <th>Hvor de lagres</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>Posisjon (GPS)</strong> ("When In Use")</td>
            <td>Måle fart, distanse, høyde og stigning, samt registrere ruten din på kartet under en tur.</td>
            <td>Kun på enheten din, som en del av den lokale turhistorikken.</td>
          </tr>
          <tr>
            <td><strong>Bevegelse og aktivitet (barometer)</strong></td>
            <td>Beregne høydeendringer og stigningsgrad mens du sykler.</td>
            <td>Kun på enheten din; lagres ikke som rå sensordata utover den pågående økten.</td>
          </tr>
          <tr>
            <td><strong>Bluetooth</strong></td>
            <td>Koble til dine egne Bluetooth Low Energy (BLE)-sensorer — pulsmåler, hastighets- og kadenssensor, temperatursensor — for å vise sanntidsdata fra turen.</td>
            <td>Sensoravlesninger behandles på enheten din i sanntid og lagres lokalt som en del av turdataene dine; BikePilot overfører ikke sensordata noe sted.</td>
          </tr>
          <tr>
            <td><strong>Filer (tilgang til Documents/Downloads-mappen)</strong></td>
            <td>La deg importere <code>.gpx</code>-spor du uttrykkelig velger, og eksportere registrerte turer som <code>.gpx</code>-filer (for eksempel for deling eller sikkerhetskopiering).</td>
            <td>Filer du velger å importere, leses på enheten din; eksporterte filer skrives til plasseringen du velger (for eksempel Filer-appen, AirDrop, Mail) ved hjelp av det standard delingsarket i iOS.</td>
          </tr>
        </tbody>
      </table>

      <h2>Data vi ikke samler inn</h2>

      <ul>
        <li>Vi bruker ingen SDK-er for analyse, annonsering eller krasjrapportering.</li>
        <li>Vi driver ikke egne servere, og appen sender ikke turene dine, posisjonshistorikken din, sensoravlesninger eller andre personopplysninger til oss eller til noen tredjepart.</li>
        <li>Vi bruker ikke sporingsteknologier (slik dette er definert i Apples App Tracking Transparency-rammeverk) og ber ikke om tillatelse til sporing.</li>
        <li>Vi samler ikke inn eller lagrer kontoinformasjon, fordi BikePilot ikke krever at du oppretter konto eller logger inn.</li>
      </ul>

      <h2>Lagring og oppbevaring av data</h2>

      <p>
        Alle turdata (GPS-spor, målinger av fart/kadens/puls/temperatur, innstillinger og registrerte turer) lagres lokalt på enheten din ved hjelp av Apples standardmekanismer for lokal lagring på enheten (<code>UserDefaults</code> og lokal applagring). Disse dataene synkroniseres ikke til iCloud eller andre skytjenester av appen selv, med mindre enhetens egen iCloud-enhetskopi inkluderer appens lokale data som en del av en sikkerhetskopi på systemnivå, noe som styres av iOS-innstillingene dine og ikke av BikePilot.
      </p>

      <p>
        Du kan når som helst slette alle turdata som er lagret lokalt, enten ved å slette registrerte turer i appen eller ved å slette appen fra enheten din. Da fjernes alle lokale data i tråd med standard oppførsel i iOS når en app slettes.
      </p>

      <h2>GPX-import/-eksport</h2>

      <p>
        BikePilot lar deg importere <code>.gpx</code>-filer du velger, og eksportere registrerte turer som <code>.gpx</code>-filer ved hjelp av delingsarket i iOS. Hva du gjør med en eksportert fil (for eksempel deler den med en tredjepartstjeneste) er ditt valg og reguleres av personvernpraksisen til den aktuelle tredjeparten, ikke av denne erklæringen.
      </p>

      <h2>Abonnementer (BikePilot PRO)</h2>

      <p>
        BikePilot tilbyr et valgfritt abonnement med automatisk fornyelse ("BikePilot PRO") som låser opp ytterligere funksjoner. Kjøp, fornyelser og gjenoppretting av abonnement håndteres utelukkende av Apples StoreKit og din Apple ID / App Store-konto. Vi mottar eller lagrer ikke betalingsinformasjonen din — kjøps- og faktureringsdata behandles og oppbevares av Apple i samsvar med <a href="https://www.apple.com/legal/privacy/">Apples personvernerklæring</a>.
      </p>

      <h2>Personvern for barn</h2>

      <p>
        BikePilot er ikke rettet mot barn og samler ikke bevisst inn personopplysninger om barn. Siden appen i utgangspunktet ikke samler inn eller overfører personopplysninger til oss, oppbevares det ingen data om noen bruker, inkludert barn, hos Utvikleren.
      </p>

      <h2>Dine rettigheter</h2>

      <p>
        Fordi alle personopplysninger som skapes ved bruk av BikePilot (posisjonshistorikk, turdata, sensoravlesninger) forblir på enheten din og aldri overføres til oss, har du til enhver tid full kontroll over dem: Du kan se, eksportere eller slette dem direkte i appen eller ved å fjerne appen. Siden vi ikke oppbevarer noen av personopplysningene dine i våre systemer, finnes det ingen egen prosess for å sende oss forespørsler om innsyn, retting eller sletting av slike data.
      </p>

      <p>
        Hvis du har spørsmål om denne erklæringen eller om hvordan appen håndterer enhetstillatelser, kan du kontakte oss via opplysningene nedenfor.
      </p>

      <h2>Endringer i denne erklæringen</h2>

      <p>
        Vi kan oppdatere denne personvernerklæringen fra tid til annen, for eksempel for å gjenspeile nye funksjoner i appen. Datoen for "Sist oppdatert" øverst i dette dokumentet viser når den sist ble revidert. Fortsatt bruk av appen etter en endring innebærer at du aksepterer den oppdaterte erklæringen.
      </p>
