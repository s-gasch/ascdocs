      <p><em>Sist oppdatert: 2026-08-11</em></p>

      <p>

      <h2>1. Lisens</h2>

      <p>
        Forutsatt at du overholder disse Vilkårene, gir Utvikleren deg en begrenset, ikke-eksklusiv, ikke-overførbar og tilbakekallelig lisens til å bruke appen på Apple-merkede enheter som du eier eller kontrollerer, utelukkende til personlig og ikke-kommersiell bruk, i samsvar med bruksreglene i App Store og Apples standard EULA som det er vist til ovenfor.
      </p>

      <h2>2. Beskrivelse av appen</h2>

      <p>
        BikePilot er en sykkelcomputer-app som bruker enhetens GPS, barometer og valgfrie Bluetooth Low Energy (BLE)-sensorer (puls, hastighet og kadens, temperatur) til å vise og registrere turdata som fart, distanse, høyde, stigningsgrad og rute på et kart. Enkelte funksjoner er bare tilgjengelige med et valgfritt abonnement med automatisk fornyelse ("BikePilot PRO"), som beskrevet nedenfor.
      </p>

      <h2>3. Ikke en sikkerhets- eller medisinsk enhet</h2>

      <p>
        BikePilot tilbys kun til informasjons- og fritidsformål. Den er <strong>ikke</strong> medisinsk utstyr og er <strong>ikke</strong> ment å diagnostisere, behandle, kurere eller forebygge sykdom eller helsetilstander, og heller ikke å erstatte profesjonelle medisinske, navigasjonsmessige eller sikkerhetsmessige vurderinger. GPS-, barometer- og Bluetooth-sensoravlesninger (inkludert puls) kan være unøyaktige, forsinkede eller utilgjengelige på grunn av maskinvarebegrensninger, miljøforhold, vær eller tilkoblingsproblemer.
      </p>

      <p>
        <strong>Du er selv eneansvarlig for sikkerheten din når du sykler.</strong> Hold alltid hovedoppmerksomheten på veien, trafikken og omgivelsene dine. Ikke bruk appen som eneste kilde til navigasjon eller fysiologisk overvåking, og rådfør deg med kvalifisert helsepersonell før du gjennomfører anstrengende fysisk aktivitet, særlig hvis du har en eksisterende helsetilstand.
      </p>

      <h2>4. Ditt innhold og dine data</h2>

      <p>
        Turregistreringer, GPS-spor og sensordata som du oppretter ved hjelp av appen, lagres lokalt på enheten din, slik det er beskrevet i vår <a href="privacy-policy.html">Personvernerklæring</a>. Du er selv ansvarlig for å opprettholde egne sikkerhetskopier (for eksempel ved å eksportere turer som <code>.gpx</code>-filer) — Utvikleren er ikke ansvarlig for tap av turdata som skyldes tap eller skade på enheten, sletting av appen eller endringer i operativsystemet.
      </p>

      <p>
        Hvis du importerer <code>.gpx</code>-filer til appen, erklærer du at du har rett til å bruke disse dataene, og at dette ikke krenker rettighetene til noen tredjepart.
      </p>

      <h2>5. Abonnementer (BikePilot PRO)</h2>

      <ul>
        <li>BikePilot tilbyr et valgfritt abonnement med automatisk fornyelse som låser opp flere funksjoner ("BikePilot PRO"), tilgjengelig som måneds- eller årsabonnement.</li>
        <li>Betaling belastes Apple ID-kontoen din når kjøpet bekreftes.</li>
        <li>Abonnementer fornyes automatisk for samme varighet og til den til enhver tid gjeldende prisen, med mindre automatisk fornyelse slås av minst 24 timer før slutten av gjeldende periode.</li>
        <li>Apple ID-kontoen din vil bli belastet for fornyelse innen 24 timer før gjeldende periode utløper.</li>
        <li>Du kan administrere abonnementet og slå av automatisk fornyelse når som helst i innstillingene for Apple ID-kontoen din, i samsvar med Apples regler; Utvikleren har ikke tilgang til å si opp eller endre abonnementet ditt direkte.</li>
        <li>Eventuell ubrukt del av en gratis prøveperiode, dersom en slik tilbys, går tapt når du kjøper et abonnement, der dette er relevant.</li>
        <li>Alle betalinger, refusjoner og faktureringstvister håndteres av Apple i samsvar med <a href="https://www.apple.com/legal/internet-services/itunes/">Apple Media Services Terms and Conditions</a>. Utvikleren behandler ikke betalinger direkte og kan ikke utstede refusjoner.</li>
      </ul>

        <li>forstyrre eller avbryte driften av appen eller forsøke å få uautorisert tilgang til systemer som er knyttet til appen.</li>
