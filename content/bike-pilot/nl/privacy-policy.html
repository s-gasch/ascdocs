    <template id="doc-content" data-doc-title="Privacybeleid">
      <p><em>Laatst bijgewerkt: 2026-08-11</em></p>

      <p>
        In dit Privacybeleid wordt beschreven hoe BikePilot ("de App", "wij", "ons") met informatie omgaat wanneer u de app gebruikt. BikePilot is ontwikkeld en gepubliceerd door Sebastian Gasch ("de Ontwikkelaar").
      </p>

      <h2>Samenvatting</h2>

      <p>
        BikePilot is ontworpen om volledig op uw apparaat te werken. Wij beheren geen backendserver, wij verzamelen geen analytics en wij verkopen of delen uw persoonsgegevens niet met derden. De App volgt u niet over apps of websites van andere bedrijven heen.
      </p>

      <h2>Informatie waartoe de App toegang heeft</h2>

      <p>
        Om de kernfunctionaliteit als fietscomputer te kunnen bieden, vraagt BikePilot toegang tot de volgende mogelijkheden van uw apparaat. Toegang wordt alleen gevraagd wanneer dat nodig is en uitsluitend met uw toestemming, via de standaard iOS-machtigingsvensters.
      </p>

      <table>
        <thead>
          <tr>
            <th>Gegevens / toestemming</th>
            <th>Doel</th>
            <th>Waar deze worden opgeslagen</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>Location (GPS)</strong> ("When In Use")</td>
            <td>Snelheid, afstand, hoogte en hellingspercentage meten, en tijdens een rit uw route op de kaart vastleggen.</td>
            <td>Uitsluitend op uw apparaat, als onderdeel van uw lokale ritgeschiedenis.</td>
          </tr>
          <tr>
            <td><strong>Motion &amp; Fitness (barometer)</strong></td>
            <td>Hoogteverschillen en hellingspercentage schatten terwijl u fietst.</td>
            <td>Uitsluitend op uw apparaat; ruwe sensorgegevens worden niet buiten de huidige sessie opgeslagen.</td>
          </tr>
          <tr>
            <td><strong>Bluetooth</strong></td>
            <td>Verbinding maken met uw eigen Bluetooth Low Energy (BLE)-sensoren — hartslagmeter, snelheids- en cadanssensor, temperatuursensor — om live ritgegevens weer te geven.</td>
            <td>Sensormetingen worden in realtime op uw apparaat verwerkt en lokaal opgeslagen als onderdeel van uw ritgegevens; BikePilot verzendt sensorgegevens nergens naartoe.</td>
          </tr>
          <tr>
            <td><strong>Files (Documents/Downloads folder access)</strong></td>
            <td>U de mogelijkheid geven om door u expliciet gekozen <code>.gpx</code>-trackbestanden te importeren en uw opgenomen ritten als <code>.gpx</code>-bestanden te exporteren (bijvoorbeeld om ze te delen of een back-up te maken).</td>
            <td>Bestanden die u voor import kiest, worden op uw apparaat gelezen; geëxporteerde bestanden worden opgeslagen op de locatie die u selecteert (bijv. Bestanden-app, AirDrop, Mail) via het standaard iOS-deelblad.</td>
          </tr>
        </tbody>
      </table>

      <h2>Gegevens die wij niet verzamelen</h2>

      <ul>
        <li>Wij gebruiken geen analytics-, advertentie- of crash-reporting-SDK's.</li>
        <li>Wij beheren geen eigen servers en de App verstuurt uw ritten, locatiegeschiedenis, sensormetingen of andere persoonsgegevens niet naar ons of naar derden.</li>
        <li>Wij gebruiken geen trackingtechnologieën (zoals gedefinieerd in Apple's App Tracking Transparency-framework) en vragen geen trackingtoestemming.</li>
        <li>Wij verzamelen of bewaren geen accountgegevens, omdat BikePilot geen accountaanmaak of aanmelding vereist.</li>
      </ul>

      <h2>Opslag en bewaartermijn van gegevens</h2>

      <p>
        Alle ritgegevens (GPS-tracks, snelheids-/cadans-/hartslag-/temperatuurmetingen, instellingen en opgenomen ritten) worden lokaal op uw apparaat opgeslagen met behulp van Apple's standaard opslagmechanismen op het apparaat (<code>UserDefaults</code> en lokale app-opslag). Deze gegevens worden door de App zelf niet gesynchroniseerd met iCloud of een andere cloudservice, tenzij de eigen iCloud-apparaatback-up van uw apparaat de lokale gegevens van de App meeneemt als onderdeel van een systeembrede back-up; dat wordt beheerd via uw iOS-instellingen, niet door BikePilot.
      </p>

      <p>
        U kunt alle lokaal opgeslagen ritgegevens op elk moment verwijderen door opgenomen ritten binnen de App te wissen, of door de App van uw apparaat te verwijderen; daarbij worden alle lokale gegevens verwijderd overeenkomstig het standaardgedrag van iOS bij het verwijderen van apps.
      </p>

      <h2>GPX-import/export</h2>

      <p>
        BikePilot biedt u de mogelijkheid om door u geselecteerde <code>.gpx</code>-bestanden te importeren en uw opgenomen ritten als <code>.gpx</code>-bestanden te exporteren via het iOS-deelblad. Wat u met een geëxporteerd bestand doet (bijv. delen met een dienst van een derde partij) is uw eigen keuze en valt onder het privacybeleid van die derde partij, niet onder dit Beleid.
      </p>

      <h2>Abonnementen (BikePilot PRO)</h2>

      <p>
        BikePilot biedt een optioneel automatisch verlengbaar abonnement ("BikePilot PRO") waarmee extra functionaliteiten worden ontgrendeld. Aankopen, verlengingen en herstelacties van abonnementen worden volledig afgehandeld door Apple's StoreKit en uw Apple ID / App Store-account. Wij ontvangen of bewaren uw betaalgegevens niet — aankoop- en factureringsgegevens worden door Apple verwerkt en bewaard in overeenstemming met <a href="https://www.apple.com/legal/privacy/">Apple's Privacy Policy</a>.
      </p>

      <h2>Privacy van kinderen</h2>

      <p>
        BikePilot is niet gericht op kinderen en verzamelt niet bewust persoonsgegevens van kinderen. Omdat de App in de eerste plaats geen persoonsgegevens aan ons verzamelt of doorgeeft, bewaart de Ontwikkelaar geen gegevens van gebruikers, inclusief kinderen.
      </p>

      <h2>Uw rechten</h2>

      <p>
        Omdat alle persoonsgegevens die ontstaan door het gebruik van BikePilot (locatiegeschiedenis, ritgegevens, sensormetingen) op uw apparaat blijven en nooit aan ons worden doorgegeven, behoudt u te allen tijde de volledige controle daarover: u kunt deze rechtstreeks in de App bekijken, exporteren of verwijderen, of door de App te verwijderen. Omdat wij geen van uw persoonsgegevens op onze systemen bewaren, bestaat er voor die gegevens geen afzonderlijke procedure om bij ons een verzoek tot inzage, correctie of verwijdering in te dienen.
      </p>

      <p>
        Als u vragen heeft over dit Beleid of over de manier waarop de App met apparaatmachtigingen omgaat, kunt u contact met ons opnemen via onderstaande gegevens.
      </p>

      <h2>Wijzigingen in dit Beleid</h2>

      <p>
        Wij kunnen dit Privacybeleid van tijd tot tijd bijwerken, bijvoorbeeld om nieuwe functionaliteiten van de App weer te geven. De datum "Laatst bijgewerkt" bovenaan dit document geeft aan wanneer dit beleid voor het laatst is herzien. Als u de App blijft gebruiken nadat een wijziging is doorgevoerd, geldt dat als aanvaarding van het bijgewerkte Beleid.
      </p>
