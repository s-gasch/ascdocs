      <p><em>Laatst bijgewerkt: 2026-08-11</em></p>

      <p>
        Heeft u hulp nodig met BikePilot? Op deze pagina vindt u veelgestelde vragen, stappen voor het oplossen van problemen en informatie over hoe u contact met ons kunt opnemen voor verdere ondersteuning.
      </p>

      <h2>Contact</h2>

      <p>
        Staat uw vraag hieronder niet vermeld? Mail ons gerust; we reageren zo snel mogelijk:
      </p>

      <p>
        <strong>E-mail:</strong> <a href="mailto:sebastian.gasch@outlook.com">sebastian.gasch@outlook.com</a>
      </p>

      <p>
        Vermeld bij het melden van een probleem bij voorkeur het volgende, zodat we u sneller kunnen helpen:
      </p>

      <ul>
        <li>App-versie (Instellingen → Over in de app)</li>
        <li>Uw iOS-versie en apparaatmodel</li>
        <li>Stappen om het probleem te reproduceren</li>
        <li>Screenshots of schermopnamen, indien van toepassing</li>
      </ul>

      <h2>Veelgestelde vragen</h2>

      <h3>GPS en locatietracking</h3>

      <p><strong>Mijn snelheid/afstand/route lijkt onnauwkeurig.</strong></p>

      <p>
        De nauwkeurigheid van GPS hangt af van uw apparaat, het weer en uw omgeving (hoge gebouwen, tunnels, dichte boomkruinen enz. kunnen het signaal verzwakken). Controleer of locatietoegang in iOS is ingesteld op "Bij gebruik van app" of "Altijd" via Instellingen → Privacy en beveiliging → Locatievoorzieningen → BikePilot, en of Locatievoorzieningen op systeemniveau zijn ingeschakeld.
      </p>

      <p><strong>De App stopte met het registreren van mijn rit toen ik mijn telefoon vergrendelde / van app wisselde.</strong></p>

      <p>
        BikePilot gebruikt locatie-updates op de achtergrond om te blijven registreren wanneer uw apparaat vergrendeld is of wanneer u een andere app gebruikt. Controleer of locatietoestemming is verleend en of de energiebesparingsmodus achtergrondactiviteit niet te sterk beperkt; dat kan op sommige apparaten invloed hebben op de frequentie van GPS-updates.
      </p>

      <h3>Bluetooth-sensoren</h3>

      <p><strong>Mijn hartslag- / snelheids- en cadans- / temperatuursensor maakt geen verbinding.</strong></p>

      <ol>
        <li>Controleer of de sensor is ingeschakeld en zich binnen bereik bevindt (meestal 1–2 meter tijdens het koppelen).</li>
        <li>Controleer of Bluetooth is ingeschakeld in iOS en of BikePilot Bluetooth-toegang heeft (Instellingen → Privacy en beveiliging → Bluetooth → BikePilot).</li>
        <li>Sommige sensoren kunnen maar met één app tegelijk verbonden zijn — koppel de sensor los van elke andere app (bijv. een andere fiets- of fitnessapp) voordat u deze in BikePilot verbindt.</li>
        <li>Probeer de sensor opnieuw op te starten (verwijder de batterij en plaats deze opnieuw, indien van toepassing) en voer vanuit de sensorinstellingen van de App opnieuw een scan uit.</li>
      </ol>

      <p><strong>Mijn sensor verbreekt tijdens het fietsen steeds de verbinding.</strong></p>

      <p>
        Dit wordt meestal veroorzaakt door een bijna lege sensorbatterij, te grote afstand tot het apparaat of Bluetooth-storing. Het vervangen van de sensorbatterij en het binnen bereik houden van uw telefoon lost dit meestal op.
      </p>

      <h3>Hoogte en hellingspercentage</h3>

      <p><strong>Hoogte-/hellingspercentagemetingen lijken niet te kloppen.</strong></p>

      <p>
        BikePilot gebruikt de barometer van uw apparaat samen met GPS om hoogte en hellingspercentage te schatten. Barometrische metingen kunnen in de loop van de tijd enigszins afwijken of worden beïnvloed door snelle weersveranderingen; dit is een hardwarebeperking en geen storing van de App.
      </p>

      <h3>GPX-import/export</h3>

      <p><strong>Hoe exporteer ik een rit?</strong></p>

      <p>
        Open de rit in uw ritgeschiedenis en gebruik de deel-/exportoptie om deze op te slaan als een <code>.gpx</code>-bestand. Daarna kunt u het bestand bewaren in de Bestanden-app, via AirDrop naar een ander apparaat sturen of delen via e-mail of een andere app.
      </p>

      <p><strong>Hoe importeer ik een GPX-track (bijv. voor navigatie)?</strong></p>

      <p>
        Gebruik de importoptie in de App en kies een <code>.gpx</code>-bestand uit de Bestanden-app (toegang tot de map Documenten/Downloads is vereist — u krijgt de eerste keer een melding).
      </p>

      <h3>BikePilot PRO-abonnement</h3>

      <p><strong>Hoe neem ik een BikePilot PRO-abonnement / hoe zeg ik het op?</strong></p>

      <p>
        Abonnementen worden volledig beheerd via uw Apple ID. Om u te abonneren gebruikt u de upgradeprompt in de App. Om uw abonnement te bekijken, te wijzigen of op te zeggen gaat u naar Instellingen → [uw naam] → Abonnementen, of naar de App Store-app → uw profielpictogram → Abonnementen.
      </p>

      <p><strong>Ik heb een abonnement genomen, maar PRO-functies zijn niet ontgrendeld.</strong></p>

      <p>
        Probeer de optie "Aankopen herstellen" te gebruiken in het instellingen-/upgradescherm van de App. Als het probleem blijft bestaan nadat u de App opnieuw hebt gestart, neem dan contact met ons op met het e-mailadres van uw Apple ID (deel <strong>niet</strong> uw Apple ID-wachtwoord) en de geschatte aankoopdatum, zodat we kunnen helpen dit te onderzoeken.
      </p>

      <p><strong>Er is geld afgeschreven, maar ik wilde niet verlengen / ik wil een terugbetaling.</strong></p>

      <p>
        Terugbetalingen en facturering worden rechtstreeks door Apple afgehandeld, niet door de Ontwikkelaar. U kunt een terugbetaling aanvragen via <a href="https://reportaproblem.apple.com">reportaproblem.apple.com</a> of via Instellingen → [uw naam] → Abonnementen op uw apparaat.
      </p>

      <h3>Privacy</h3>

      <p>
        BikePilot bewaart al uw ritgegevens lokaal op uw apparaat en beheert geen backendserver. Zie ons <a href="privacy-policy.html">Privacybeleid</a> voor volledige informatie over welke gegevens de App gebruikt en hoe daarmee wordt omgegaan.
      </p>

      <h3>Algemene probleemoplossing</h3>

      <ul>
        <li>Controleer of u de nieuwste versie van BikePilot uit de App Store gebruikt.</li>
        <li>Het opnieuw starten van de App of van uw apparaat verhelpt veel tijdelijke problemen (bijv. problemen met sensorverbindingen of vertragingen bij GPS-fix).</li>
        <li>Als de App crasht of zich onverwacht gedraagt, mail ons dan een beschrijving van wat er is gebeurd, samen met uw apparaatmodel en iOS-versie, zodat we dit kunnen onderzoeken.</li>
      </ul>

      <h2>Functieverzoeken en feedback</h2>

      <p>
        We horen graag uw ideeën voor nieuwe functies of verbeteringen. Stuur uw suggesties naar <a href="mailto:sebastian.gasch@outlook.com">sebastian.gasch@outlook.com</a> — we lezen elk bericht.
      </p>
