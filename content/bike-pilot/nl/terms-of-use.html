      <h2>2. Beschrijving van de App</h2>

      <p>
        BikePilot is een fietscomputer-app die gebruikmaakt van de GPS, barometer en optionele Bluetooth Low Energy (BLE)-sensoren (hartslag, snelheid en cadans, temperatuur) van uw apparaat om ritgegevens zoals snelheid, afstand, hoogte, hellingspercentage en route op een kaart weer te geven en op te slaan. Sommige functies zijn alleen beschikbaar via een optioneel automatisch verlengbaar abonnement ("BikePilot PRO"), zoals hieronder beschreven.
      </p>

      <h2>3. Geen veiligheids- of medisch hulpmiddel</h2>

      <p>
        BikePilot wordt uitsluitend aangeboden voor informatieve en recreatieve doeleinden. Het is <strong>geen</strong> medisch hulpmiddel en is <strong>niet</strong> bedoeld om ziekten of gezondheidsaandoeningen te diagnosticeren, behandelen, genezen of voorkomen, noch om professioneel medisch, navigatie- of veiligheidsadvies te vervangen. GPS-, barometrische en Bluetooth-sensormetingen (inclusief hartslag) kunnen onnauwkeurig, vertraagd of niet beschikbaar zijn als gevolg van hardwarebeperkingen, omgevingsomstandigheden, weersomstandigheden of verbindingsproblemen.
      </p>

      <p>
        <strong>U bent zelf als enige verantwoordelijk voor uw eigen veiligheid tijdens het fietsen.</strong> Houd uw primaire aandacht altijd bij de weg, het verkeer en uw omgeving. Vertrouw niet uitsluitend op de App als bron voor navigatie of fysiologische monitoring en raadpleeg een bevoegde arts voordat u zware lichamelijke inspanning verricht, zeker als u al een bestaande gezondheidsaandoening heeft.
      </p>

        Ritregistraties, GPS-tracks en sensorgegevens die u met de App maakt, worden lokaal op uw apparaat opgeslagen, zoals beschreven in ons <a href="privacy-policy.html">Privacybeleid</a>. U bent zelf verantwoordelijk voor het maken van back-ups (bijvoorbeeld door ritten als <code>.gpx</code>-bestanden te exporteren) — de Ontwikkelaar is niet verantwoordelijk voor verlies van ritgegevens als gevolg van verlies of beschadiging van het apparaat, verwijdering van de App of wijzigingen in het besturingssysteem.
      </p>

      </p>

        <li>Betaling wordt in rekening gebracht op uw Apple ID-account zodra de aankoop is bevestigd.</li>
        <li>Abonnementen worden automatisch verlengd voor dezelfde duur en tegen de op dat moment geldende prijs, tenzij automatische verlenging ten minste 24 uur vóór het einde van de lopende periode is uitgeschakeld.</li>
        <li>Uw Apple ID-account wordt binnen 24 uur vóór het einde van de lopende periode belast voor de verlenging.</li>
        <li>U kunt uw abonnement op elk moment beheren en automatische verlenging uitschakelen in de instellingen van uw Apple ID-account, in overeenstemming met de regels van Apple; de Ontwikkelaar heeft geen toegang om uw abonnement rechtstreeks op te zeggen of te wijzigen.</li>
