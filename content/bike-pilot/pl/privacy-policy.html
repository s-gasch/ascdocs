    <template id="doc-content" data-doc-title="Polityka prywatności">
      <p><em>Ostatnia aktualizacja: 2026-08-11</em></p>

      <p>
        Niniejsza Polityka prywatności opisuje, w jaki sposób BikePilot („Aplikacja”, „my”, „nas”) przetwarza informacje podczas korzystania z Aplikacji. Za tworzenie i publikację BikePilot odpowiada Sebastian Gasch („Deweloper”).
      </p>

      <h2>Podsumowanie</h2>

      <p>
        BikePilot został zaprojektowany tak, aby działać w całości na urządzeniu użytkownika. Nie utrzymujemy serwera backendowego, nie zbieramy danych analitycznych i nie sprzedajemy ani nie udostępniamy danych osobowych podmiotom trzecim. Aplikacja nie śledzi użytkownika między aplikacjami ani witrynami należącymi do innych firm.
      </p>

      <h2>Dane i uprawnienia, do których Aplikacja uzyskuje dostęp</h2>

      <p>
        Aby zapewnić podstawową funkcjonalność komputera rowerowego, BikePilot prosi o dostęp do następujących funkcji urządzenia. Dostęp jest wymagany wyłącznie wtedy, gdy jest potrzebny, i wyłącznie za zgodą użytkownika udzieloną za pomocą standardowych komunikatów uprawnień w iOS.
      </p>

      <table>
        <thead>
          <tr>
            <th>Dane / Uprawnienie</th>
            <th>Cel</th>
            <th>Miejsce przechowywania</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>Lokalizacja (GPS)</strong> („Podczas używania aplikacji”)</td>
            <td>Pomiar prędkości, dystansu, wysokości i nachylenia oraz rejestrowanie trasy na mapie podczas jazdy.</td>
            <td>Wyłącznie na urządzeniu użytkownika, jako część lokalnej historii przejazdów.</td>
          </tr>
          <tr>
            <td><strong>Ruch i kondycja (barometr)</strong></td>
            <td>Szacowanie zmian wysokości i nachylenia podczas jazdy.</td>
            <td>Wyłącznie na urządzeniu użytkownika; surowe dane z czujników nie są przechowywane po zakończeniu bieżącej sesji.</td>
          </tr>
          <tr>
            <td><strong>Bluetooth</strong></td>
            <td>Łączenie z należącymi do użytkownika czujnikami Bluetooth Low Energy (BLE) — monitorem tętna, czujnikiem prędkości i kadencji oraz czujnikiem temperatury — w celu wyświetlania danych z jazdy na żywo.</td>
            <td>Odczyty z czujników są przetwarzane na urządzeniu użytkownika w czasie rzeczywistym i zapisywane lokalnie jako część danych przejazdu; BikePilot nie przesyła danych z czujników nigdzie dalej.</td>
          </tr>
          <tr>
            <td><strong>Pliki (dostęp do folderów Documents/Downloads)</strong></td>
            <td>Umożliwienie importu wyraźnie wybranych plików tras <code>.gpx</code> oraz eksportu zarejestrowanych przejazdów jako plików <code>.gpx</code> (np. w celu udostępnienia lub wykonania kopii zapasowej).</td>
            <td>Wybrane do importu pliki są odczytywane na urządzeniu użytkownika; eksportowane pliki są zapisywane w wybranej lokalizacji (np. aplikacja Pliki, AirDrop, Mail) z użyciem standardowego arkusza udostępniania iOS.</td>
          </tr>
        </tbody>
      </table>

      <h2>Dane, których nie zbieramy</h2>

      <ul>
        <li>Nie używamy żadnych SDK do analityki, reklam ani raportowania awarii.</li>
        <li>Nie utrzymujemy własnych serwerów, a Aplikacja nie wysyła do nas ani do żadnych podmiotów trzecich zapisów przejazdów, historii lokalizacji, odczytów z czujników ani żadnych innych danych osobowych.</li>
        <li>Nie stosujemy technologii śledzących (w rozumieniu frameworka Apple App Tracking Transparency) i nie prosimy o zgodę na śledzenie.</li>
        <li>Nie zbieramy ani nie przechowujemy informacji o koncie, ponieważ BikePilot nie wymaga tworzenia konta ani logowania.</li>
      </ul>

      <h2>Przechowywanie i retencja danych</h2>

      <p>
        Wszystkie dane o przejazdach (trasy GPS, odczyty prędkości/kadencji/tętna/temperatury, ustawienia oraz zapisane przejazdy) są przechowywane lokalnie na urządzeniu użytkownika z wykorzystaniem standardowych mechanizmów pamięci lokalnej Apple (<code>UserDefaults</code> oraz lokalna pamięć Aplikacji). Dane te nie są synchronizowane przez samą Aplikację z iCloud ani z żadną inną usługą chmurową, chyba że kopia zapasowa urządzenia w iCloud obejmuje lokalne dane Aplikacji w ramach kopii systemowej — jest to kontrolowane przez ustawienia iOS użytkownika, a nie przez BikePilot.
      </p>

      <p>
        Wszystkie lokalnie zapisane dane o przejazdach można usunąć w dowolnym momencie, usuwając zapisane przejazdy w Aplikacji albo usuwając Aplikację z urządzenia; spowoduje to usunięcie wszystkich jej danych lokalnych zgodnie ze standardowym działaniem iOS przy usuwaniu aplikacji.
      </p>

      <h2>Import/Eksport GPX</h2>

      <p>
        BikePilot umożliwia import wybranych plików <code>.gpx</code> oraz eksport zapisanych przejazdów jako plików <code>.gpx</code> z użyciem arkusza udostępniania iOS. To, co użytkownik zrobi z wyeksportowanym plikiem (np. udostępni go usłudze podmiotu trzeciego), zależy wyłącznie od niego i podlega zasadom prywatności tego podmiotu trzeciego, a nie niniejszej Polityce.
      </p>

      <h2>Subskrypcje (BikePilot PRO)</h2>

      <p>
        BikePilot oferuje opcjonalną subskrypcję odnawianą automatycznie („BikePilot PRO”), która odblokowuje dodatkowe funkcje. Zakupy subskrypcji, odnowienia i przywracanie zakupów są obsługiwane w całości przez Apple StoreKit oraz konto Apple ID / App Store użytkownika. Nie otrzymujemy ani nie przechowujemy informacji o płatnościach — dane dotyczące zakupów i rozliczeń są przetwarzane i przechowywane przez Apple zgodnie z <a href="https://www.apple.com/legal/privacy/">Apple's Privacy Policy</a>.
      </p>

      <h2>Prywatność dzieci</h2>

      <p>
        BikePilot nie jest kierowany do dzieci i świadomie nie gromadzi danych osobowych dzieci. Ponieważ Aplikacja w ogóle nie zbiera ani nie przekazuje nam danych osobowych, Deweloper nie przechowuje żadnych danych dotyczących jakiegokolwiek użytkownika, w tym dzieci.
      </p>

      <h2>Prawa użytkownika</h2>

      <p>
        Ponieważ wszystkie dane osobowe powstające podczas korzystania z BikePilot (historia lokalizacji, dane o przejazdach, odczyty z czujników) pozostają na urządzeniu użytkownika i nigdy nie są do nas przesyłane, użytkownik zachowuje nad nimi pełną kontrolę przez cały czas: może je przeglądać, eksportować lub usuwać bezpośrednio w Aplikacji albo przez usunięcie Aplikacji. Ponieważ nie przechowujemy żadnych danych osobowych użytkownika w naszych systemach, nie istnieje odrębna procedura składania do nas wniosków o dostęp, sprostowanie lub usunięcie tych danych.
      </p>

      <p>
        W przypadku pytań dotyczących niniejszej Polityki lub sposobu, w jaki Aplikacja korzysta z uprawnień urządzenia, można skontaktować się z nami, korzystając z danych poniżej.
      </p>

      <h2>Zmiany w niniejszej Polityce</h2>

      <p>
        Od czasu do czasu możemy aktualizować niniejszą Politykę prywatności, na przykład w celu uwzględnienia nowych funkcji Aplikacji. Data „Ostatnia aktualizacja” na początku tego dokumentu wskazuje, kiedy Polityka została ostatnio zmieniona. Dalsze korzystanie z Aplikacji po wprowadzeniu zmian oznacza akceptację zaktualizowanej Polityki.
      </p>
