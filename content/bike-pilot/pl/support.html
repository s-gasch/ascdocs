      <p><em>Ostatnia aktualizacja: 2026-08-11</em></p>

      <p>
        Potrzebuje Pan/Pani pomocy z BikePilot? Na tej stronie znajdują się odpowiedzi na najczęstsze pytania, wskazówki dotyczące rozwiązywania problemów oraz informacje, jak skontaktować się z nami w razie potrzeby.
      </p>

      <h2>Kontakt</h2>

      <p>
        Jeśli odpowiedź na pytanie nie znajduje się poniżej, prosimy o wiadomość e-mail — odpowiemy tak szybko, jak to będzie możliwe:
      </p>

      <p>
        <strong>Email:</strong> <a href="mailto:sebastian.gasch@outlook.com">sebastian.gasch@outlook.com</a>
      </p>

      <p>
        Abyśmy mogli pomóc szybciej, w zgłoszeniu problemu warto podać:
      </p>

      <ul>
        <li>Wersję aplikacji (Ustawienia → O aplikacji w Aplikacji)</li>
        <li>Wersję iOS oraz model urządzenia</li>
        <li>Kroki potrzebne do odtworzenia problemu</li>
        <li>Zrzuty ekranu lub nagrania ekranu, jeśli to pomocne</li>
      </ul>

      <h2>Najczęściej zadawane pytania</h2>

      <h3>GPS i śledzenie lokalizacji</h3>

      <p><strong>Wygląda na to, że pomiar prędkości/dystansu/trasy jest niedokładny.</strong></p>

      <p>
        Dokładność GPS zależy od urządzenia, pogody oraz otoczenia (wysokie budynki, tunele, gęste zadrzewienie itp. mogą pogarszać sygnał). Prosimy upewnić się, że dostęp do lokalizacji jest ustawiony na „Podczas używania aplikacji” lub „Zawsze” w Ustawienia → Prywatność i ochrona → Usługi lokalizacji → BikePilot oraz że Usługi lokalizacji są włączone w całym systemie.
      </p>

      <p><strong>Aplikacja przestała śledzić przejazd po zablokowaniu telefonu / przełączeniu do innej aplikacji.</strong></p>

      <p>
        BikePilot korzysta z aktualizacji lokalizacji w tle, aby kontynuować rejestrowanie, gdy urządzenie jest zablokowane albo używana jest inna aplikacja. Prosimy upewnić się, że uprawnienie do lokalizacji zostało przyznane i że Tryb niskiego zużycia energii nie ogranicza zbyt agresywnie działania w tle, ponieważ na niektórych urządzeniach może to wpływać na częstotliwość aktualizacji GPS.
      </p>

      <h3>Czujniki Bluetooth</h3>

      <p><strong>Mój czujnik tętna / prędkości i kadencji / temperatury nie chce się połączyć.</strong></p>

      <ol>
        <li>Prosimy upewnić się, że czujnik jest włączony i znajduje się w zasięgu (zwykle 1–2 metry podczas parowania).</li>
        <li>Prosimy potwierdzić, że Bluetooth jest włączony w ustawieniach iOS oraz że BikePilot ma przyznane uprawnienie do Bluetooth (Ustawienia → Prywatność i ochrona → Bluetooth → BikePilot).</li>
        <li>Niektóre czujniki mogą być połączone tylko z jedną aplikacją jednocześnie — przed połączeniem w BikePilot należy odłączyć czujnik od każdej innej aplikacji (np. innej aplikacji rowerowej lub fitness).</li>
        <li>Prosimy spróbować ponownie uruchomić czujnik (jeśli dotyczy, wyjąć i ponownie włożyć baterię) oraz ponownie wyszukać go w ustawieniach czujników Aplikacji.</li>
      </ol>

      <p><strong>Mój czujnik ciągle rozłącza się w trakcie jazdy.</strong></p>

      <p>
        Najczęściej jest to spowodowane niskim poziomem baterii czujnika, zbyt dużą odległością od urządzenia albo zakłóceniami Bluetooth. Wymiana baterii czujnika i utrzymywanie telefonu w zasięgu zazwyczaj rozwiązują problem.
      </p>

      <h3>Wysokość i nachylenie</h3>

      <p><strong>Odczyty wysokości/nachylenia wyglądają na nieprawidłowe.</strong></p>

      <p>
        BikePilot wykorzystuje barometr urządzenia razem z GPS do szacowania wysokości i nachylenia. Wskazania barometru mogą z czasem nieznacznie dryfować lub reagować na gwałtowne zmiany pogody; to ograniczenie sprzętowe, a nie oznaka nieprawidłowego działania Aplikacji.
      </p>

      <h3>Import/Eksport GPX</h3>

      <p><strong>Jak wyeksportować przejazd?</strong></p>

      <p>
        Prosimy otworzyć przejazd w historii przejazdów i skorzystać z opcji udostępniania/eksportu, aby zapisać go jako plik <code>.gpx</code>, który następnie można zapisać w aplikacji Pliki, wysłać przez AirDrop na inne urządzenie albo udostępnić e-mailem lub w innej aplikacji.
      </p>

      <p><strong>Jak zaimportować trasę GPX (np. do nawigacji)?</strong></p>

      <p>
        Prosimy użyć opcji importu w Aplikacji i wybrać plik <code>.gpx</code> z aplikacji Pliki (wymagany jest dostęp do folderów Documents/Downloads — przy pierwszej próbie pojawi się odpowiedni monit).
      </p>

      <h3>Subskrypcja BikePilot PRO</h3>

      <p><strong>Jak zasubskrybować / anulować BikePilot PRO?</strong></p>

      <p>
        Subskrypcje są zarządzane w całości przez Apple ID użytkownika. Aby zasubskrybować, należy skorzystać z komunikatu przejścia na wersję PRO w Aplikacji. Aby wyświetlić, zmienić lub anulować subskrypcję, prosimy przejść do Ustawienia → [imię i nazwisko] → Subskrypcje albo do aplikacji App Store → ikona profilu → Subskrypcje.
      </p>

      <p><strong>Mam aktywną subskrypcję, ale funkcje PRO nie zostały odblokowane.</strong></p>

      <p>
        Prosimy spróbować użyć opcji „Restore Purchases” w ustawieniach Aplikacji lub na ekranie uaktualnienia. Jeśli problem nadal występuje po ponownym uruchomieniu Aplikacji, prosimy o kontakt z podaniem adresu e-mail Apple ID (prosimy nie podawać hasła do Apple ID) oraz przybliżonej daty zakupu, abyśmy mogli pomóc w wyjaśnieniu sprawy.
      </p>

      <p><strong>Została naliczona opłata, ale odnowienie nie było zamierzone / chcę otrzymać zwrot środków.</strong></p>

      <p>
        Zwroty i rozliczenia są obsługiwane bezpośrednio przez Apple, a nie przez Dewelopera. O zwrot środków można wystąpić na stronie <a href="https://reportaproblem.apple.com">reportaproblem.apple.com</a> lub przez Ustawienia → [imię i nazwisko] → Subskrypcje na urządzeniu.
      </p>

      <h3>Prywatność</h3>

      <p>
        BikePilot przechowuje wszystkie dane o przejazdach lokalnie na urządzeniu użytkownika i nie utrzymuje serwera backendowego. Szczegółowe informacje o tym, do jakich danych Aplikacja uzyskuje dostęp i jak są one wykorzystywane, zawiera nasza <a href="privacy-policy.html">Polityka prywatności</a>.
      </p>

      <h3>Ogólne rozwiązywanie problemów</h3>

      <ul>
        <li>Prosimy upewnić się, że używana jest najnowsza wersja BikePilot dostępna w App Store.</li>
        <li>Ponowne uruchomienie Aplikacji lub urządzenia rozwiązuje wiele przejściowych problemów (np. problemy z połączeniem czujników, opóźnienia w uzyskaniu sygnału GPS).</li>
        <li>Jeśli Aplikacja ulega awarii lub działa nieoczekiwanie, prosimy wysłać nam opis zdarzenia wraz z modelem urządzenia i wersją iOS, abyśmy mogli to sprawdzić.</li>
      </ul>
