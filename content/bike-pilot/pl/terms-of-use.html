      <p><em>Ostatnia aktualizacja: 2026-08-11</em></p>

      <p>

      </p>

      <h2>1. Licencja</h2>

      <p>
        Z zastrzeżeniem przestrzegania niniejszych Warunków przez użytkownika, Deweloper udziela ograniczonej, niewyłącznej, niezbywalnej i odwołalnej licencji na korzystanie z Aplikacji na urządzeniach marki Apple, które użytkownik posiada lub kontroluje, wyłącznie do osobistego, niekomercyjnego użytku, zgodnie z zasadami korzystania App Store oraz standardową EULA Apple wskazaną powyżej.
      </p>

      <h2>2. Opis Aplikacji</h2>

      <p>
        BikePilot to aplikacja typu komputer rowerowy, która wykorzystuje GPS i barometr urządzenia oraz opcjonalne czujniki Bluetooth Low Energy (BLE) (tętno, prędkość i kadencja, temperatura) do wyświetlania i rejestrowania danych z jazdy, takich jak prędkość, dystans, wysokość, nachylenie i trasa na mapie. Niektóre funkcje są dostępne wyłącznie w ramach opcjonalnej, automatycznie odnawianej subskrypcji („BikePilot PRO”), zgodnie z opisem poniżej.
      </p>

      <h2>3. Nie jest to urządzenie bezpieczeństwa ani wyrób medyczny</h2>

      <p>
        BikePilot jest udostępniany wyłącznie do celów informacyjnych i rekreacyjnych. <strong>Nie</strong> jest wyrobem medycznym i <strong>nie</strong> służy do diagnozowania, leczenia ani zapobiegania jakiejkolwiek chorobie lub dolegliwości zdrowotnej, ani nie zastępuje profesjonalnej oceny medycznej, nawigacyjnej czy związanej z bezpieczeństwem. Odczyty GPS, barometru i czujników Bluetooth (w tym tętna) mogą być niedokładne, opóźnione lub niedostępne z powodu ograniczeń sprzętowych, warunków środowiskowych, pogody albo problemów z łącznością.
      </p>

      <p><strong>Użytkownik ponosi wyłączną odpowiedzialność za własne bezpieczeństwo podczas jazdy na rowerze.</strong></p>

      <p>
        Należy zawsze koncentrować uwagę przede wszystkim na drodze, ruchu drogowym i otoczeniu. Nie należy polegać na Aplikacji jako jedynym źródle nawigacji ani monitorowania parametrów fizjologicznych; przed podjęciem intensywnej aktywności fizycznej należy skonsultować się z wykwalifikowanym lekarzem, zwłaszcza w przypadku istniejących wcześniej problemów zdrowotnych.
      </p>

      <h2>4. Treści i dane użytkownika</h2>

      <p>
        Zapisy przejazdów, ślady GPS i dane z czujników tworzone przy użyciu Aplikacji są przechowywane lokalnie na urządzeniu użytkownika, zgodnie z opisem w naszej <a href="privacy-policy.html">Polityce prywatności</a>. Użytkownik odpowiada za utrzymywanie własnych kopii zapasowych (na przykład przez eksport przejazdów jako plików <code>.gpx</code>) — Deweloper nie odpowiada za utratę danych o przejazdach wynikającą z utraty urządzenia, uszkodzenia urządzenia, usunięcia Aplikacji lub zmian w systemie operacyjnym.
      </p>

      <p>
        Jeśli użytkownik importuje do Aplikacji pliki <code>.gpx</code>, oświadcza, że ma prawo korzystać z tych danych i że takie korzystanie nie narusza praw osób trzecich.
      </p>

      <h2>5. Subskrypcje (BikePilot PRO)</h2>

      <ul>
        <li>BikePilot oferuje opcjonalną subskrypcję odnawianą automatycznie, która odblokowuje dodatkowe funkcje („BikePilot PRO”), dostępną w planie miesięcznym lub rocznym.</li>
        <li>Opłata jest pobierana z konta Apple ID przy potwierdzeniu zakupu.</li>
        <li>Subskrypcje odnawiają się automatycznie na ten sam okres i po cenie obowiązującej w chwili odnowienia, chyba że automatyczne odnawianie zostanie wyłączone co najmniej 24 godziny przed końcem bieżącego okresu.</li>
        <li>Konto Apple ID użytkownika zostanie obciążone opłatą za odnowienie w ciągu 24 godzin przed zakończeniem bieżącego okresu.</li>
        <li>Subskrypcją można zarządzać i w dowolnym momencie wyłączyć automatyczne odnawianie w ustawieniach konta Apple ID, zgodnie z zasadami Apple; Deweloper nie ma możliwości bezpośredniego anulowania ani modyfikowania subskrypcji.</li>
        <li>Niewykorzystana część okresu próbnego, jeśli jest oferowany, przepada z chwilą zakupu subskrypcji, o ile ma to zastosowanie.</li>
        <li>Wszystkie płatności, zwroty i spory rozliczeniowe są obsługiwane przez Apple zgodnie z <a href="https://www.apple.com/legal/internet-services/itunes/">Apple Media Services Terms and Conditions</a>. Deweloper nie przetwarza płatności bezpośrednio i nie może dokonywać zwrotów.</li>
      </ul>

      <h2>6. Dozwolony sposób korzystania</h2>

      <p>
        Użytkownik zobowiązuje się, że nie będzie:
      </p>

      <ul>
        <li>korzystać z Aplikacji w jakimkolwiek celu niezgodnym z prawem ani w sposób naruszający obowiązujące przepisy prawa lub regulacje;</li>
        <li>podejmować prób odtwarzania kodu źródłowego, dekompilacji ani wyodrębniania kodu źródłowego Aplikacji, z wyjątkiem zakresu, w jakim takie ograniczenie jest zabronione przez obowiązujące przepisy prawa;</li>
        <li>zakłócać działania Aplikacji ani podejmować prób uzyskania nieuprawnionego dostępu do jakichkolwiek systemów związanych z Aplikacją.</li>
      </ul>

      <h2>7. Własność intelektualna</h2>

      <p>
        Aplikacja, w tym jej projekt, kod, grafiki i znaki towarowe, stanowi własność Dewelopera i jest chroniona przez obowiązujące przepisy dotyczące własności intelektualnej. Niniejsze Warunki nie przyznają użytkownikowi żadnych praw do znaków towarowych, logo ani materiałów marki Dewelopera poza zakresem niezbędnym do korzystania z Aplikacji zgodnie z jej przeznaczeniem.
