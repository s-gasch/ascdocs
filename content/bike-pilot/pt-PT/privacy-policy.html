      <p><em>Última atualização: 2026-08-11</em></p>

      <p>
        Esta Política de Privacidade descreve a forma como o BikePilot ("a App", "nós") trata a informação quando utiliza a aplicação. O BikePilot é desenvolvido e publicado por Sebastian Gasch ("o Programador").
      </p>

      <h2>Resumo</h2>

      <p>
        O BikePilot foi concebido para funcionar integralmente no seu dispositivo. Não operamos qualquer servidor backend, não recolhemos dados analíticos e não vendemos nem partilhamos os seus dados pessoais com terceiros. A App não o rastreia entre aplicações ou sites pertencentes a outras empresas.
      </p>

      <h2>Informações a que a App Acede</h2>

      <p>
        Para disponibilizar as suas funcionalidades principais de ciclocomputador, o BikePilot solicita acesso às seguintes capacidades do dispositivo. O acesso é pedido apenas quando necessário e apenas com a sua autorização, concedida através dos avisos de permissão padrão do iOS.
      </p>

      <table>
        <thead>
          <tr>
            <th>Dados / Permissão</th>
            <th>Finalidade</th>
            <th>Onde são armazenados</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>Localização (GPS)</strong> ("When In Use")</td>
            <td>Medir a velocidade, a distância, a altitude e o declive, e registar o seu percurso no mapa durante uma volta.</td>
            <td>Apenas no seu dispositivo, como parte do histórico local das suas voltas.</td>
          </tr>
          <tr>
            <td><strong>Movimento e fitness (barómetro)</strong></td>
            <td>Estimar as variações de altitude e a inclinação durante a volta.</td>
            <td>Apenas no seu dispositivo; não são guardados dados brutos do sensor para além da sessão atual.</td>
          </tr>
          <tr>
            <td><strong>Bluetooth</strong></td>
            <td>Ligar aos seus próprios sensores Bluetooth Low Energy (BLE) — monitor de frequência cardíaca, sensor de velocidade e cadência, sensor de temperatura — para apresentar dados da volta em tempo real.</td>
            <td>As leituras dos sensores são processadas no seu dispositivo em tempo real e armazenadas localmente como parte dos dados da sua volta; o BikePilot não transmite dados dos sensores para lado nenhum.</td>
          </tr>
          <tr>
            <td><strong>Ficheiros (acesso às pastas Documentos/Downloads)</strong></td>
            <td>Permitir a importação de ficheiros de percurso <code>.gpx</code> que escolher explicitamente e a exportação das suas voltas gravadas como ficheiros <code>.gpx</code> (por exemplo, para partilhar ou criar uma cópia de segurança).</td>
            <td>Os ficheiros que optar por importar são lidos no seu dispositivo; os ficheiros exportados são escritos na localização que selecionar (por exemplo, app Ficheiros, AirDrop, Mail) através da folha de partilha padrão do iOS.</td>
          </tr>
        </tbody>
      </table>

      <h2>Dados que Não Recolhemos</h2>

      <ul>
        <li>Não utilizamos quaisquer SDK de analytics, publicidade ou relatório de falhas.</li>
        <li>Não operamos servidores próprios e a App não envia as suas voltas, histórico de localização, leituras dos sensores nem quaisquer outros dados pessoais para nós ou para terceiros.</li>
        <li>Não utilizamos tecnologias de rastreio (tal como definidas pelo framework App Tracking Transparency da Apple) nem pedimos permissão para rastreio.</li>
        <li>Não recolhemos nem armazenamos informações de conta, porque o BikePilot não exige criação de conta nem início de sessão.</li>
      </ul>

      <h2>Armazenamento e Retenção de Dados</h2>

      <p>
        Todos os dados das voltas (percursos GPS, leituras de velocidade/cadência/frequência cardíaca/temperatura, definições e voltas gravadas) são armazenados localmente no seu dispositivo através dos mecanismos de armazenamento local padrão da Apple (<code>UserDefaults</code> e armazenamento local da app). Estes dados não são sincronizados para o iCloud nem para qualquer outro serviço cloud pela própria App, salvo se a cópia de segurança iCloud do seu dispositivo incluir os dados locais da App como parte de uma cópia de segurança ao nível do sistema, algo que é controlado nas Definições do iOS do seu dispositivo e não pelo BikePilot.
      </p>

      <p>
        Pode apagar todos os dados das voltas armazenados localmente a qualquer momento, eliminando as voltas gravadas dentro da App ou removendo a App do seu dispositivo, o que elimina todos os seus dados locais de acordo com o comportamento padrão do iOS para a eliminação de aplicações.
      </p>

      <h2>Importação/Exportação de GPX</h2>

      <p>
        O BikePilot permite-lhe importar ficheiros <code>.gpx</code> por si selecionados e exportar as suas voltas gravadas como ficheiros <code>.gpx</code> através da folha de partilha do iOS. A forma como utilizar um ficheiro exportado (por exemplo, partilhá-lo com um serviço de terceiros) é uma escolha sua e rege-se pelas práticas de privacidade desse terceiro, não pela presente Política.
      </p>

      <h2>Subscrições (BikePilot PRO)</h2>

      <p>
        O BikePilot disponibiliza uma subscrição auto-renovável opcional ("BikePilot PRO") que desbloqueia funcionalidades adicionais. As compras, renovações e reposições de subscrições são tratadas na totalidade pelo StoreKit da Apple e pela sua conta Apple ID / App Store. Não recebemos nem armazenamos as suas informações de pagamento — os dados de compra e faturação são processados e conservados pela Apple de acordo com a <a href="https://www.apple.com/legal/privacy/">Política de Privacidade da Apple</a>.
      </p>

      <h2>Privacidade das Crianças</h2>

      <p>
        O BikePilot não é dirigido a crianças e não recolhe conscientemente dados pessoais de crianças. Uma vez que a App não recolhe nem nos transmite dados pessoais à partida, não é conservado pelo Programador qualquer dado relativo a utilizadores, incluindo crianças.
      </p>

      <h2>Os Seus Direitos</h2>

      <p>
        Uma vez que todos os dados pessoais gerados pela utilização do BikePilot (histórico de localização, dados de voltas, leituras dos sensores) permanecem no seu dispositivo e nunca nos são transmitidos, mantém sempre controlo total sobre os mesmos: pode consultá-los, exportá-los ou apagá-los diretamente na App ou removendo a App. Como não mantemos quaisquer dos seus dados pessoais nos nossos sistemas, não existe um processo separado de pedido de acesso, retificação ou eliminação desses dados a submeter-nos.
      </p>

      <p>
        Se tiver dúvidas sobre esta Política ou sobre a forma como a App trata as permissões do dispositivo, pode contactar-nos através dos dados abaixo.
      </p>

      <h2>Alterações a esta Política</h2>

      <p>
        Poderemos atualizar esta Política de Privacidade periodicamente, por exemplo, para refletir novas funcionalidades da App. A data de "Última atualização" no topo deste documento indica quando foi feita a última revisão. A continuação da utilização da App após uma alteração constitui aceitação da Política atualizada.
      </p>
