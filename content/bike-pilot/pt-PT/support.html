      <p><em>Última atualização: 2026-08-11</em></p>

      <p>
        Precisa de ajuda com o BikePilot? Esta página reúne perguntas frequentes, passos de resolução de problemas e informações sobre como nos contactar para obter apoio adicional.
      </p>

      <h2>Contacto</h2>

      <p>
        Se a sua questão não estiver respondida abaixo, envie-nos um email e responderemos tão depressa quanto possível:
      </p>

      <p>
        <strong>Email:</strong> <a href="mailto:sebastian.gasch@outlook.com">sebastian.gasch@outlook.com</a>
      </p>

      <p>
        Ao reportar um problema, inclua, por favor, o seguinte para que o possamos ajudar mais depressa:
      </p>

      <ul>
        <li>Versão da app (Definições → Sobre na App)</li>
        <li>A sua versão de iOS e o modelo do dispositivo</li>
        <li>Passos para reproduzir o problema</li>
        <li>Capturas de ecrã ou gravações de ecrã, se aplicável</li>
      </ul>

      <h2>Perguntas Frequentes</h2>

      <h3>GPS e localização</h3>

      <p><strong>A velocidade/distância/percurso parece-me impreciso.</strong></p>

      <p>
        A precisão do GPS depende do seu dispositivo, do estado do tempo e do ambiente em redor (edifícios altos, túneis, zonas com vegetação densa, etc. podem degradar o sinal). Certifique-se de que o acesso à localização está definido como "While Using the App" ou "Always" em Definições do iOS → Privacidade e segurança → Serviços de localização → BikePilot e de que os Serviços de localização estão ativados em todo o sistema.
      </p>

      <p><strong>A App deixou de registar a minha volta quando bloqueei o telemóvel / mudei de app.</strong></p>

      <p>
        O BikePilot utiliza atualizações de localização em segundo plano para continuar a registar enquanto o dispositivo está bloqueado ou enquanto utiliza outra app. Confirme que a permissão de Localização foi concedida e que o Modo de baixo consumo não está a limitar de forma agressiva a atividade em segundo plano, algo que pode afetar a frequência das atualizações de GPS em alguns dispositivos.
      </p>

      <h3>Sensores Bluetooth</h3>

      <p><strong>O meu sensor de frequência cardíaca / velocidade e cadência / temperatura não se liga.</strong></p>

      <ol>
        <li>Certifique-se de que o sensor está ligado e dentro do alcance (normalmente 1–2 metros durante o emparelhamento).</li>
        <li>Confirme que o Bluetooth está ativado nas Definições do iOS e que o BikePilot tem permissão de Bluetooth (Definições → Privacidade e segurança → Bluetooth → BikePilot).</li>
        <li>Alguns sensores só podem estar ligados a uma app de cada vez — desligue o sensor de qualquer outra app (por exemplo, outra app de ciclismo ou fitness) antes de o ligar no BikePilot.</li>
        <li>Tente reiniciar o sensor (retire e volte a inserir a pilha, se aplicável) e volte a pesquisar a partir das definições de sensores da App.</li>
      </ol>

      <p><strong>O sensor desliga-se repetidamente a meio da volta.</strong></p>

      <p>
        Isto deve-se, normalmente, a bateria fraca do sensor, distância em relação ao dispositivo ou interferências Bluetooth. Na maioria dos casos, substituir a bateria do sensor e manter o telemóvel dentro do alcance resolve a situação.
      </p>

      <h3>Altitude e declive</h3>

      <p><strong>As leituras de altitude/declive parecem incorretas.</strong></p>

      <p>
        O BikePilot utiliza o barómetro do dispositivo em conjunto com o GPS para estimar a altitude e o declive. As leituras barométricas podem sofrer pequenos desvios ao longo do tempo ou ser afetadas por alterações meteorológicas rápidas; trata-se de uma limitação do hardware e não de um mau funcionamento da App.
      </p>

      <h3>Importação/exportação de GPX</h3>

      <p><strong>Como posso exportar uma volta?</strong></p>

      <p>
        Abra a volta no histórico de voltas e utilize a opção de partilha/exportação para a guardar como um ficheiro <code>.gpx</code>, que depois poderá guardar na app Ficheiros, enviar por AirDrop para outro dispositivo ou partilhar por email ou noutra app.
      </p>

      <p><strong>Como posso importar um percurso GPX (por exemplo, para navegação)?</strong></p>

      <p>
        Utilize a opção de importação na App e escolha um ficheiro <code>.gpx</code> na app Ficheiros (é necessário acesso às pastas Documentos/Downloads — ser-lhe-á pedido na primeira vez).
      </p>

      <h3>Subscrição BikePilot PRO</h3>

      <p><strong>Como posso subscrever / cancelar o BikePilot PRO?</strong></p>

      <p>
        As subscrições são geridas integralmente através do seu Apple ID. Para subscrever, utilize o aviso de atualização dentro da App. Para consultar, alterar ou cancelar a subscrição, vá a Definições do iOS → [o seu nome] → Subscrições, ou à app App Store → ícone do seu perfil → Subscrições.
      </p>

      <p><strong>Subscrevi, mas as funcionalidades PRO não foram desbloqueadas.</strong></p>

      <p>
        Experimente utilizar a opção "Restaurar compras" no ecrã de definições/atualização da App. Se o problema persistir depois de reiniciar a App, contacte-nos com o email do seu Apple ID (não partilhe a palavra-passe do Apple ID) e a data aproximada da compra para que possamos ajudar a investigar.
      </p>

      <p><strong>Foi-me cobrada a renovação sem intenção / pretendo um reembolso.</strong></p>

      <p>
        Os reembolsos e a faturação são tratados diretamente pela Apple, não pelo Programador. Pode pedir um reembolso em <a href="https://reportaproblem.apple.com">reportaproblem.apple.com</a> ou através de Definições → [o seu nome] → Subscrições no seu dispositivo.
      </p>

      <h3>Privacidade</h3>

      <p>
        O BikePilot guarda todos os dados das suas voltas localmente no seu dispositivo e não opera qualquer servidor backend. Consulte a nossa <a href="privacy-policy.html">Política de Privacidade</a> para ver todos os detalhes sobre os dados a que a App acede e a forma como são utilizados.
      </p>

      <h3>Resolução geral de problemas</h3>

      <ul>
        <li>Certifique-se de que está a utilizar a versão mais recente do BikePilot disponível na App Store.</li>
        <li>Reiniciar a App ou o dispositivo resolve muitos problemas transitórios (por exemplo, problemas de ligação a sensores, atrasos na obtenção de sinal GPS).</li>
        <li>Se a App falhar ou tiver um comportamento inesperado, envie-nos por email uma descrição do que aconteceu, juntamente com o modelo do dispositivo e a versão do iOS, para que possamos investigar.</li>
      </ul>

      <h2>Pedidos de Funcionalidades e Feedback</h2>

      <p>
        Gostaríamos muito de conhecer as suas ideias para novas funcionalidades ou melhorias. Envie as suas sugestões para <a href="mailto:sebastian.gasch@outlook.com">sebastian.gasch@outlook.com</a> — lemos todas as mensagens.
      </p>
