      <h2>2. Descrição da App</h2>

      <p>
        O BikePilot é uma app de ciclocomputador que utiliza o GPS e o barómetro do seu dispositivo, bem como sensores opcionais Bluetooth Low Energy (BLE) (frequência cardíaca, velocidade e cadência, temperatura), para apresentar e registar dados da volta, como velocidade, distância, altitude, declive e percurso num mapa. Algumas funcionalidades só estão disponíveis com uma subscrição auto-renovável opcional ("BikePilot PRO"), tal como descrito abaixo.
      </p>

      <h2>3. Não é um Dispositivo de Segurança nem Médico</h2>

        O BikePilot é fornecido apenas para fins informativos e recreativos. <strong>Não</strong> é um dispositivo médico e <strong>não</strong> se destina a diagnosticar, tratar, curar ou prevenir qualquer doença ou problema de saúde, nem a substituir aconselhamento profissional de natureza médica, de navegação ou de segurança. As leituras de GPS, barómetro e sensores Bluetooth (incluindo frequência cardíaca) podem ser imprecisas, sofrer atrasos ou não estar disponíveis devido a limitações de hardware, condições ambientais, meteorologia ou problemas de conectividade.
      </p>

      <p>
        <strong>É o único responsável pela sua própria segurança enquanto pedala.</strong> Mantenha sempre a atenção principal na estrada, no trânsito e no que o rodeia. Não confie na App como única fonte de navegação ou monitorização fisiológica e consulte um médico qualificado antes de realizar atividade física intensa, especialmente se tiver qualquer condição de saúde preexistente.
      </p>
