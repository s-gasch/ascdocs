    <template id="doc-content" data-doc-title="Политика конфиденциальности">
      <p><em>Последнее обновление: 2026-08-11</em></p>

      <p>
        В настоящей Политике конфиденциальности описано, как BikePilot («Приложение», «мы», «нас») обрабатывает информацию при использовании вами приложения. BikePilot разработано и опубликовано Sebastian Gasch («Разработчик»).
      </p>

      <h2>Кратко</h2>

      <p>
        BikePilot разработано так, чтобы полностью работать на вашем устройстве. Мы не используем серверную инфраструктуру, не собираем аналитику и не продаём и не передаём ваши персональные данные третьим лицам. Приложение не отслеживает вас в приложениях или на сайтах, принадлежащих другим компаниям.
      </p>

      <h2>К каким данным и функциям устройства получает доступ Приложение</h2>

      <p>
        Для обеспечения основной функциональности велокомпьютера BikePilot запрашивает доступ к следующим возможностям устройства. Доступ запрашивается только при необходимости и только с вашего разрешения, предоставленного через стандартные системные запросы iOS.
      </p>

      <table>
        <thead>
          <tr>
            <th>Данные / разрешение</th>
            <th>Цель</th>
            <th>Где хранится</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>Location (GPS)</strong> («При использовании приложения»)</td>
            <td>Измерение скорости, расстояния, высоты и уклона, а также запись вашего маршрута на карте во время поездки.</td>
            <td>Только на вашем устройстве, как часть локальной истории поездок.</td>
          </tr>
          <tr>
            <td><strong>Motion &amp; Fitness (barometer)</strong></td>
            <td>Оценка перепадов высоты и уклона во время поездки.</td>
            <td>Только на вашем устройстве; необработанные данные датчиков не сохраняются после завершения текущего сеанса.</td>
          </tr>
          <tr>
            <td><strong>Bluetooth</strong></td>
            <td>Подключение ваших Bluetooth Low Energy (BLE) датчиков — пульсометра, датчика скорости и каденса, датчика температуры — для отображения данных поездки в реальном времени.</td>
            <td>Показания датчиков обрабатываются на вашем устройстве в реальном времени и сохраняются локально как часть данных поездки; BikePilot никуда не передаёт данные датчиков.</td>
          </tr>
          <tr>
            <td><strong>Files (Documents/Downloads folder access)</strong></td>
            <td>Позволяет импортировать <code>.gpx</code>-файлы треков, которые вы явно выбираете, и экспортировать записанные поездки в виде <code>.gpx</code>-файлов (например, для обмена или резервного копирования).</td>
            <td>Выбранные вами для импорта файлы считываются на вашем устройстве; экспортированные файлы записываются в выбранное вами место (например, в приложение «Файлы», через AirDrop или Mail) с использованием стандартного листа обмена iOS.</td>
          </tr>
        </tbody>
      </table>

      <h2>Какие данные мы не собираем</h2>

      <ul>
        <li>Мы не используем SDK аналитики, рекламы или отчётов о сбоях.</li>
        <li>Мы не используем собственные серверы, и Приложение не отправляет нам, а также каким-либо третьим лицам ваши поездки, историю местоположения, показания датчиков или любые иные персональные данные.</li>
        <li>Мы не используем технологии отслеживания (в значении, определённом в App Tracking Transparency от Apple) и не запрашиваем разрешение на отслеживание.</li>
        <li>Мы не собираем и не храним данные учётной записи, поскольку BikePilot не требует создания аккаунта или входа в систему.</li>
      </ul>

      <h2>Хранение данных и срок их хранения</h2>

      <p>
        Все данные поездок (GPS-треки, показатели скорости/каденса/пульса/температуры, настройки и записанные поездки) хранятся локально на вашем устройстве с использованием стандартных механизмов локального хранения Apple (<code>UserDefaults</code> и локальное хранилище приложения). Эти данные не синхронизируются самим Приложением с iCloud или каким-либо иным облачным сервисом, если только локальные данные Приложения не попадают в резервную копию устройства в iCloud как часть системного резервного копирования, которое управляется настройками iOS вашего устройства, а не BikePilot.
      </p>

      <p>
        Вы можете в любое время удалить все локально сохранённые данные поездок, удалив записанные поездки в Приложении либо удалив само Приложение с устройства, что приведёт к удалению всех его локальных данных в соответствии со стандартным поведением iOS при удалении приложений.
      </p>

      <h2>Импорт/экспорт GPX</h2>

      <p>
        BikePilot позволяет импортировать выбранные вами <code>.gpx</code>-файлы и экспортировать записанные поездки в виде <code>.gpx</code>-файлов с помощью листа обмена iOS. То, как вы распорядитесь экспортированным файлом (например, поделитесь им со сторонним сервисом), зависит от вас и регулируется политикой конфиденциальности соответствующей третьей стороны, а не настоящей Политикой.
      </p>

      <h2>Подписки (BikePilot PRO)</h2>

      <p>
        BikePilot предлагает дополнительную автоматически продлеваемую подписку («BikePilot PRO»), которая открывает доступ к дополнительным функциям. Покупка, продление и восстановление подписки полностью обрабатываются через StoreKit и вашу учётную запись Apple ID / App Store. Мы не получаем и не храним ваши платёжные данные — информация о покупке и выставлении счетов обрабатывается и хранится Apple в соответствии с <a href="https://www.apple.com/legal/privacy/">политикой конфиденциальности Apple</a>.
      </p>

      <h2>Конфиденциальность детей</h2>

      <p>
        BikePilot не предназначено для детей и не собирает сознательно персональные данные детей. Поскольку Приложение изначально не собирает и не передаёт нам персональные данные, Разработчик не хранит данные ни о каких пользователях, включая детей.
      </p>

      <h2>Ваши права</h2>

      <p>
        Поскольку все персональные данные, создаваемые при использовании BikePilot (история местоположения, данные поездок, показания датчиков), остаются на вашем устройстве и никогда не передаются нам, вы в любой момент сохраняете над ними полный контроль: вы можете просматривать, экспортировать или удалять их непосредственно в Приложении либо путём удаления Приложения. Поскольку мы не храним ваши персональные данные в наших системах, отдельная процедура запроса доступа, исправления или удаления таких данных через нас не требуется.
      </p>

      <p>
        Если у вас есть вопросы по настоящей Политике или о том, как Приложение использует разрешения устройства, вы можете связаться с нами по указанным ниже контактным данным.
      </p>

      <h2>Изменения настоящей Политики</h2>

      <p>
        Мы можем время от времени обновлять настоящую Политику конфиденциальности, например, чтобы отразить новые функции Приложения. Дата «Последнее обновление» в начале этого документа указывает, когда в него в последний раз вносились изменения. Продолжение использования Приложения после внесения изменений означает принятие обновлённой Политики.
      </p>
