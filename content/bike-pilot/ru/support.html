      <h2>Часто задаваемые вопросы</h2>

      <h3>GPS и отслеживание местоположения</h3>

      <p><strong>Мне кажется, что скорость/расстояние/маршрут определяются неточно.</strong></p>

      <p>
        Точность GPS зависит от вашего устройства, погоды и окружающей обстановки (например, высокие здания, туннели, плотная крона деревьев и т. п. могут ухудшать сигнал). Убедитесь, что для доступа к геолокации выбрано значение «При использовании приложения» или «Всегда» в Настройки → Конфиденциальность и безопасность → Службы геолокации → BikePilot, а сами Службы геолокации включены на уровне системы.
      </p>

      <p><strong>Приложение перестало записывать поездку, когда я заблокировал(а) телефон / переключился(лась) в другое приложение.</strong></p>

      <p>
        BikePilot использует обновления геолокации в фоновом режиме, чтобы продолжать запись, когда устройство заблокировано или вы пользуетесь другим приложением. Убедитесь, что разрешение на доступ к геолокации выдано и что режим энергосбережения не слишком жёстко ограничивает фоновую активность, поскольку на некоторых устройствах это может влиять на частоту обновления GPS.
      </p>

      <h3>Bluetooth-датчики</h3>

      <p><strong>Мой датчик пульса / скорости и каденса / температуры не подключается.</strong></p>

      <ol>
        <li>Убедитесь, что датчик включён и находится в зоне действия (обычно 1–2 метра во время сопряжения).</li>
        <li>Проверьте, что Bluetooth включён в настройках iOS и что у BikePilot есть разрешение на использование Bluetooth (Настройки → Конфиденциальность и безопасность → Bluetooth → BikePilot).</li>
        <li>Некоторые датчики могут быть подключены только к одному приложению одновременно — перед подключением в BikePilot отключите датчик от любого другого приложения (например, другого велосипедного или фитнес-приложения).</li>
        <li>Попробуйте перезапустить датчик (если применимо, извлеките и снова вставьте батарейку) и повторно выполнить поиск в настройках датчиков приложения.</li>
      </ol>

      <p><strong>Мой датчик постоянно отключается во время поездки.</strong></p>

      <p>
        Обычно это связано с низким зарядом батареи датчика, расстоянием до устройства или помехами Bluetooth. Как правило, проблему решает замена батарейки датчика и размещение телефона в пределах устойчивой зоны связи.
      </p>

      <h3>Высота и уклон</h3>

      <p><strong>Показания высоты/уклона выглядят неточными.</strong></p>

      <p>
        BikePilot использует барометр вашего устройства вместе с GPS для оценки высоты и уклона. Показания барометра со временем могут немного смещаться или зависеть от резких изменений погоды; это аппаратное ограничение, а не неисправность Приложения.
      </p>

      <h3>Импорт/экспорт GPX</h3>

      <p><strong>Как экспортировать поездку?</strong></p>

      <p>
        Откройте поездку в истории поездок и воспользуйтесь функцией поделиться/экспорта, чтобы сохранить её как <code>.gpx</code>-файл, который затем можно сохранить в приложении «Файлы», передать через AirDrop на другое устройство или отправить по электронной почте либо через другое приложение.
      </p>

      <p><strong>Как импортировать GPX-трек (например, для навигации)?</strong></p>

      <p>
        Используйте функцию импорта в Приложении и выберите <code>.gpx</code>-файл в приложении «Файлы» (для этого требуется доступ к папкам Documents/Downloads — при первом использовании появится запрос).
      </p>

      <h3>Подписка BikePilot PRO</h3>

      <p><strong>Как оформить / отменить подписку BikePilot PRO?</strong></p>

      <p>
        Управление подписками полностью осуществляется через Apple ID. Чтобы оформить подписку, воспользуйтесь предложением обновления внутри Приложения. Чтобы просмотреть, изменить или отменить подписку, откройте Настройки → [Ваше имя] → Подписки либо App Store → значок профиля → Подписки.
      </p>

      <p><strong>Я оформил(а) подписку, но функции PRO не разблокировались.</strong></p>

      <p>
        Попробуйте воспользоваться опцией «Restore Purchases» в настройках Приложения или на экране обновления. Если после перезапуска Приложения проблема сохраняется, свяжитесь с нами и укажите адрес электронной почты Apple ID (не сообщайте пароль Apple ID) и примерную дату покупки, чтобы мы могли помочь разобраться.
      </p>

      <p><strong>С меня списали деньги, но я не хотел(а) продлевать подписку / хочу вернуть средства.</strong></p>

      <p>
        Возвраты средств и вопросы выставления счетов обрабатываются напрямую Apple, а не Разработчиком. Вы можете запросить возврат на <a href="https://reportaproblem.apple.com">reportaproblem.apple.com</a> или через Настройки → [Ваше имя] → Подписки на вашем устройстве.
      </p>

      <h3>Конфиденциальность</h3>

      <p>
        BikePilot хранит все данные о ваших поездках локально на вашем устройстве и не использует серверную инфраструктуру. Подробную информацию о том, к каким данным получает доступ Приложение и как они используются, см. в нашей <a href="privacy-policy.html">Политике конфиденциальности</a>.
      </p>

        <li>Если Приложение аварийно завершает работу или ведёт себя непредсказуемо, пожалуйста, напишите нам, что произошло, и укажите модель устройства и версию iOS, чтобы мы могли провести проверку.</li>
      </ul>
