    <template id="doc-content" data-doc-title="Integritetspolicy">
      <p><em>Senast uppdaterad: 2026-08-11</em></p>

      <p>
        Denna integritetspolicy beskriver hur BikePilot ("appen", "vi", "oss") hanterar information när du använder appen. BikePilot utvecklas och publiceras av Sebastian Gasch ("utvecklaren").
      </p>

      <h2>Sammanfattning</h2>

      <p>
        BikePilot är utformad för att fungera helt och hållet på din enhet. Vi driver ingen backendserver, vi samlar inte in analysdata och vi säljer eller delar inte dina personuppgifter med tredje part. Appen spårar dig inte mellan appar eller webbplatser som ägs av andra företag.
      </p>

      <h2>Information som appen får åtkomst till</h2>

      <p>
        För att tillhandahålla sin centrala funktion som cykeldator begär BikePilot åtkomst till följande funktioner på enheten. Åtkomst begärs endast när det behövs och endast med ditt samtycke via de vanliga behörighetsdialogerna i iOS.
      </p>

      <table>
        <thead>
          <tr>
            <th>Data / behörighet</th>
            <th>Syfte</th>
            <th>Var den lagras</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>Plats (GPS)</strong> ("Vid användning")</td>
            <td>Mäta hastighet, sträcka, höjd och lutning samt registrera din rutt på kartan under en tur.</td>
            <td>Endast på din enhet, som en del av din lokala turhistorik.</td>
          </tr>
          <tr>
            <td><strong>Rörelse och fitness (barometer)</strong></td>
            <td>Uppskatta höjdförändringar och lutning medan du cyklar.</td>
            <td>Endast på din enhet; lagras inte som råa sensordata utöver den pågående sessionen.</td>
          </tr>
          <tr>
            <td><strong>Bluetooth</strong></td>
            <td>Ansluta till dina egna Bluetooth Low Energy (BLE)-sensorer — pulsmätare, hastighets- och kadenssensor, temperatursensor — för att visa livedata under turen.</td>
            <td>Sensoravläsningar bearbetas på din enhet i realtid och lagras lokalt som en del av dina turdata; BikePilot överför inga sensordata någonstans.</td>
          </tr>
          <tr>
            <td><strong>Filer (åtkomst till mapparna Dokument/Hämtade filer)</strong></td>
            <td>Låta dig importera <code>.gpx</code>-spårfiler som du uttryckligen väljer, och exportera dina registrerade turer som <code>.gpx</code>-filer (t.ex. för att dela eller säkerhetskopiera dem).</td>
            <td>Filer som du väljer att importera läses på din enhet; exporterade filer skrivs till den plats du väljer (t.ex. appen Filer, AirDrop, Mail) via den vanliga delningspanelen i iOS.</td>
          </tr>
        </tbody>
      </table>

      <h2>Data som vi inte samlar in</h2>

      <ul>
        <li>Vi använder inga SDK:er för analys, annonsering eller kraschrapportering.</li>
        <li>Vi driver inga egna servrar, och appen skickar inte dina turer, din platshistorik, sensoravläsningar eller några andra personuppgifter till oss eller till någon tredje part.</li>
        <li>Vi använder inga spårningstekniker (så som de definieras i Apples ramverk App Tracking Transparency) och begär inte tillstånd för spårning.</li>
        <li>Vi samlar inte in eller lagrar kontoinformation, eftersom BikePilot inte kräver att du skapar konto eller loggar in.</li>
      </ul>

      <h2>Lagring och bevarande av data</h2>

      <p>
        Alla turdata (GPS-spår, hastighets-/kadens-/puls-/temperaturavläsningar, inställningar och registrerade turer) lagras lokalt på din enhet med Apples vanliga lagringsmekanismer på enheten (<code>UserDefaults</code> och lokal applagring). Dessa data synkroniseras inte till iCloud eller någon annan molntjänst av appen själv, såvida inte enhetens egen iCloud-enhetsbackup inkluderar appens lokala data som en del av en säkerhetskopia på systemnivå, vilket styrs av dina iOS-inställningar, inte av BikePilot.
      </p>

      <p>
        Du kan när som helst radera alla turdata som lagras lokalt genom att ta bort registrerade turer i appen eller genom att radera appen från din enhet, vilket tar bort alla dess lokala data i enlighet med iOS-standardbeteende vid radering av appar.
      </p>

      <h2>GPX-import/export</h2>

      <p>
        BikePilot låter dig importera <code>.gpx</code>-filer som du väljer och exportera dina registrerade turer som <code>.gpx</code>-filer via delningspanelen i iOS. Vad du gör med en exporterad fil (t.ex. delar den med en tredjepartstjänst) är ditt eget val och regleras av den tredje partens egna integritetspraxis, inte av denna policy.
      </p>

      <h2>Prenumerationer (BikePilot PRO)</h2>

      <p>
        BikePilot erbjuder en valfri prenumeration med automatisk förnyelse ("BikePilot PRO") som låser upp ytterligare funktioner. Köp, förnyelser och återställning av prenumerationen hanteras helt av Apples StoreKit och ditt Apple ID / App Store-konto. Vi får inte tillgång till och lagrar inte dina betalningsuppgifter — köp- och faktureringsdata behandlas och bevaras av Apple i enlighet med <a href="https://www.apple.com/legal/privacy/">Apples integritetspolicy</a>.
      </p>

      <h2>Barns integritet</h2>

      <p>
        BikePilot riktar sig inte till barn och samlar inte medvetet in personuppgifter från barn. Eftersom appen över huvud taget inte samlar in eller överför personuppgifter till oss bevaras inga data om någon användare, inklusive barn, av utvecklaren.
      </p>

      <h2>Dina rättigheter</h2>

      <p>
        Eftersom alla personuppgifter som skapas genom användning av BikePilot (platshistorik, turdata, sensoravläsningar) stannar på din enhet och aldrig överförs till oss, har du full kontroll över dem hela tiden: du kan visa, exportera eller radera dem direkt i appen eller genom att ta bort appen. Eftersom vi inte har några av dina personuppgifter i våra system finns det ingen separat process för begäran om tillgång, rättelse eller radering att skicka till oss avseende dessa data.
      </p>

      <p>
        Om du har frågor om denna policy eller om hur appen hanterar enhetsbehörigheter kan du kontakta oss med hjälp av uppgifterna nedan.
      </p>

      <h2>Ändringar i denna policy</h2>

      <p>
        Vi kan uppdatera denna integritetspolicy då och då, till exempel för att återspegla nya funktioner i appen. Datumet "Senast uppdaterad" högst upp i detta dokument anger när policyn senast reviderades. Fortsatt användning av appen efter en ändring innebär att du godkänner den uppdaterade policyn.
      </p>
