      <h2>2. Beskrivning av appen</h2>

      <p>
        BikePilot är en cykeldatorapp som använder enhetens GPS, barometer och valfria Bluetooth Low Energy (BLE)-sensorer (puls, hastighet och kadens, temperatur) för att visa och registrera turdata som hastighet, sträcka, höjd, lutning och rutt på en karta. Vissa funktioner är endast tillgängliga med en valfri prenumeration med automatisk förnyelse ("BikePilot PRO"), enligt beskrivningen nedan.

      </p>

        <li>Betalning debiteras ditt Apple ID-konto när köpet bekräftas.</li>
        <li>Prenumerationer förnyas automatiskt för samma period och till det då aktuella priset, såvida inte automatisk förnyelse stängs av minst 24 timmar före slutet av den aktuella perioden.</li>
        <li>Ditt Apple ID-konto debiteras för förnyelsen inom 24 timmar före utgången av den aktuella perioden.</li>

        <li>Eventuell outnyttjad del av en kostnadsfri provperiod, om sådan erbjuds, förverkas när du köper en prenumeration, i tillämpliga fall.</li>
