    <template id="doc-content" data-doc-title="Політика конфіденційності">
      <p><em>Останнє оновлення: 2026-08-11</em></p>

      <p>
        Ця Політика конфіденційності описує, як BikePilot («Застосунок», «ми», «нас») обробляє інформацію, коли Ви користуєтеся застосунком. BikePilot розробляє та публікує Sebastian Gasch («Розробник»).
      </p>

      <h2>Коротко</h2>

      <p>
        BikePilot створено так, щоб він працював повністю на Вашому пристрої. Ми не використовуємо серверну інфраструктуру, не збираємо аналітику та не продаємо й не передаємо Ваші персональні дані третім особам. Застосунок не відстежує Вас в інших застосунках або на вебсайтах, що належать іншим компаніям.
      </p>

      <h2>До яких даних має доступ Застосунок</h2>

      <p>
        Щоб забезпечити основні функції велокомп’ютера, BikePilot запитує доступ до таких можливостей пристрою. Доступ запитується лише за потреби та лише з Вашого дозволу, наданого через стандартні діалогові вікна дозволів iOS.
      </p>

      <table>
        <thead>
          <tr>
            <th>Дані / дозвіл</th>
            <th>Призначення</th>
            <th>Де зберігається</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>Location (GPS)</strong> («When In Use»)</td>
            <td>Вимірювання швидкості, дистанції, висоти та ухилу, а також запис Вашого маршруту на мапі під час поїздки.</td>
            <td>Лише на Вашому пристрої, як частина локальної історії поїздок.</td>
          </tr>
          <tr>
            <td><strong>Motion &amp; Fitness (barometer)</strong></td>
            <td>Оцінка перепадів висоти та ухилу під час поїздки.</td>
            <td>Лише на Вашому пристрої; необроблені дані сенсорів не зберігаються довше за поточну сесію.</td>
          </tr>
          <tr>
            <td><strong>Bluetooth</strong></td>
            <td>Підключення до Ваших Bluetooth Low Energy (BLE) сенсорів — пульсометра, сенсора швидкості й каденсу, температурного сенсора — для відображення даних поїздки в реальному часі.</td>
            <td>Показники сенсорів обробляються на Вашому пристрої в реальному часі та зберігаються локально як частина даних поїздки; BikePilot нікуди не передає дані сенсорів.</td>
          </tr>
          <tr>
            <td><strong>Files (Documents/Downloads folder access)</strong></td>
            <td>Дає змогу імпортувати вибрані Вами файли маршрутів <code>.gpx</code> і експортувати записані поїздки у форматі <code>.gpx</code> (наприклад, для поширення або резервного копіювання).</td>
            <td>Вибрані для імпорту файли зчитуються на Вашому пристрої; експортовані файли записуються у вибране Вами місце (наприклад, застосунок Files, AirDrop, Mail) через стандартне вікно поширення iOS.</td>
          </tr>
        </tbody>
      </table>

      <h2>Які дані ми не збираємо</h2>

      <ul>
        <li>Ми не використовуємо SDK для аналітики, реклами чи звітів про збої.</li>
        <li>Ми не використовуємо власні сервери, а Застосунок не надсилає нам чи будь-яким третім особам Ваші поїздки, історію місцезнаходження, показники сенсорів або будь-які інші персональні дані.</li>
        <li>Ми не застосовуємо технології відстеження (у значенні, визначеному в Apple's App Tracking Transparency framework) і не запитуємо дозвіл на відстеження.</li>
        <li>Ми не збираємо й не зберігаємо інформацію облікового запису, оскільки BikePilot не вимагає створення облікового запису чи входу.</li>
      </ul>

      <h2>Зберігання даних і строки зберігання</h2>

      <p>
        Усі дані поїздок (GPS-треки, показники швидкості/каденсу/пульсу/температури, налаштування та записані поїздки) зберігаються локально на Вашому пристрої за допомогою стандартних механізмів локального зберігання Apple (<code>UserDefaults</code> і локальне сховище застосунку). Ці дані не синхронізуються із iCloud або будь-яким іншим хмарним сервісом самим Застосунком, якщо лише резервна копія пристрою в iCloud не включає локальні дані Застосунку як частину системного резервного копіювання; це контролюється Вашими налаштуваннями iOS, а не BikePilot.
      </p>

      <p>
        Ви можете будь-коли видалити всі локально збережені дані поїздок: видаливши записані поїздки в Застосунку або видаливши сам Застосунок із пристрою, що прибере всі його локальні дані відповідно до стандартної поведінки iOS під час видалення застосунків.
      </p>

      <h2>Імпорт/експорт GPX</h2>

      <p>
        BikePilot дає змогу імпортувати вибрані Вами файли <code>.gpx</code> та експортувати записані поїздки у файли <code>.gpx</code> за допомогою вікна поширення iOS. Те, що Ви робите з експортованим файлом (наприклад, передаєте його сторонньому сервісу), залежить виключно від Вас і регулюється політикою конфіденційності відповідної третьої сторони, а не цією Політикою.
      </p>

      <h2>Підписки (BikePilot PRO)</h2>

      <p>
        BikePilot пропонує необов’язкову автопоновлювану підписку («BikePilot PRO»), яка відкриває додаткові функції. Оформлення, поновлення та відновлення підписки повністю здійснюються через StoreKit та Ваш обліковий запис Apple ID / App Store. Ми не отримуємо й не зберігаємо Вашу платіжну інформацію — дані про покупки та оплату обробляє і зберігає Apple відповідно до <a href="https://www.apple.com/legal/privacy/">Apple's Privacy Policy</a>.
      </p>

      <h2>Конфіденційність дітей</h2>

      <p>
        BikePilot не призначений для дітей і не збирає свідомо персональні дані дітей. Оскільки Застосунок узагалі не збирає та не передає нам персональні дані, Розробник не зберігає даних про жодного користувача, зокрема й про дітей.
      </p>

      <h2>Ваші права</h2>

      <p>
        Оскільки всі персональні дані, що створюються під час користування BikePilot (історія місцезнаходження, дані поїздок, показники сенсорів), залишаються на Вашому пристрої та ніколи не передаються нам, Ви постійно зберігаєте над ними повний контроль: можете переглядати, експортувати або видаляти їх безпосередньо в Застосунку чи шляхом видалення Застосунку. Оскільки ми не зберігаємо Ваші персональні дані у власних системах, Вам не потрібно подавати нам окремі запити на доступ, виправлення чи видалення таких даних.
      </p>

      <p>
        Якщо у Вас є запитання щодо цієї Політики або того, як Застосунок використовує дозволи пристрою, Ви можете зв’язатися з нами за наведеними нижче контактними даними.
      </p>

      <h2>Зміни до цієї Політики</h2>

      <p>
        Ми можемо час від часу оновлювати цю Політику конфіденційності, наприклад, щоб відобразити нові функції Застосунку. Дата «Останнє оновлення» у верхній частині цього документа вказує, коли до нього востаннє вносили зміни. Подальше використання Застосунку після змін означає прийняття оновленої Політики.
      </p>
