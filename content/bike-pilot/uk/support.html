      <p><em>Останнє оновлення: 2026-08-11</em></p>

      <p>
        Потрібна допомога з BikePilot? На цій сторінці зібрано поширені запитання, поради з усунення проблем і способи зв’язатися з нами для додаткової підтримки.
      </p>

      <h2>Контакти</h2>

      <p>
        Якщо нижче немає відповіді на Ваше запитання, напишіть нам електронного листа — ми відповімо якомога швидше:
      </p>

      <p>
        <strong>Електронна пошта:</strong> <a href="mailto:sebastian.gasch@outlook.com">sebastian.gasch@outlook.com</a>
      </p>

      <p>
        Щоб ми могли допомогти Вам швидше, будь ласка, додайте до повідомлення таку інформацію:
      </p>

      <ul>
        <li>Версія застосунку (Settings → About у Застосунку)</li>
        <li>Ваша версія iOS і модель пристрою</li>
        <li>Кроки для відтворення проблеми</li>
        <li>Знімки екрана або записи екрана, якщо доречно</li>
      </ul>

      <h2>Поширені запитання</h2>

      <h3>GPS і відстеження місцезнаходження</h3>

      <p><strong>Схоже, швидкість/дистанція/маршрут відображаються неточно.</strong></p>

      <p>
        Точність GPS залежить від Вашого пристрою, погоди та навколишніх умов (високі будівлі, тунелі, щільні крони дерев тощо можуть погіршувати сигнал). Переконайтеся, що для доступу до місцезнаходження в iOS вибрано «While Using the App» або «Always» у Settings → Privacy &amp; Security → Location Services → BikePilot, а також що Location Services увімкнено на рівні системи.
      </p>

      <p><strong>Застосунок перестав записувати поїздку, коли я заблокував(-ла) телефон / перейшов(-ла) в інший застосунок.</strong></p>

      <p>
        BikePilot використовує фонові оновлення геопозиції, щоб продовжувати запис, коли пристрій заблоковано або коли Ви користуєтеся іншим застосунком. Переконайтеся, що дозвіл на доступ до місцезнаходження надано, а режим Low Power Mode не надто агресивно обмежує фонову активність, що на деяких пристроях може впливати на частоту GPS-оновлень.
      </p>

      <h3>Bluetooth-сенсори</h3>

      <p><strong>Мій пульсометр / сенсор швидкості й каденсу / температурний сенсор не підключається.</strong></p>

      <ol>
        <li>Переконайтеся, що сенсор увімкнено і він перебуває в межах досяжності (зазвичай 1–2 метри під час сполучення).</li>
        <li>Перевірте, що Bluetooth увімкнено в налаштуваннях iOS і що BikePilot має дозвіл на Bluetooth (Settings → Privacy &amp; Security → Bluetooth → BikePilot).</li>
        <li>Деякі сенсори можуть бути підключені лише до одного застосунку одночасно — перед підключенням в BikePilot від’єднайте сенсор від будь-якого іншого застосунку (наприклад, іншого велозастосунку або фітнес-застосунку).</li>
        <li>Спробуйте перезапустити сенсор (за потреби вийміть і знову вставте батарейку) та повторно виконати пошук у налаштуваннях сенсорів Застосунку.</li>
      </ol>

      <p><strong>Мій сенсор постійно від’єднується посеред поїздки.</strong></p>

      <p>
        Зазвичай це спричинено низьким зарядом батареї сенсора, надто великою відстанню до пристрою або перешкодами для Bluetooth. У більшості випадків проблему вирішують заміна батареї сенсора та розміщення телефона в межах стабільної досяжності.
      </p>

      <h3>Висота й ухил</h3>

      <p><strong>Показники висоти/ухилу виглядають неточними.</strong></p>

      <p>
        BikePilot використовує барометр Вашого пристрою разом із GPS, щоб оцінювати висоту та ухил. Показники барометра можуть з часом дещо зміщуватися або змінюватися через різкі погодні коливання; це апаратне обмеження, а не несправність Застосунку.
      </p>

      <h3>Імпорт/експорт GPX</h3>

      <p><strong>Як експортувати поїздку?</strong></p>

      <p>
        Відкрийте поїздку в історії поїздок і скористайтеся опцією поширення/експорту, щоб зберегти її у файл <code>.gpx</code>, який потім можна зберегти в застосунок Files, передати через AirDrop на інший пристрій або надіслати електронною поштою чи через інший застосунок.
      </p>

      <p><strong>Як імпортувати GPX-маршрут (наприклад, для навігації)?</strong></p>

      <p>
        Скористайтеся опцією імпорту в Застосунку та виберіть файл <code>.gpx</code> у застосунку Files (потрібен доступ до папок Documents/Downloads — під час першого використання з’явиться відповідний запит).
      </p>

      <h3>Підписка BikePilot PRO</h3>

      <p><strong>Як оформити або скасувати підписку на BikePilot PRO?</strong></p>

      <p>
        Підписками повністю керує Ваш Apple ID. Щоб оформити підписку, скористайтеся пропозицією оновлення всередині Застосунку. Щоб переглянути, змінити або скасувати підписку, перейдіть у Settings → [your name] → Subscriptions або в застосунку App Store: значок Вашого профілю → Subscriptions.
      </p>

      <p><strong>Я оформив(-ла) підписку, але PRO-функції не розблоковано.</strong></p>

      <p>
        Спробуйте скористатися опцією «Restore Purchases» у налаштуваннях Застосунку або на екрані оновлення. Якщо після перезапуску Застосунку проблема не зникне, напишіть нам і вкажіть адресу електронної пошти Вашого Apple ID (не повідомляйте пароль від Apple ID) та приблизну дату покупки, щоб ми могли допомогти з перевіркою.
      </p>

      <p><strong>З мене списали кошти, але я не хотів(-ла) продовжувати підписку / хочу отримати повернення коштів.</strong></p>

      <p>
        Повернення коштів і питання білінгу обробляє безпосередньо Apple, а не Розробник. Ви можете запросити повернення коштів на <a href="https://reportaproblem.apple.com">reportaproblem.apple.com</a> або через Settings → [your name] → Subscriptions на Вашому пристрої.
      </p>

      <h3>Конфіденційність</h3>

      <p>
        BikePilot зберігає всі дані Ваших поїздок локально на Вашому пристрої та не використовує серверну інфраструктуру. Детальну інформацію про те, до яких даних має доступ Застосунок і як вони використовуються, дивіться в нашій <a href="privacy-policy.html">Політиці конфіденційності</a>.
      </p>

      <h3>Загальні поради з усунення проблем</h3>

      <ul>
        <li>Переконайтеся, що у Вас встановлено найновішу версію BikePilot з App Store.</li>
        <li>Перезапуск Застосунку або пристрою часто вирішує тимчасові проблеми (наприклад, з підключенням сенсорів або затримкою GPS-фіксації).</li>
        <li>Якщо Застосунок завершує роботу з помилкою або поводиться непередбачувано, будь ласка, опишіть нам, що сталося, і додайте модель пристрою та версію iOS, щоб ми могли це дослідити.</li>
      </ul>

      </p>
