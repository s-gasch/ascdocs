      <p><em>Останнє оновлення: 2026-08-11</em></p>

      <p>
        Ці Умови користування («Умови») регулюють використання Вами мобільного застосунку BikePilot («Застосунок»), розробленого та опублікованого Sebastian Gasch («Розробник», «ми», «нас»). Завантажуючи, встановлюючи або використовуючи Застосунок, Ви погоджуєтеся дотримуватися цих Умов, а також стандартної <a href="https://www.apple.com/legal/internet-services/itunes/dev/stdeula/">Licensed Application End User License Agreement (EULA)</a> від Apple, яка застосовується додатково до цих Умов. Якщо Ви не погоджуєтеся, не використовуйте Застосунок.
      </p>

      <h2>1. Ліцензія</h2>

      <p>
        За умови дотримання Вами цих Умов Розробник надає Вам обмежену, невиключну, непередавану, відкличну ліцензію на використання Застосунку на пристроях бренду Apple, якими Ви володієте або які контролюєте, виключно для Вашого особистого некомерційного користування, відповідно до правил використання App Store та стандартної EULA від Apple, на яку наведено посилання вище.
      </p>

      <h2>2. Опис Застосунку</h2>

      <p>
        BikePilot — це застосунок-велокомп’ютер, який використовує GPS, барометр і додаткові Bluetooth Low Energy (BLE) сенсори Вашого пристрою (пульс, швидкість і каденс, температура) для відображення та запису даних поїздки, зокрема швидкості, дистанції, висоти, ухилу та маршруту на мапі. Деякі функції доступні лише в межах необов’язкової автопоновлюваної підписки («BikePilot PRO»), як описано нижче.
      </p>

      <h2>3. Не є пристроєм безпеки чи медичним пристроєм</h2>

      <p>
        BikePilot надається виключно з інформаційною та рекреаційною метою. Він <strong>не</strong> є медичним пристроєм і <strong>не</strong> призначений для діагностики, лікування, запобігання будь-яким захворюванням чи станам здоров’я, а також не замінює професійне медичне, навігаційне чи безпекове судження. Показники GPS, барометра та Bluetooth-сенсорів (зокрема пульсу) можуть бути неточними, надходити із затримкою або бути недоступними через апаратні обмеження, умови довкілля, погоду чи проблеми зі з’єднанням.
      </p>

      <p>
        <strong>Ви несете повну відповідальність за власну безпеку під час їзди на велосипеді.</strong> Завжди зосереджуйте основну увагу на дорозі, русі транспорту та оточенні. Не покладайтеся на Застосунок як на єдине джерело навігації чи фізіологічного моніторингу та проконсультуйтеся з кваліфікованим лікарем перед інтенсивними фізичними навантаженнями, особливо якщо у Вас є наявні проблеми зі здоров’ям.
      </p>

      <h2>4. Ваш контент і дані</h2>

      <p>
        Записи поїздок, GPS-треки та дані сенсорів, які Ви створюєте за допомогою Застосунку, зберігаються локально на Вашому пристрої, як описано в нашій <a href="privacy-policy.html">Політиці конфіденційності</a>. Ви самостійно відповідаєте за створення резервних копій (наприклад, шляхом експорту поїздок у файли <code>.gpx</code>) — Розробник не несе відповідальності за будь-яку втрату даних поїздок унаслідок втрати чи пошкодження пристрою, видалення Застосунку або змін операційної системи.
      </p>

      <p>
        Якщо Ви імпортуєте у Застосунок файли <code>.gpx</code>, Ви підтверджуєте, що маєте право використовувати ці дані і що таке використання не порушує прав будь-яких третіх осіб.
      </p>

      <h2>5. Підписки (BikePilot PRO)</h2>

      <ul>
        <li>BikePilot пропонує необов’язкову автопоновлювану підписку, яка відкриває додаткові функції («BikePilot PRO») і доступна в місячному або річному плані.</li>
        <li>Оплата списується з Вашого облікового запису Apple ID після підтвердження покупки.</li>
        <li>Підписка автоматично поновлюється на той самий строк і за актуальною на той момент ціною, якщо автопоновлення не вимкнено щонайменше за 24 години до завершення поточного періоду.</li>
        <li>Оплата за поновлення буде списана з Вашого облікового запису Apple ID протягом 24 годин до завершення поточного періоду.</li>
        <li>Ви можете будь-коли керувати підпискою та вимкнути автопоновлення в налаштуваннях свого облікового запису Apple ID відповідно до правил Apple; Розробник не має доступу, щоб скасувати або змінити Вашу підписку безпосередньо.</li>
        <li>Будь-яка невикористана частина безплатного пробного періоду, якщо такий пропонується, анулюється після придбання підписки, де це застосовно.</li>
        <li>Усі платежі, повернення коштів і спори щодо білінгу обробляє Apple відповідно до <a href="https://www.apple.com/legal/internet-services/itunes/">Apple Media Services Terms and Conditions</a>. Розробник не обробляє платежі безпосередньо й не може оформлювати повернення коштів.</li>
      </ul>

      <h2>6. Належне використання</h2>

      <p>
        Ви погоджуєтеся не:
      </p>

      <ul>
        <li>використовувати Застосунок із будь-якою протиправною метою або в спосіб, що порушує будь-який застосовний закон чи нормативний акт;</li>
        <li>намагатися здійснювати реверс-інжиніринг, декомпіляцію або вилучення вихідного коду Застосунку, за винятком випадків, коли таке обмеження заборонене застосовним законодавством;</li>
        <li>втручатися в роботу Застосунку чи порушувати її або намагатися отримати несанкціонований доступ до будь-яких систем, пов’язаних із Застосунком.</li>
      </ul>

      <h2>7. Інтелектуальна власність</h2>

      <p>
        Застосунок, включно з його дизайном, кодом, графікою та торговельними марками, належить Розробнику й захищений застосовним законодавством про інтелектуальну власність. Ці Умови не надають Вам жодних прав на торговельні марки, логотипи чи бренд-активи Розробника, окрім тих, що необхідні для використання Застосунку за його призначенням.
      </p>
