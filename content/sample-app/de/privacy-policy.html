      <h2>Überblick</h2>
      <p>
        Sample App ("wir", "uns") respektiert Ihre Privatsphäre. Diese Datenschutzerklärung erklärt,
        welche Informationen wir erheben, wie wir sie verwenden und welche Wahlmöglichkeiten Sie haben.
      </p>

      <h2>Erhobene Informationen</h2>
      <ul>
        <li>Von Ihnen bereitgestellte Kontoinformationen (z. B. E-Mail-Adresse).</li>
        <li>Automatisch erfasste Nutzungsdaten (z. B. Gerätetyp, Absturzprotokolle).</li>
      </ul>

      <h2>Verwendung der Informationen</h2>
      <p>
        Wir verwenden erhobene Informationen, um Sample App zu betreiben, zu warten und zu
        verbessern sowie um mit Ihnen über Ihr Konto zu kommunizieren.
      </p>

      <h2>Weitergabe von Daten</h2>
      <p>
        Wir verkaufen Ihre persönlichen Informationen nicht. Wir können Daten mit Dienstleistern
        teilen, die uns beim Betrieb von Sample App unterstützen, unter Vertraulichkeitspflichten.
      </p>

      <h2>Ihre Wahlmöglichkeiten</h2>
      <p>
        Sie können Zugang zu, Berichtigung von oder Löschung Ihrer persönlichen Informationen
        beantragen, indem Sie uns über die Seite <a href="support.html">Support</a> kontaktieren.
      </p>

      <h2>Kontakt</h2>
      <p>Fragen zu dieser Richtlinie? Kontaktieren Sie uns über die Seite <a href="support.html">Support</a>.</p>
