      <h2>Przegląd</h2>
      <p>
        Sample App ("my") szanuje Twoją prywatność. Ta Polityka prywatności wyjaśnia, jakie
        informacje zbieramy, jak je wykorzystujemy i jakie masz wybory.
      </p>

      <h2>Zbierane informacje</h2>
      <ul>
        <li>Informacje o koncie podane przez Ciebie (np. adres e-mail).</li>
        <li>Dane użytkowania zbierane automatycznie (np. typ urządzenia, logi awarii).</li>
      </ul>

      <h2>Jak wykorzystujemy informacje</h2>
      <p>
        Wykorzystujemy zebrane informacje do obsługi, utrzymania i ulepszania Sample App oraz do
        komunikacji z Tobą w sprawie Twojego konta.
      </p>

      <h2>Kontakt</h2>

        Pytania dotyczące tej polityki? Skontaktuj się z nami przez stronę Support (dostępną
        obecnie w wersji angielskiej — zob. fallback językowy, docs/authoring-guide.md).
      </p>
